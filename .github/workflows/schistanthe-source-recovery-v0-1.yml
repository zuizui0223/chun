name: Schistanthe exact-source recovery v0.1

on:
  pull_request:
    paths:
      - 'scripts/recover_schistanthe_source_bytes_v0_1.py'
      - 'tests/test_recover_schistanthe_source_bytes_v0_1.py'
      - 'data/schistanthe_source_recovery_v0_1.json'
      - 'docs/SCHISTANTHE_SOURCE_RECOVERY_V0_1.md'
      - '.github/workflows/schistanthe-source-recovery-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install pytest biopython
      - name: Unit tests
        run: pytest -q tests/test_recover_schistanthe_source_bytes_v0_1.py
      - name: Recover exact source bytes
        run: python scripts/recover_schistanthe_source_bytes_v0_1.py --outdir build/schistanthe_source_v0_1
      - name: Assert outcome firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/schistanthe_source_v0_1/source_receipt.json'))
          assert x['row_level_color_values_interpreted'] is False
          assert x['state_frequencies_computed'] is False
          assert x['hidden_memory_auc_computed'] is False
          print(x['status'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schistanthe-exact-source-recovery-v0-1
          path: build/schistanthe_source_v0_1/
