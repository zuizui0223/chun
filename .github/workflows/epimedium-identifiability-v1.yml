name: epimedium-identifiability-v1
on:
  push:
    branches: [analysis/falsification-audit-v1]
    paths:
      - 'scripts/audit_epimedium_endpoint_identifiability_v1.py'
      - '.github/workflows/epimedium-identifiability-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests biopython
      - name: Regenerate frozen source/topology admission
        run: |
          python scripts/probe_epimedium_fine_state_access_v1.py
          python scripts/summarize_epimedium_admission_v1.py
      - name: Regenerate prospective endpoint unchanged
        run: python scripts/analyze_epimedium_fine_state_falsification_v1.py
      - name: Audit endpoint identifiability
        run: python scripts/audit_epimedium_endpoint_identifiability_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epimedium-identifiability-v1
          path: |
            analysis/_generated/epimedium_fine_state_falsification_v1/
            analysis/_generated/epimedium_endpoint_identifiability_v1/
          if-no-files-found: warn
