name: Ruellia51 source preflight v0.1

on:
  pull_request:
    paths:
      - 'scripts/diagnose_ruellia51_figshare_metadata_v0_1.py'
      - 'scripts/diagnose_ruellia51_csv_headers_v0_1.py'
      - 'data/ruellia51_source_preflight_receipt_v0_1.json'
      - 'docs/RUELLIA51_SOURCE_PREFLIGHT_V0_1.md'
      - '.github/workflows/ruellia51-source-preflight-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert outcome result remains absent
        run: test ! -e results/ruellia51_hplc_resolution_profile_v0_1
      - name: Query Figshare metadata only
        run: python scripts/diagnose_ruellia51_figshare_metadata_v0_1.py
      - name: Download exact CSV bytes and inspect headers only
        run: python scripts/diagnose_ruellia51_csv_headers_v0_1.py
      - name: Validate terminal tree-source hold and outcome firewall
        run: |
          python - <<'PY'
          import json
          m=json.load(open('build/ruellia51_figshare_metadata_v0_1.json'))
          h=json.load(open('build/ruellia51_csv_headers_v0_1.json'))
          r=json.load(open('data/ruellia51_source_preflight_receipt_v0_1.json'))
          assert m['status']=='FIGSHARE_METADATA_ONLY_OUTCOMES_UNOPENED'
          assert m['article_id']==30282448 and m['version']==2
          assert h['status']=='CSV_HEADERS_ONLY_OUTCOMES_UNOPENED' and h['data_rows_read']==0
          assert r['status']=='HOLD_TREE_SOURCE_OUTCOMES_UNOPENED'
          assert r['figshare_doi_version']=='10.6084/m9.figshare.30282448.v2'
          assert r['figshare_files']['raw_data.csv']['file_id']==58502635
          assert r['figshare_files']['raw_data.csv']['md5']=='0e3b9830abb1378f9546cd7d07ae1f97'
          assert r['figshare_files']['raw_data.csv']['role']=='PRIMARY_HPLC_SOURCE_FOR_FROZEN_CHUN_PROFILE'
          assert r['header_only_verification']['data_rows_read']==0
          assert r['author_code_tree_contract']['expected_tree_path']=='color data/color data/phylogeny/03-Ruellia_phylo.timed.tre'
          assert r['author_code_tree_contract']['tree_present_in_figshare_v2_manifest'] is False
          assert r['author_code_tree_contract']['tree_present_in_author_github_commit_tree'] is False
          assert r['crosswalk']['executed'] is False and r['crosswalk']['frozen'] is False
          assert all(v is False for v in r['outcome_firewall'].values()), r['outcome_firewall']
          assert r['paper1_science_changed'] is False
          print({'status':r['status'],'primary_source':r['figshare_files']['raw_data.csv'],'tree':r['author_code_tree_contract']['expected_tree_path']})
          PY
      - name: Confirm Paper 1 science firewall
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- manuscript data/paper1_authoritative_results_v0_2_2.csv data/paper1_main_figure_manifest_v0_2_2.csv
      - uses: actions/upload-artifact@v4
        with:
          name: ruellia51-source-preflight-v0-1
          path: |
            build/ruellia51_figshare_metadata_v0_1.json
            build/ruellia51_csv_headers_v0_1.json
            data/ruellia51_source_preflight_receipt_v0_1.json
          retention-days: 90
