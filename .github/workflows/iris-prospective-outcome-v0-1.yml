name: Iris prospective intermediate-resolution outcome v0.1

on:
  pull_request:
    paths:
      - 'scripts/run_iris_prospective_resolution_test_v0_1.py'
      - 'scripts/run_iris_prospective_resolution_test_entry_v0_1.py'
      - 'scripts/materialize_iris_frozen_taxon_map_v0_1.py'
      - '.github/workflows/iris-prospective-outcome-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prospective-outcome:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Assert frozen contracts are byte-unchanged on outcome branch
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main...HEAD -- \
            data/intermediate_resolution_rule_prereg_v0_1.json \
            data/iris_source_schema_erratum_v0_1.json \
            data/iris_source_taxon_crosswalk_v0_1.csv \
            data/iris_tree_record_semantics_v0_1.json

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check biopython pandas openpyxl numpy scipy

      - name: Revalidate pre-outcome contracts
        run: |
          python scripts/ingest_iris_postfreeze_rows_v0_1.py --out /tmp/iris_ingest.json >/dev/null
          python scripts/validate_iris_source_schema_erratum_v0_1.py --ingest-receipt /tmp/iris_ingest.json
          python scripts/validate_iris_tree_record_semantics_v0_1.py
          python scripts/validate_iris_source_taxon_crosswalk_v0_1.py --out /tmp/iris_crosswalk.json

      - name: Download the already-frozen trait-blind primary tree artifact
        uses: actions/download-artifact@v4
        with:
          name: iris-primary-trait-blind-tree-v0-1
          path: build/frozen_tree_artifact
          repository: zuizui0223/chun
          run-id: 34732460066
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify frozen tree provenance and hash before outcome exposure
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          from Bio import Phylo
          root=pathlib.Path('build/frozen_tree_artifact/iris_primary_tree')
          tree_path=root/'iris_primary.treefile'
          receipt=json.loads((root/'primary_tree_receipt.json').read_text())
          got=hashlib.sha256(tree_path.read_bytes()).hexdigest()
          assert receipt['tree_status']=='IRIS_PRIMARY_TRAIT_BLIND_TREE_BUILT'
          assert receipt['trait_values_used'] is False
          assert receipt['auc_computed'] is False
          assert receipt['decision_computed'] is False
          assert receipt['tree_sha256']=='59cd03e42fbf477f71833778d000d1f1a900b291888f7e17829a65106bf8b469'
          assert got==receipt['tree_sha256']
          tips=[t.name for t in Phylo.read(str(tree_path),'newick').get_terminals()]
          assert len(tips)==227 and len(set(tips))==227
          print({'tree_sha256':got,'tree_tips':len(tips),'trait_values_used':False,'auc_computed':False})
          PY

      - name: Materialize the frozen outcome-independent 226-row taxon map
        run: |
          python scripts/materialize_iris_frozen_taxon_map_v0_1.py \
            --tree build/frozen_tree_artifact/iris_primary_tree/iris_primary.treefile \
            --out build/iris_frozen_full_taxon_map_v0_1.csv

      - name: Open the preregistered Iris outcome exactly once
        run: |
          python scripts/run_iris_prospective_resolution_test_entry_v0_1.py \
            --tree build/frozen_tree_artifact/iris_primary_tree/iris_primary.treefile \
            --crosswalk build/iris_frozen_full_taxon_map_v0_1.csv \
            --out results/iris_intermediate_resolution_v0_1/iris_intermediate_resolution_result_v0_1.json

      - name: Assert terminal result is immutable-classified
        run: |
          python - <<'PY'
          import json
          p='results/iris_intermediate_resolution_v0_1/iris_intermediate_resolution_result_v0_1.json'
          x=json.load(open(p))
          assert x['status']=='IRIS_PROSPECTIVE_INTERMEDIATE_RESOLUTION_PRIMARY_RESULT'
          assert x['decision'] in {'PASS','MIXED','FAIL'}
          assert x['seed']==20260913 and x['permutations']==9999
          assert x['post_hoc_upgrade_allowed'] is False
          print('TERMINAL_DECISION='+x['decision'])
          print('OBSERVED='+json.dumps(x['observed'],sort_keys=True))
          print('PVALUES='+json.dumps(x['empirical_p_one_sided'],sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: iris-prospective-intermediate-resolution-outcome-v0-1
          path: |
            results/iris_intermediate_resolution_v0_1/iris_intermediate_resolution_result_v0_1.json
            build/iris_frozen_full_taxon_map_v0_1.csv
            build/frozen_tree_artifact/iris_primary_tree/primary_tree_receipt.json
            build/frozen_tree_artifact/iris_primary_tree/iris_primary.treefile
          retention-days: 90
