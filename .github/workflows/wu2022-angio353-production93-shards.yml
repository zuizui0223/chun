name: Wu 2022 Angiosperms353 runtime-assembled shard recovery

on:
  pull_request:
    paths:
      - 'data/wu2022_public_backbone_manifest_v0_3.csv'
      - 'data/wu2022_tpia_runtime_exclusions_v0_1.csv'
      - 'scripts/build_wu2022_angio353_backbone_panel.py'
      - 'scripts/slice_wu2022_angio353_panel.py'
      - 'scripts/download_tpia_panel_assemblies.py'
      - 'scripts/extract_angio353_pilot_hits.py'
      - 'scripts/aggregate_wu_angio353_best_hits.py'
      - '.github/workflows/wu2022-angio353-production93-shards.yml'
  workflow_dispatch:

concurrency:
  group: wu-angio353-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUNTIME_TAXA: '91'

jobs:
  recover:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build runtime-admitted nuclear panel and shard
        run: |
          python scripts/build_wu2022_angio353_backbone_panel.py \
            --manifest data/wu2022_public_backbone_manifest_v0_3.csv \
            --runtime-exclusions data/wu2022_tpia_runtime_exclusions_v0_1.csv \
            --output build/full_panel.csv --summary build/full_panel_summary.json \
            --expected-total 98 --expected-frozen-assembled 93 --expected-frozen-raw 5 \
            --expected-runtime-assembled "$RUNTIME_TAXA"
          python scripts/slice_wu2022_angio353_panel.py \
            --panel build/full_panel.csv --output build/shard_panel.csv \
            --expected-total "$RUNTIME_TAXA" --shard ${{ matrix.shard }} --n-shards 6
      - name: Install marker-recovery tools
        run: |
          sudo apt-get install -y -qq diamond-aligner
          python -m pip install --disable-pip-version-check requests
      - name: Fetch Angiosperms353 targets
        run: |
          mkdir -p build/targets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/mossmatters/Angiosperms353/master/Angiosperms353.FAA \
            -o build/targets/Angiosperms353.FAA
          test $(grep -c '^>' build/targets/Angiosperms353.FAA) -gt 4000
          diamond makedb --in build/targets/Angiosperms353.FAA --db build/targets/Angiosperms353
      - name: Download and provenance-audit shard transcriptomes serially
        run: |
          python scripts/download_tpia_panel_assemblies.py \
            --panel build/shard_panel.csv --out-dir build/assemblies \
            --workers 1 --read-timeout 90 --wall-timeout 1800 --retries 1 \
            --allow-partial
      - name: Recover translated Angiosperms353 hits
        run: |
          mkdir -p build/hits
          find build/assemblies/fastas -name '*.fna' -print0 | \
            xargs -0 -n1 -P2 bash -c '
              fa="$0"; base=$(basename "$fa" .fna)
              diamond blastx --db build/targets/Angiosperms353 \
                --query "$fa" --out "build/hits/${base}.tsv" \
                --outfmt 6 qseqid sseqid pident length qlen slen evalue bitscore qstart qend sstart send qseq_translated \
                --evalue 1e-5 --max-target-seqs 5 --max-hsps 1 --mid-sensitive --threads 2
            '
      - name: Freeze all qualifying best hits for later full-panel occupancy
        run: |
          python scripts/extract_angio353_pilot_hits.py \
            --panel build/shard_panel.csv --hits-dir build/hits --out-dir build/markers \
            --min-subject-coverage 0.45 --min-aa 80 --min-occupancy 0.0 \
            --allow-missing-taxa
          test -s build/markers/best_hits.csv
      - name: Stage compact shard result
        if: always()
        run: |
          mkdir -p build/result
          cp -f build/full_panel_summary.json build/result/ 2>/dev/null || true
          cp -f build/shard_panel.csv build/result/
          cp -f build/assemblies/archive_provenance.csv build/result/ 2>/dev/null || true
          cp -f build/assemblies/download_summary.json build/result/ 2>/dev/null || true
          cp -f build/assemblies/download_failures.json build/result/ 2>/dev/null || true
          cp -f build/markers/best_hits.csv build/result/ 2>/dev/null || true
          cp -f build/markers/summary.json build/result/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wu-angio353-runtime-shard-${{ matrix.shard }}
          path: build/result
          if-no-files-found: error

  aggregate:
    needs: recover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild authoritative runtime panel
        run: |
          python scripts/build_wu2022_angio353_backbone_panel.py \
            --manifest data/wu2022_public_backbone_manifest_v0_3.csv \
            --runtime-exclusions data/wu2022_tpia_runtime_exclusions_v0_1.csv \
            --output build/full_panel.csv --summary build/full_panel_summary.json \
            --expected-total 98 --expected-frozen-assembled 93 --expected-frozen-raw 5 \
            --expected-runtime-assembled "$RUNTIME_TAXA"
      - uses: actions/download-artifact@v4
        with:
          pattern: wu-angio353-runtime-shard-*
          path: build/shards
      - name: Aggregate global marker occupancy
        run: |
          test $(find build/shards -name best_hits.csv | wc -l) -eq 6
          python scripts/aggregate_wu_angio353_best_hits.py \
            --panel build/full_panel.csv \
            --best-hit-glob 'build/shards/**/best_hits.csv' \
            --output-dir build/global_occupancy \
            --expected-taxa "$RUNTIME_TAXA" --min-occupancy 0.80
          python - <<'PY'
          import json
          s=json.load(open('build/global_occupancy/summary.json'))
          assert s['n_panel_taxa']==91
          assert s['n_input_files']==6
          assert s['candidate_loci']>=300
          assert s['admitted_loci']>=250
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wu-angio353-runtime91-global-occupancy
          path: |
            build/full_panel_summary.json
            build/global_occupancy/
          if-no-files-found: error
