name: Cross-radiation EL v0.7 hierarchical-memory figures

on:
  pull_request:
    paths:
      - 'scripts/build_cross_radiation_el_v0_7_hierarchical_memory_figures.py'
      - 'tests/test_cross_radiation_el_v0_7_hierarchical_memory_figures.py'
      - 'data/cross_radiation_el_v0_7_figure_manifest_v0_1.csv'
      - '.github/workflows/cross-radiation-el-v0-7-hierarchical-memory-figures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install matplotlib numpy pandas pytest
      - name: Figure-builder tests
        run: pytest -q tests/test_cross_radiation_el_v0_7_hierarchical_memory_figures.py
      - name: Build candidate figures
        run: |
          python scripts/build_cross_radiation_el_v0_7_hierarchical_memory_figures.py \
            --outdir build/cross_radiation_el_v0_7_figures
      - name: Assert five figure files
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('build/cross_radiation_el_v0_7_figures')
          x=json.load(open(p/'figure_build_manifest_v0_1.json'))
          assert x['status']=='EL_V0_7_HIERARCHICAL_MEMORY_FIGURES_BUILT'
          assert len(x['figures'])==5
          assert all((p/r['filename']).stat().st_size>1000 for r in x['figures'])
          print([(r['figure'],r['filename'],r['bytes']) for r in x['figures']])
          PY
      - name: Validate v0.7 candidate remains pending
        run: python scripts/validate_cross_radiation_el_v0_7_hierarchical_memory.py
      - name: Confirm frozen v0.3 science
        run: python scripts/validate_cross_radiation_el_v0_3_science_freeze_v0_1.py
      - uses: actions/upload-artifact@v4
        with:
          name: cross-radiation-el-v0-7-hierarchical-memory-figures
          path: build/cross_radiation_el_v0_7_figures/
