name: Gesnerioideae FAIL informativeness audit v0.1

on:
  pull_request:
    paths:
      - 'requirements/requirements-gesnerioideae.txt'
      - 'scripts/audit_gesnerioideae_fail_informativeness_v0_1.py'
      - 'results/gesnerioideae_fail_informativeness_v0_1/**'
      - 'docs/GESNERIOIDEAE_FAIL_INFORMATIVENESS_V0_1.md'
      - '.github/workflows/gesnerioideae-fail-informativeness-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r requirements/requirements-gesnerioideae.txt
      - name: Rebuild frozen identifier frame
        run: |
          python scripts/preflight_gesnerioideae_biochemical_crosswalk_v0_1.py \
            --tree data/source_snapshots/gesnerioideae_verified_source_tree_v0_1.nex \
            --out-json build/gesnerioideae_biochemical_crosswalk_v0_1.json \
            --out-tree build/gesnerioideae_biochemical_pruned_tree_v0_1.newick
      - name: Rebuild frozen state frame
        run: |
          python scripts/gate_gesnerioideae_biochemical_state_support_v0_1.py \
            --crosswalk-json build/gesnerioideae_biochemical_crosswalk_v0_1.json \
            --out build/gesnerioideae_biochemical_state_support_v0_1.json \
            --frame-out build/gesnerioideae_biochemical_state_frame_v0_1.json
      - name: Audit exact null critical effect
        run: |
          python scripts/audit_gesnerioideae_fail_informativeness_v0_1.py \
            --gate build/gesnerioideae_biochemical_state_support_v0_1.json \
            --frame build/gesnerioideae_biochemical_state_frame_v0_1.json \
            --tree build/gesnerioideae_biochemical_pruned_tree_v0_1.newick \
            --frozen-result results/gesnerioideae_biochemical_hidden_memory_v0_1/summary_v0_1.json \
            --schistanthe-result results/schistanthe_hidden_memory_v0_1/result_v0_1.json \
            --out build/gesnerioideae_fail_informativeness_v0_1.json
      - name: Validate frozen diagnostic
        run: |
          python - <<'PY'
          import json
          g=json.load(open('build/gesnerioideae_fail_informativeness_v0_1.json'))
          f=json.load(open('results/gesnerioideae_fail_informativeness_v0_1/summary_v0_1.json'))
          assert g==f, (g,f)
          assert g['prospective_terminal_status']=='PROSPECTIVE_GESNERIOIDEAE_BIOCHEMICAL_HIDDEN_MEMORY_FAIL'
          assert g['prospective_terminal_status_changed'] is False
          assert g['promotion_gate_pass_changed'] is False
          assert g['no_posthoc_rescue'] is True
          print('critical centered effect',g['one_sided_alpha_0_05_centered_effect_critical'])
          print('observed effect',g['observed_centered_effect'])
          print('Schistanthe effect',g['schistanthe_prospective_centered_effect'])
          print('Schistanthe-sized point effect crosses threshold',g['schistanthe_sized_point_effect_would_cross_gesnerioideae_null_critical_value'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesnerioideae-fail-informativeness-v0-1
          path: build/
