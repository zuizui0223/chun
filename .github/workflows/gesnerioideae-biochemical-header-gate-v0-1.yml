name: Gesnerioideae biochemical header gate v0.1

on:
  pull_request:
    paths:
      - 'scripts/probe_gesnerioideae_biochemical_headers_v0_1.py'
      - 'tests/test_probe_gesnerioideae_biochemical_headers_v0_1.py'
      - 'data/gesnerioideae_biochemical_header_gate_v0_1.json'
      - 'docs/GESNERIOIDEAE_BIOCHEMICAL_HEADER_GATE_V0_1.md'
      - '.github/workflows/gesnerioideae-biochemical-header-gate-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install pytest openpyxl requests
      - name: Unit tests
        run: pytest -q tests/test_probe_gesnerioideae_biochemical_headers_v0_1.py
      - name: Probe exact supplementary workbook headers only
        run: python scripts/probe_gesnerioideae_biochemical_headers_v0_1.py --out build/gesnerioideae_biochemical_header_gate_v0_1.json
      - name: Assert row-level outcome firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/gesnerioideae_biochemical_header_gate_v0_1.json'))
          assert x['data_rows_read']==0
          assert x['state_frequencies_computed'] is False
          assert x['hidden_memory_auc_computed'] is False
          print(x['status'])
          print(x['header'])
          print(x['biochemical_column_candidates'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesnerioideae-biochemical-header-gate-v0-1
          path: build/
