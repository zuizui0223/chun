name: Wu 2022 TPIA assembly format audit

on:
  pull_request:
    paths:
      - '.github/workflows/wu2022-tpia-assembly-format-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download one representative Wu/TPIA assembly
        run: |
          mkdir -p build/wu_format/download
          # Use the live All-assemblies endpoint rather than the slower bulk endpoint.
          # C. albo-sericea is PRJNA665925 and its advertised assembly is relatively small.
          curl --fail --location --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            'https://tpia.teaplants.cn/web/All_assemblies/Fasta/194_Camellia%20albo-sericea.zip' \
            -o build/wu_format/download/Camellia_albo-sericea.zip
          ls -lh build/wu_format/download/Camellia_albo-sericea.zip
      - name: Inventory archive and sequence types
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile, gzip, json
          zp=Path('build/wu_format/download/Camellia_albo-sericea.zip')
          rec={'archive':zp.name,'bytes':zp.stat().st_size,'members':[]}
          with zipfile.ZipFile(zp) as z:
              for info in z.infolist():
                  if info.is_dir(): continue
                  name=info.filename
                  member={'name':name,'bytes_uncompressed':info.file_size}
                  with z.open(info) as fh: head=fh.read(min(info.file_size,1024*1024))
                  if name.lower().endswith('.gz'):
                      try: head=gzip.decompress(head)
                      except Exception: pass
                  txt=head.decode('utf-8',errors='ignore')
                  headers=[ln for ln in txt.splitlines() if ln.startswith('>')][:3]
                  seq=''.join(ln.strip() for ln in txt.splitlines() if ln and not ln.startswith('>'))[:5000].upper()
                  dna_frac=(sum(c in 'ACGT' for c in seq)/len(seq)) if seq else None
                  member['first_headers']=headers
                  member['dna_fraction_first5k']=dna_frac
                  member['classification']='nucleotide_like' if dna_frac is not None and dna_frac>0.95 else ('protein_or_other' if seq else 'non_fasta_or_empty')
                  rec['members'].append(member)
          Path('build/wu_format/inventory.json').write_text(json.dumps(rec,indent=2)+'\n')
          print(json.dumps(rec,indent=2))
          PY
      - name: Report
        if: always()
        run: |
          echo '### Representative TPIA assembly archive inventory' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat build/wu_format/inventory.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wu2022-tpia-assembly-format-audit
          path: build/wu_format/inventory.json
          if-no-files-found: error
