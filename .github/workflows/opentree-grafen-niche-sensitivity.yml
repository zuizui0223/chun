name: OpenTree Grafen niche sensitivity

on:
  pull_request:
    paths:
      - 'data/fan2026_chelsa_species_compact_v0_1.csv'
      - 'scripts/run_opentree_grafen_niche_sensitivity.py'
      - '.github/workflows/opentree-grafen-niche-sensitivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy requests biopython
      - name: Run OpenTree topology sensitivity
        run: |
          mkdir -p build/opentree_sensitivity
          python scripts/run_opentree_grafen_niche_sensitivity.py \
            --species data/fan2026_chelsa_species_compact_v0_1.csv \
            --out-dir build/opentree_sensitivity
      - name: Report
        if: always()
        run: |
          echo '### OpenTree/Grafen BM-OU-EB sensitivity' >> "$GITHUB_STEP_SUMMARY"
          for f in summary.json aw_bm_pgls_topology_sensitivity.csv bm_ou_eb_topology_sensitivity.csv tnrs_matches.csv; do
            if [ -f "build/opentree_sensitivity/$f" ]; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "build/opentree_sensitivity/$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opentree-grafen-niche-sensitivity
          path: build/opentree_sensitivity
          if-no-files-found: warn
