name: Paper 1 AJB upload bundle v1.0 novelty-forward

on:
  pull_request:
    paths:
      - 'scripts/build_paper1_novelty_framing_v0_3_3.py'
      - 'scripts/run_paper1_novelty_framing_v0_3_3.py'
      - 'scripts/build_paper1_novelty_framing_v0_3_4.py'
      - 'scripts/build_paper1_submission_v1_0.py'
      - 'scripts/run_paper1_submission_v1_0.py'
      - 'scripts/build_paper1_ajb_docx_v1_0.py'
      - 'scripts/build_paper1_ajb_docx_v0_9.py'
      - 'scripts/build_paper1_ajb_docx_v0_8.py'
      - 'scripts/build_paper1_ajb_docx_v0_7.py'
      - 'scripts/build_paper1_ajb_bundle_v1_0.py'
      - 'scripts/build_paper1_ajb_bundle_v0_9.py'
      - 'scripts/audit_paper1_ajb_bundle_v0_9.py'
      - 'scripts/build_paper1_fig1_framework_v0_2_2.py'
      - 'scripts/build_paper1_fig2_molecular_v0_2_2.py'
      - 'scripts/build_paper1_fig2_molecular_v0_2.py'
      - 'scripts/build_paper1_fig3_fig4_audits_v0_2.py'
      - 'scripts/build_paper1_fig5_macro_v0_2.py'
      - 'scripts/build_paper1_fig6_identifiability_v0_2.py'
      - 'scripts/build_paper1_supp_figures_v0_2.py'
      - 'scripts/audit_paper1_ajb_bundle_v1_0.py'
      - 'scripts/check_paper1_ajb_bundle_determinism_v1_0.py'
      - 'tests/test_paper1_ajb_docx_determinism_v1_0.py'
      - 'requirements-paper1-submission.txt'
      - 'docs/PAPER1_AJB_UPLOAD_BUNDLE_V1_0_README.md'
      - 'docs/PAPER1_AJB_V1_0_COVER_LETTER_TEMPLATE.md'
      - 'docs/PAPER1_AJB_V1_0_SUBMISSION_CHECKLIST.md'
      - 'docs/PAPER1_STATE_IDENTITY_FRAMING_GATE_V0_1.md'
      - 'docs/PAPER1_JOURNAL_STRATEGY.md'
      - 'docs/PAPER1_JOURNAL_ESCALATION_GATE_V0_1.md'
      - 'docs/PAPER1_JOURNAL_ESCALATION_WEB_AND_PRIOR_ART_AUDIT_2026-08-28.md'
      - 'docs/PAPER1_EVOLUTION_LETTERS_SUBMISSION_ALTERNATIVE_V0_1.md'
      - 'docs/PAPER1_EVOLUTION_SUBMISSION_ALTERNATIVE_V0_1.md'
      - 'docs/PAPER1_AJB_SUBMISSION_BASELINE_V1_0.md'
      - 'docs/PAPER1_EVOLUTIONARY_EVENT_BOUNDARY_AMENDMENT_V0_1.md'
      - 'README.md'
      - 'data/paper1_reference_registry_v0_5.csv'
      - 'data/paper1_ajb_appendix_mapping_v0_5.csv'
      - '.github/workflows/paper1-ajb-upload-bundle-v1-0.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install submission dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-paper1-submission.txt
      - name: Test Paper 1 reproducibility primitives
        run: pytest -q tests/test_paper1_ajb_docx_determinism_v1_0.py
      - name: Build audited AJB v1.0 upload bundle twice
        run: |
          python scripts/build_paper1_ajb_bundle_v1_0.py \
            --out-dir build/paper1-ajb-upload-v1-0
          python scripts/build_paper1_ajb_bundle_v1_0.py \
            --out-dir build/paper1-ajb-upload-v1-0-repeat
      - name: Require byte-identical repeated bundle
        run: |
          python scripts/check_paper1_ajb_bundle_determinism_v1_0.py \
            --first build/paper1-ajb-upload-v1-0 \
            --second build/paper1-ajb-upload-v1-0-repeat
      - name: Report final manifest
        run: cat build/paper1-ajb-upload-v1-0/BUNDLE_MANIFEST.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-ajb-upload-bundle-v1-0
          path: build/paper1-ajb-upload-v1-0/
          if-no-files-found: error
