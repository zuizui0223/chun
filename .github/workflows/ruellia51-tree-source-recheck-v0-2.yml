name: Ruellia authoritative tree source recheck v0.2

on:
  pull_request:
    paths:
      - 'scripts/recheck_ruellia51_tree_source_v0_2.py'
      - 'data/ruellia51_tree_source_recheck_v0_2.json'
      - 'docs/RUELLIA51_TREE_SOURCE_RECHECK_V0_2.md'
      - '.github/workflows/ruellia51-tree-source-recheck-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck current Figshare versions and author GitHub
        run: python scripts/recheck_ruellia51_tree_source_v0_2.py --out build/ruellia51_tree_source_recheck_v0_2.json
      - name: Assert source-only firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/ruellia51_tree_source_recheck_v0_2.json'))
          f=x['outcome_firewall']
          assert all(v is False for v in f.values())
          assert x['ruellia_specific_promotion_rule_changed'] is False
          assert x['paper1_science_changed'] is False
          assert x['el_v0_3_science_changed'] is False
          print(x['status'])
          print('located=',x['authoritative_target_tree_located'])
          if x.get('figshare'):
              print('figshare',x['figshare']['current_version'],x['figshare']['current_modified_date'])
              print('figshare target',x['figshare']['exact_target_hits'])
              print('figshare tree-like',x['figshare']['tree_like_hits'])
          if x.get('github'):
              print('github head',x['github']['head_sha'])
              print('github target',x['github']['exact_target_hits'])
              print('github tree-like',x['github']['tree_like_hits'])
              print('analysis target path',x['github']['analysis_expected_target_path_present'])
          PY
      - name: Validate frozen EL v0.3 science
        run: python scripts/validate_cross_radiation_el_v0_3_science_freeze_v0_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruellia51-tree-source-recheck-v0-2
          path: build/
