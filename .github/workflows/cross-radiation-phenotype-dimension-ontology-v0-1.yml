name: Cross-radiation phenotype-dimension ontology v0.1

on:
  pull_request:
    paths:
      - 'data/cross_radiation_phenotype_dimension_ontology_v0_1.csv'
      - 'data/cross_radiation_external_source_admission_v0_1.csv'
      - 'data/cross_radiation_phenotype_dimension_ontology_summary_v0_1.json'
      - 'data/cross_clade_mechanistic_recurrence_benchmark_v0_1.csv'
      - 'data/cross_radiation_resolution_tier_expansion_summary_v0_1.json'
      - 'scripts/summarize_cross_radiation_phenotype_dimension_ontology_v0_1.py'
      - 'docs/CROSS_RADIATION_PHENOTYPE_DIMENSION_ONTOLOGY_V0_1.md'
      - '.github/workflows/cross-radiation-phenotype-dimension-ontology-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild phenotype-dimension ontology summary
        run: |
          python scripts/summarize_cross_radiation_phenotype_dimension_ontology_v0_1.py \
            --out build/cross_radiation_phenotype_dimension_ontology_summary_v0_1.json
      - name: Verify frozen falsification result exactly
        run: |
          python - <<'PY'
          import json
          observed=json.load(open('build/cross_radiation_phenotype_dimension_ontology_summary_v0_1.json'))
          expected=json.load(open('data/cross_radiation_phenotype_dimension_ontology_summary_v0_1.json'))
          assert observed==expected, (observed, expected)
          assert observed['status']=='SPECIFICITY_ASYMMETRY_FALSIFIED_PHENOTYPE_DIMENSION_TARGET_ARCHITECTURE_RETAINED'
          assert observed['dimension_summary']['HUE_COMPOSITION']['branch_control_support']=='5/5'
          assert observed['dimension_summary']['PIGMENT_QUANTITY_CONTINUOUS']['systems']==2
          assert observed['dimension_summary']['PIGMENT_QUANTITY_CONTINUOUS']['interpretation']=='UNDERDETERMINED_HIGHEST_INFORMATION_GAP'
          assert observed['falsification']['direct_counterexample']=='PETUNIA_AXILLARIS_AN2_LOF_AT_LEAST_FIVE_INDEPENDENT_ALLELES'
          assert observed['next_gate'].startswith('FREEZE_A_CONTINUOUS_PIGMENT_QUANTITY_TARGET_CLASS_RULE')
          assert observed['paper1_science_changed'] is False
          print(json.dumps(observed, indent=2))
          PY
      - name: Confirm no superseded monotonic claim survives in ontology document
        run: |
          grep -q 'superseded claim' docs/CROSS_RADIATION_PHENOTYPE_DIMENSION_ONTOLOGY_V0_1.md
          grep -q 'largest current information gap' docs/CROSS_RADIATION_PHENOTYPE_DIMENSION_ONTOLOGY_V0_1.md
          ! grep -q 'hue is intrinsically more repeatable' docs/CROSS_RADIATION_PHENOTYPE_DIMENSION_ONTOLOGY_V0_1.md || \
            grep -q 'Do not infer:' docs/CROSS_RADIATION_PHENOTYPE_DIMENSION_ONTOLOGY_V0_1.md
      - name: Confirm Paper 1 science firewall
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- \
            manuscript \
            data/paper1_authoritative_results_v0_2_2.csv \
            data/paper1_main_figure_manifest_v0_2_2.csv || {
              echo 'Paper 1 science/manuscript changed unexpectedly' >&2
              exit 1
            }
