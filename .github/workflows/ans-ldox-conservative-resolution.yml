name: ANS-LDOX conservative sequence resolution

on:
  pull_request:
    paths:
      - 'data/ans_ldox_source_features_v0_1.csv'
      - 'data/ans_ldox_reference_accessions_v0_1.csv'
      - 'data/ans_ldox_reference_download_manifest_v0_1.csv'
      - 'data/ans_ldox_source_accessions_v0_1.csv'
      - 'data/creticulata_ans_reference_feature_effects_v0_1.csv'
      - 'data/ans_ldox_source_feature_decisions_v0_1.csv'
      - 'data/ans_ldox_primer_linkage_deduplicated_v0_1.csv'
      - 'data/ans_ldox_conservative_summary_v0_1.json'
      - 'data/pigment_node_source_id_crosswalk_v0_2.csv'
      - 'data/orthology_resolution_by_feature_v0_2.csv'
      - 'data/micro_accessibility_node_score_harmonized_v0_2.csv'
      - 'scripts/analyze_ans_ldox_sequence_resolution.py'
      - 'scripts/summarize_ans_ldox_conservative.py'
      - '.github/workflows/ans-ldox-conservative-resolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check requests biopython

      - name: Download frozen public sequence sources
        run: |
          mkdir -p build/ans_ldox_resolution/sources/tea build/ans_ldox_resolution/sources/oleifera
          python - <<'PY'
          import csv
          import hashlib
          import json
          import time
          import urllib.request
          from pathlib import Path

          rows = list(csv.DictReader(open('data/ans_ldox_source_accessions_v0_1.csv', encoding='utf-8-sig')))
          out = Path('build/ans_ldox_resolution/sources')
          manifest = []
          for row in rows:
              accession = row['accession']
              seq_type = row['sequence_type']
              rettype = 'fasta_cds_na' if seq_type == 'cds' else ('fasta_cds_aa' if seq_type == 'protein' else 'fasta')
              db = row['database']
              url = (
                  'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi'
                  f'?db={db}&id={accession}&rettype={rettype}&retmode=text'
              )
              target = out / row['local_path']
              target.parent.mkdir(parents=True, exist_ok=True)
              body = None
              error = None
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(url, timeout=90) as response:
                          body = response.read()
                      if body.startswith(b'>'):
                          break
                  except Exception as exc:
                      error = repr(exc)
                  time.sleep(2 ** attempt)
              if not body or not body.startswith(b'>'):
                  raise RuntimeError(f'failed to fetch {accession}: {error}')
              target.write_bytes(body)
              manifest.append({
                  'accession': accession,
                  'sequence_type': seq_type,
                  'local_path': row['local_path'],
                  'bytes': len(body),
                  'sha256': hashlib.sha256(body).hexdigest(),
                  'source_url': url,
              })
          with open(out / 'download_manifest.csv', 'w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(manifest[0]))
              writer.writeheader()
              writer.writerows(manifest)
          (out / 'download_summary.json').write_text(
              json.dumps({'n_files': len(manifest)}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Verify frozen source checksums
        run: |
          diff --strip-trailing-cr -u \
            data/ans_ldox_reference_download_manifest_v0_1.csv \
            build/ans_ldox_resolution/sources/download_manifest.csv

      - name: Run exploratory recovery
        run: |
          python scripts/analyze_ans_ldox_sequence_resolution.py \
            --source-features data/ans_ldox_source_features_v0_1.csv \
            --reference-accessions data/ans_ldox_reference_accessions_v0_1.csv \
            --tea-assembly-gff build/ans_ldox_resolution/sources/tea/tea_genomic.gff.gz \
            --tea-assembly-rna build/ans_ldox_resolution/sources/tea/tea_rna.fna.gz \
            --tea-assembly-cds build/ans_ldox_resolution/sources/tea/tea_cds.fna.gz \
            --tea-assembly-protein build/ans_ldox_resolution/sources/tea/tea_protein.faa.gz \
            --oleifera-assembly-gff build/ans_ldox_resolution/sources/oleifera/oleifera_genomic.gff.gz \
            --oleifera-assembly-rna build/ans_ldox_resolution/sources/oleifera/oleifera_rna.fna.gz \
            --oleifera-assembly-cds build/ans_ldox_resolution/sources/oleifera/oleifera_cds.fna.gz \
            --oleifera-assembly-protein build/ans_ldox_resolution/sources/oleifera/oleifera_protein.faa.gz \
            --reference-dir build/ans_ldox_resolution/sources/references \
            --out-dir build/ans_ldox_resolution/exploratory

      - name: Apply conservative sequence and provenance gates
        run: |
          python scripts/summarize_ans_ldox_conservative.py \
            --source-features data/ans_ldox_source_features_v0_1.csv \
            --exploratory-dir build/ans_ldox_resolution/exploratory \
            --effects data/creticulata_ans_reference_feature_effects_v0_1.csv \
            --out-dir build/ans_ldox_resolution/result

      - name: Verify frozen conservative result
        run: |
          diff --strip-trailing-cr -u \
            data/ans_ldox_source_feature_decisions_v0_1.csv \
            build/ans_ldox_resolution/result/source_feature_decisions.csv
          diff --strip-trailing-cr -u \
            data/ans_ldox_primer_linkage_deduplicated_v0_1.csv \
            build/ans_ldox_resolution/result/primer_linkage_deduplicated.csv
          diff --strip-trailing-cr -u \
            data/ans_ldox_conservative_summary_v0_1.json \
            build/ans_ldox_resolution/result/summary.json

      - name: Verify authoritative ledger state
        run: |
          python - <<'PY'
          import csv
          import json

          summary = json.load(open('data/ans_ldox_conservative_summary_v0_1.json'))
          assert summary['evidence_counts']['ANS_family_recurrence_clusters'] == 3
          assert summary['evidence_counts']['reference_lineage_anchored_clusters'] == 2
          assert summary['evidence_counts']['strict_crossspecies_exact_recurrence_clusters'] == 0

          orth = {r['feature']: r for r in csv.DictReader(open('data/orthology_resolution_by_feature_v0_2.csv'))}
          assert orth['ANS']['family_recurrence_clusters'] == '3'
          assert orth['ANS']['named_or_sequence_anchored_clusters'] == '2'
          assert orth['ANS']['strict_crossspecies_exact_recurrence_clusters'] == '0'

          score = {r['feature']: r for r in csv.DictReader(open('data/micro_accessibility_node_score_harmonized_v0_2.csv'))}
          assert score['ANS']['anchored_clusters'] == '2'
          assert score['ANS']['strict_node_predictor'] == '0'
          PY

      - name: Report
        if: always()
        run: |
          echo '### ANS/LDOX conservative sequence resolution' >> "$GITHUB_STEP_SUMMARY"
          for f in \
            result/summary.json \
            result/source_feature_decisions.csv \
            result/primer_linkage_deduplicated.csv \
            exploratory/summary.json \
            exploratory/protein_reference_similarity.csv \
            exploratory/primer_linkage.csv; do
            if [ -f "build/ans_ldox_resolution/$f" ]; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -c 150000 "build/ans_ldox_resolution/$f" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ans-ldox-conservative-sequence-resolution
          path: build/ans_ldox_resolution
          if-no-files-found: error
