name: Cleanup requirements migration artifacts

on:
  push:
    branches:
      - chore/requirements-directory-migration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/requirements-directory-migration
          fetch-depth: 0
      - name: Remove only newly added generated artifacts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          raw = subprocess.check_output([
              "git", "diff", "--name-only", "--diff-filter=A", "-z",
              "origin/main...HEAD",
          ])
          added = [s.decode("utf-8") for s in raw.split(b"\0") if s]
          generated = [
              p for p in added
              if p.startswith(("build/", ".pytest_cache/"))
              or "/__pycache__/" in p
              or p.endswith((".pyc", ".pyo"))
          ]
          if generated:
              subprocess.run(["git", "rm", "-f", "--", *generated], check=True)
          remain = subprocess.check_output(["git", "diff", "--cached", "--name-only", "-z"])
          print({
              "added_files_inspected": len(added),
              "generated_artifacts_removed": len(generated),
              "staged_file_count": len([x for x in remain.split(b"\0") if x]),
          })
          PY
      - name: Commit clean tree when needed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated artifacts remain."
          else
            git commit -m "Exclude generated artifacts from requirements migration"
            git push origin HEAD:chore/requirements-directory-migration
          fi
