name: epimedium-fine-state-endpoint-v1
on:
  push:
    branches: [analysis/falsification-audit-v1]
    paths:
      - 'analysis/epimedium_fine_state_admission_v1.json'
      - 'analysis/epimedium_fine_state_falsification_prefreeze_v1.md'
      - 'scripts/probe_epimedium_fine_state_access_v1.py'
      - 'scripts/summarize_epimedium_admission_v1.py'
      - 'scripts/analyze_epimedium_fine_state_falsification_v1.py'
      - '.github/workflows/epimedium-fine-state-endpoint-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests biopython
      - name: Regenerate source and exact OpenTree admission
        run: python scripts/probe_epimedium_fine_state_access_v1.py
      - name: Regenerate admission manifest candidate
        run: python scripts/summarize_epimedium_admission_v1.py
      - name: Open prefrozen co-primary biological endpoint
        run: python scripts/analyze_epimedium_fine_state_falsification_v1.py
      - name: Upload endpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epimedium-fine-state-endpoint-v1
          path: |
            analysis/_generated/epimedium_fine_state_access_v1/
            analysis/_generated/epimedium_fine_state_falsification_v1/
          if-no-files-found: warn
