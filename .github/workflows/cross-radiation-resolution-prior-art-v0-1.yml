name: Cross-radiation resolution prior-art v0.1

on:
  pull_request:
    paths:
      - 'data/cross_radiation_resolution_prior_art_v0_1.csv'
      - 'data/cross_radiation_resolution_prior_art_summary_v0_1.json'
      - 'docs/CROSS_RADIATION_RESOLUTION_PRIOR_ART_V0_1.md'
      - 'scripts/validate_cross_radiation_resolution_prior_art_v0_1.py'
      - '.github/workflows/cross-radiation-resolution-prior-art-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate targeted prior-art boundary
        run: |
          python scripts/validate_cross_radiation_resolution_prior_art_v0_1.py \
            --matrix data/cross_radiation_resolution_prior_art_v0_1.csv \
            --decision data/cross_radiation_resolution_prior_art_summary_v0_1.json \
            --out build/cross_radiation_resolution_prior_art_v0_1.json
      - name: Confirm no priority overclaim
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/cross_radiation_resolution_prior_art_v0_1.json'))
          assert x['status']=='PASS_WITHOUT_PRIORITY_CLAIM'
          assert x['priority_status']=='NO_FIRST_CLAIM_TARGETED_AUDIT_ONLY'
          assert x['representative_direct_integrated_match_found'] is False
          print(x)
          PY
      - name: Confirm Paper 1 science firewall
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- manuscript data/paper1_authoritative_results_v0_2_2.csv data/paper1_main_figure_manifest_v0_2_2.csv
