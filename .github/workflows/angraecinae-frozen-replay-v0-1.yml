name: Angraecinae frozen replay v0.1
on:
  pull_request:
    paths:
      - 'data/angraecinae_source_reanalysis_v0_1/**'
      - 'scripts/analyze_angraecinae_mk_v0_1.py'
      - 'scripts/audit_angraecinae_organ_signal_v0_1.py'
      - 'scripts/summarize_angraecinae_reanalysis_v0_1.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned inference dependencies
        run: python -m pip install 'numpy==2.2.6' 'biopython==1.85' 'scipy==1.15.3'
      - name: Recompute both frozen tree-reconstruction sensitivities
        run: |
          D=data/angraecinae_source_reanalysis_v0_1
          for REP in checkpoint_resume fresh_repeat; do
            mkdir -p "build/angraecinae/${REP}"
            python scripts/analyze_angraecinae_mk_v0_1.py --trees-dir "$D/trees/$REP" --sample-manifest "$D/source_sample_manifest.csv" --traits "$D/terminal_organ_states.csv" --out-dir "build/angraecinae/$REP"
            python scripts/audit_angraecinae_organ_signal_v0_1.py --trees-dir "$D/trees/$REP" --sample-manifest "$D/source_sample_manifest.csv" --traits "$D/terminal_organ_states.csv" --out "build/angraecinae/$REP/conditional_organ_state_results.json" --permutations 9999
          done
      - name: Verify frozen summary and input hashes
        run: |
          D=data/angraecinae_source_reanalysis_v0_1
          python scripts/summarize_angraecinae_reanalysis_v0_1.py --resumed build/angraecinae/checkpoint_resume --fresh build/angraecinae/fresh_repeat --manifest "$D/snapshot_manifest.json" --out build/angraecinae/analysis_summary.json --expected "$D/analysis_summary.json"
          cat build/angraecinae/analysis_summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: angraecinae-frozen-replay-v0-1
          path: build/angraecinae
          if-no-files-found: error
          retention-days: 90
