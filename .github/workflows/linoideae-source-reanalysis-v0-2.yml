name: Linoideae source reanalysis v0.2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install pymupdf==1.26.4 biopython==1.85 numpy==2.2.6 scipy==1.15.3
          sudo apt-get update -qq
          sudo apt-get install -y -qq mafft iqtree
      - name: Acquire original source files
        run: python scripts/ingest_linoideae_sources_v0_2.py --out-dir build/linoideae_source_v0_2
      - name: Recover sequence records and admit taxon-gene assignments
        run: python scripts/recover_linoideae_sequences_v0_2.py --source-dir build/linoideae_source_v0_2 --out-dir build/linoideae_source_v0_2/sequences
      - name: Align and concatenate metadata-validated source sequences
        run: python scripts/align_linoideae_sequences_v0_2.py --sequence-dir build/linoideae_source_v0_2/sequences --out-dir build/linoideae_source_v0_2/alignments
      - name: Independently infer two ML phylogenies
        run: |
          mkdir -p build/linoideae_source_v0_2/trees
          IQ=$(command -v iqtree2 || command -v iqtree)
          "$IQ" --version > build/linoideae_source_v0_2/iqtree_version.txt
          mafft --version 2> build/linoideae_source_v0_2/mafft_version.txt
          for variant in full occupancy50; do
            "$IQ" -s "build/linoideae_source_v0_2/alignments/${variant}.fasta" -p "build/linoideae_source_v0_2/alignments/${variant}.nex" -m GTR+G4 -o LINO001 -seed 20260907 -T 2 -B 1000 --bnni --prefix "build/linoideae_source_v0_2/trees/${variant}"
          done
      - name: Preserve exact analysis code and versions
        if: always()
        run: |
          mkdir -p build/linoideae_source_v0_2/repro_scripts
          cp scripts/*linoideae*v0_2.py build/linoideae_source_v0_2/repro_scripts/
          git rev-parse HEAD > build/linoideae_source_v0_2/ci_checkout_sha.txt
          python -m pip freeze > build/linoideae_source_v0_2/python_packages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linoideae-source-v0-2
          path: build/linoideae_source_v0_2
          if-no-files-found: error
