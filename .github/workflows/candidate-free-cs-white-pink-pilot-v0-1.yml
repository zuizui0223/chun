name: Candidate-free C. sinensis white-pink pilot v0.1

on:
  pull_request:
    paths:
      - 'data/candidate_free_cs_white_pink_run_manifest_v0_1.csv'
      - 'data/candidate_free_cs_stage_contrast_registry_v0_1.csv'
      - 'data/candidate_free_pigment_module_schema_v0_1.csv'
      - 'scripts/build_candidate_free_family_map_from_gff_v0_1.py'
      - 'scripts/aggregate_salmon_family_expression_v0_1.py'
      - 'scripts/score_candidate_free_modules_v0_1.py'
      - 'scripts/summarize_candidate_free_stage_series_v0_1.py'
      - '.github/workflows/candidate-free-cs-white-pink-pilot-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REF_ACCESSION: GCA_013676235.1
      MAX_SPOTS_PER_RUN: '500000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RNA-seq tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sra-toolkit salmon gffread unzip ca-certificates
          salmon --version
          fasterq-dump --version
          gffread --version

      - name: Reconstruct fixed transcriptome from genome and GFF
        run: |
          mkdir -p build/cs_white_pink_pilot_v0_1/reference
          curl -fsSL https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets -o build/cs_white_pink_pilot_v0_1/datasets
          chmod +x build/cs_white_pink_pilot_v0_1/datasets
          build/cs_white_pink_pilot_v0_1/datasets download genome accession "$REF_ACCESSION" \
            --include genome,gff3 \
            --filename build/cs_white_pink_pilot_v0_1/reference.zip
          unzip -q build/cs_white_pink_pilot_v0_1/reference.zip -d build/cs_white_pink_pilot_v0_1/reference/package
          GENOME_FASTA=$(find build/cs_white_pink_pilot_v0_1/reference/package -type f -name 'genomic.fna' | head -n1)
          GFF=$(find build/cs_white_pink_pilot_v0_1/reference/package -type f \( -name 'genomic.gff' -o -name '*.gff' -o -name '*.gff3' \) | head -n1)
          test -n "$GENOME_FASTA" && test -s "$GENOME_FASTA"
          test -n "$GFF" && test -s "$GFF"
          RNA_FASTA=build/cs_white_pink_pilot_v0_1/reference/reconstructed_transcripts.fna
          gffread "$GFF" -g "$GENOME_FASTA" -w "$RNA_FASTA"
          test -s "$RNA_FASTA"
          echo "RNA_FASTA=$RNA_FASTA" >> "$GITHUB_ENV"
          echo "GFF=$GFF" >> "$GITHUB_ENV"

      - name: Build outcome-independent family map and Salmon index
        run: |
          python scripts/build_candidate_free_family_map_from_gff_v0_1.py \
            --gff "$GFF" \
            --rna-fasta "$RNA_FASTA" \
            --out-dir build/cs_white_pink_pilot_v0_1/family_map
          python - <<'PY'
          import json
          s=json.load(open('build/cs_white_pink_pilot_v0_1/family_map/family_mapping_summary.json'))
          if s['n_mapped_transcripts']==0:
              raise SystemExit('fixed reference resolves no preregistered pigment family')
          print(json.dumps(s,indent=2,ensure_ascii=False))
          PY
          salmon index -t "$RNA_FASTA" -i build/cs_white_pink_pilot_v0_1/salmon_index -p 2

      - name: Quantify all 30 prespecified stage-matched runs
        run: |
          mkdir -p build/cs_white_pink_pilot_v0_1/quant build/cs_white_pink_pilot_v0_1/reads
          tail -n +2 data/candidate_free_cs_white_pink_run_manifest_v0_1.csv | cut -d, -f1 | while read -r RUN; do
            echo "Quantifying $RUN from first ${MAX_SPOTS_PER_RUN} SRA spots"
            rm -f build/cs_white_pink_pilot_v0_1/reads/${RUN}_1.fastq build/cs_white_pink_pilot_v0_1/reads/${RUN}_2.fastq
            rm -rf build/cs_white_pink_pilot_v0_1/reads/tmp_${RUN}
            mkdir -p build/cs_white_pink_pilot_v0_1/reads/tmp_${RUN}
            fasterq-dump "$RUN" \
              --split-files -e 2 -m 1GB \
              -t build/cs_white_pink_pilot_v0_1/reads/tmp_${RUN} \
              -O build/cs_white_pink_pilot_v0_1/reads \
              -X "$MAX_SPOTS_PER_RUN"
            test -s build/cs_white_pink_pilot_v0_1/reads/${RUN}_1.fastq
            test -s build/cs_white_pink_pilot_v0_1/reads/${RUN}_2.fastq
            salmon quant \
              -i build/cs_white_pink_pilot_v0_1/salmon_index -l A \
              -1 build/cs_white_pink_pilot_v0_1/reads/${RUN}_1.fastq \
              -2 build/cs_white_pink_pilot_v0_1/reads/${RUN}_2.fastq \
              --validateMappings -p 2 \
              -o build/cs_white_pink_pilot_v0_1/quant/${RUN}
            rm -f build/cs_white_pink_pilot_v0_1/reads/${RUN}_1.fastq build/cs_white_pink_pilot_v0_1/reads/${RUN}_2.fastq
            rm -rf build/cs_white_pink_pilot_v0_1/reads/tmp_${RUN}
          done

      - name: Aggregate candidate-free family expression
        run: |
          python scripts/aggregate_salmon_family_expression_v0_1.py \
            --quant-root build/cs_white_pink_pilot_v0_1/quant \
            --manifest data/candidate_free_cs_white_pink_run_manifest_v0_1.csv \
            --family-map build/cs_white_pink_pilot_v0_1/family_map/transcript_family_map.csv \
            --dataset-id CF_CS_01 \
            --min-percent-mapped 15 \
            --out build/cs_white_pink_pilot_v0_1/family_expression.csv

      - name: Score all five stage strata with frozen A/F/C/P modules
        run: |
          python scripts/score_candidate_free_modules_v0_1.py \
            --expression build/cs_white_pink_pilot_v0_1/family_expression.csv \
            --modules data/candidate_free_pigment_module_schema_v0_1.csv \
            --contrasts data/candidate_free_cs_stage_contrast_registry_v0_1.csv \
            --out-dir build/cs_white_pink_pilot_v0_1/scored
          python scripts/summarize_candidate_free_stage_series_v0_1.py \
            --effects build/cs_white_pink_pilot_v0_1/scored/contrast_effects.csv \
            --dependence-cluster CSIN_WHITE_PINK \
            --out-dir build/cs_white_pink_pilot_v0_1/stage_summary

      - name: Guard design without forcing biological direction
        run: |
          python - <<'PY'
          import json
          s=json.load(open('build/cs_white_pink_pilot_v0_1/stage_summary/stage_series_summary.json'))
          assert s['prespecified_stages']==['S1','S2','S3','S4','S5']
          assert set(s['axes'])=={'A','F','C','P'}
          assert all(x['n_stages_total']==5 for x in s['axes'].values())
          assert 'largest' in s['forbidden_rule']
          print(json.dumps(s,indent=2,ensure_ascii=False))
          PY

      - name: Preserve diagnostics
        if: always()
        run: |
          mkdir -p build/cs_white_pink_pilot_v0_1/diagnostics
          printf 'reference=%s\nmax_spots_per_run=%s\nruns=30\nstages=5\n' "$REF_ACCESSION" "$MAX_SPOTS_PER_RUN" > build/cs_white_pink_pilot_v0_1/diagnostics/run_contract.txt
          find build/cs_white_pink_pilot_v0_1 -maxdepth 3 -type f -printf '%p\t%s bytes\n' 2>/dev/null | sort > build/cs_white_pink_pilot_v0_1/diagnostics/files.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-free-cs-white-pink-pilot-v0-1
          path: |
            build/cs_white_pink_pilot_v0_1/family_map/
            build/cs_white_pink_pilot_v0_1/family_expression.csv
            build/cs_white_pink_pilot_v0_1/family_expression.summary.json
            build/cs_white_pink_pilot_v0_1/scored/
            build/cs_white_pink_pilot_v0_1/stage_summary/
            build/cs_white_pink_pilot_v0_1/diagnostics/
          if-no-files-found: warn
