name: ANR live diagnostic and freeze

on:
  pull_request:
    paths:
      - 'data/anr_reference_copy_targets_v0_1.csv'
      - 'data/orthology_resolution_by_feature_v0_2.csv'
      - 'data/micro_accessibility_node_score_harmonized_v0_2.csv'
      - 'data/pigment_node_source_id_crosswalk_v0_2.csv'
      - 'scripts/diagnose_anr_reference_copy_resolution.py'
      - 'scripts/freeze_anr_reference_copy_ledger.py'
      - '.github/workflows/anr-live-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mafft fasttree unzip
          python -m pip install --disable-pip-version-check biopython requests

      - name: Recover Longjing43 GFF and protein sources
        run: |
          mkdir -p build/anr/sources/longjing43
          python - <<'PY'
          import csv,pathlib,re,time,urllib.request
          registry=pathlib.Path('data/cnfls2_synteny_sources_v0_1.csv')
          rows=list(csv.DictReader(registry.open(encoding='utf-8-sig'))); selected=[]
          for row in rows:
              metadata=' '.join(f'{k} {v}' for k,v in row.items() if v and not re.match(r'^https?://',str(v).strip())).lower()
              if not any(x in metadata for x in ('longjing43','longjing 43','camellia sinensis','tea crosswalk','tea_longjing43')): continue
              for key,value in row.items():
                  value=str(value or '').strip()
                  if not re.match(r'^https?://',value): continue
                  context=f'{key} {value}'.lower()
                  if any(x in context for x in ('protein','proteome','.faa','pep')): selected.append(('protein',value))
                  elif any(x in context for x in ('gff','annotation')): selected.append(('gff',value))
          selected=list(dict.fromkeys(selected)); print('selected',selected)
          for kind in ('gff','protein'):
              options=[u for k,u in selected if k==kind]
              if not options: raise RuntimeError(f'no Longjing43 {kind} source')
              ok=False; err=None
              for url in options:
                  target=pathlib.Path(f'build/anr/sources/longjing43/longjing43.{"gff" if kind=="gff" else "protein.faa"}'+('.gz' if url.endswith('.gz') else ''))
                  for attempt in range(5):
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'chun-anr-live/0.2'})
                          with urllib.request.urlopen(req,timeout=180) as r: body=r.read()
                          if len(body)<1000: raise RuntimeError(f'too small: {len(body)}')
                          target.write_bytes(body); ok=True; print(kind,url,target,len(body)); break
                      except Exception as exc:
                          err=exc; time.sleep(2**attempt)
                  if ok: break
              if not ok: raise RuntimeError(f'failed Longjing43 {kind}: {err}')
          PY

      - name: Download NCBI tea reference and frozen effects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/anr/sources/refseq build/anr/effect_artifact
          base=https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/004/153/795/GCF_004153795.1_AHAU_CSS_1
          curl --fail --location --retry 5 "$base/GCF_004153795.1_AHAU_CSS_1_genomic.gff.gz" -o build/anr/sources/refseq/tea_refseq.gff.gz
          curl --fail --location --retry 5 "$base/GCF_004153795.1_AHAU_CSS_1_protein.faa.gz" -o build/anr/sources/refseq/tea_refseq.protein.faa.gz
          gh api repos/zuizui0223/chun/actions/artifacts/9287119758/zip > build/anr/effect_artifact.zip
          unzip -q build/anr/effect_artifact.zip -d build/anr/effect_artifact
          test -f build/anr/effect_artifact/effects/broad_homolog_audit.csv

      - name: Run diagnostic, alignment, and tree
        run: |
          long_gff=$(find build/anr/sources/longjing43 -type f -name '*.gff*' | head -n 1)
          long_prot=$(find build/anr/sources/longjing43 -type f -name '*.faa*' | head -n 1)
          python scripts/diagnose_anr_reference_copy_resolution.py \
            --targets data/anr_reference_copy_targets_v0_1.csv \
            --longjing43-gff "$long_gff" \
            --longjing43-proteins "$long_prot" \
            --refseq-gff build/anr/sources/refseq/tea_refseq.gff.gz \
            --refseq-proteins build/anr/sources/refseq/tea_refseq.protein.faa.gz \
            --effects build/anr/effect_artifact/effects/broad_homolog_audit.csv \
            --out-dir build/anr/result
          mafft --auto build/anr/result/anr_candidates.faa > build/anr/result/anr_candidates.aligned.faa
          FastTree build/anr/result/anr_candidates.aligned.faa > build/anr/result/anr_candidates.fasttree.nwk

      - name: Validate complete diagnostic
        run: |
          python - <<'PY'
          import csv,json
          s=json.load(open('build/anr/result/summary.json'))
          assert s['counts']['requested_reference_copies']==5
          assert s['counts']['recovered_reference_copies']==5
          assert s['counts']['effect_rows_recovered']==5
          assert s['anchor']['best_reference_target']=='gene-LOC114259095'
          assert s['anchor']['best_nongap_identity']>0.99
          assert s['reference_copy_direction_heterogeneity'] is True
          m=list(csv.DictReader(open('build/anr/result/source_protein_mapping.csv')))
          assert len({r['protein_accession'] for r in m if r['role']=='reference_copy'})==5
          PY

      - name: Freeze diagnostic and authoritative v0.3 ledgers
        run: |
          rm -rf data/anr_reference_copy_diagnostic_v0_1 build/anr_ledger
          mkdir -p data/anr_reference_copy_diagnostic_v0_1
          cp build/anr/result/*.csv data/anr_reference_copy_diagnostic_v0_1/
          cp build/anr/result/*.json data/anr_reference_copy_diagnostic_v0_1/
          cp build/anr/result/*.faa data/anr_reference_copy_diagnostic_v0_1/
          cp build/anr/result/*.nwk data/anr_reference_copy_diagnostic_v0_1/
          cp build/anr/result/ANR_REFERENCE_COPY_DIAGNOSTIC.md docs/ANR_REFERENCE_COPY_DIAGNOSTIC.md
          python scripts/freeze_anr_reference_copy_ledger.py \
            --diagnostic-dir data/anr_reference_copy_diagnostic_v0_1 \
            --orthology-v02 data/orthology_resolution_by_feature_v0_2.csv \
            --score-v02 data/micro_accessibility_node_score_harmonized_v0_2.csv \
            --crosswalk-v02 data/pigment_node_source_id_crosswalk_v0_2.csv \
            --out-dir build/anr_ledger
          cp build/anr_ledger/anr_conservative_summary_v0_1.json data/
          cp build/anr_ledger/orthology_resolution_by_feature_v0_3.csv data/
          cp build/anr_ledger/micro_accessibility_node_score_harmonized_v0_3.csv data/
          cp build/anr_ledger/pigment_node_source_id_crosswalk_v0_3.csv data/
          cp build/anr_ledger/ANR_CONSERVATIVE_RESOLUTION_RESULT.md docs/

      - name: Commit frozen ANR result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/anr_reference_copy_diagnostic_v0_1 data/anr_conservative_summary_v0_1.json data/orthology_resolution_by_feature_v0_3.csv data/micro_accessibility_node_score_harmonized_v0_3.csv data/pigment_node_source_id_crosswalk_v0_3.csv docs/ANR_REFERENCE_COPY_DIAGNOSTIC.md docs/ANR_CONSERVATIVE_RESOLUTION_RESULT.md
          if git diff --cached --quiet; then
            echo 'Frozen ANR outputs already match.'
          else
            git commit -m 'Freeze ANR copy-resolution result and v0.3 ledgers'
            git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anr-live-diagnostic
          path: build/anr
          if-no-files-found: error
