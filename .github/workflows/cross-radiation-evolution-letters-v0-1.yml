name: Cross-radiation Evolution Letters manuscript v0.1

on:
  pull_request:
    paths:
      - 'manuscript/CROSS_RADIATION_EVOLUTION_LETTERS_V0_1.md'
      - 'data/cross_radiation_evolution_letters_claim_registry_v0_1.json'
      - 'scripts/validate_cross_radiation_evolution_letters_v0_1.py'
      - '.github/workflows/cross-radiation-evolution-letters-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manuscript claims and Evolution Letters length gates
        run: python scripts/validate_cross_radiation_evolution_letters_v0_1.py
      - name: Confirm Camellia Paper 1 science firewall
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- \
            manuscript/PAPER1_AJB_MANUSCRIPT_V0_2.md \
            data/paper1_authoritative_results_v0_2_2.csv \
            data/paper1_main_figure_manifest_v0_2_2.csv
