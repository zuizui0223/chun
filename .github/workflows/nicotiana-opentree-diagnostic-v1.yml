name: nicotiana-opentree-diagnostic-v1

on:
  push:
    branches:
      - analysis/falsification-audit-v1
    paths:
      - 'scripts/inspect_nicotiana_opentree_v1.py'
      - '.github/workflows/nicotiana-opentree-diagnostic-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose-exact-tnrs:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install light dependencies
        run: python -m pip install --disable-pip-version-check requests biopython
      - name: Recover frozen source/trait audit from prior pre-endpoint run
        run: |
          mkdir -p analysis/_generated
          gh run download 34185987604 --repo zuizui0223/chun --name nicotiana-source-admission-v1 --dir analysis/_generated
          test -f analysis/_generated/nicotiana_source_v1/trait_audit.json
      - name: Diagnose exact TNRS/OpenTree admission
        run: python scripts/inspect_nicotiana_opentree_v1.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nicotiana-opentree-diagnostic-v1
          path: analysis/_generated/nicotiana_opentree_v1/
          if-no-files-found: warn
