name: Candidate-free C. reticulata mapping audit v0.1

on:
  pull_request:
    paths:
      - '.github/workflows/candidate-free-creticulata-mapping-audit-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch GEO and ENA metadata without accession-order inference
        run: |
          python - <<'PY'
          import csv,gzip,io,json,re,urllib.parse,urllib.request
          from pathlib import Path

          out=Path('build/creticulata_mapping_audit_v0_1')
          out.mkdir(parents=True,exist_ok=True)
          ua={'User-Agent':'chun-candidate-free-archive-audit/0.1 contact=github.com/zuizui0223/chun'}
          def get(url):
              req=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(req,timeout=120) as r:
                  return r.read()

          geo_url='https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE236364&targ=gsm&view=full&form=text'
          try:
              raw=get(geo_url)
              text=raw.decode('utf-8','replace')
              geo_route='NCBI_GEO_accession_text'
          except Exception as e:
              ftp='https://ftp.ncbi.nlm.nih.gov/geo/series/GSE236nnn/GSE236364/soft/GSE236364_family.soft.gz'
              raw=get(ftp)
              text=gzip.decompress(raw).decode('utf-8','replace')
              geo_route=f'GEO_family_soft_fallback_after:{type(e).__name__}'
          (out/'GSE236364_family.txt').write_text(text,encoding='utf-8')

          samples=[]
          cur=None
          for line in text.splitlines():
              if line.startswith('^SAMPLE = '):
                  if cur: samples.append(cur)
                  cur={'gsm':line.split('=',1)[1].strip(),'title':'','source':'','characteristics':[],'relations':[],'all_accessions':[]}
              elif cur is not None:
                  if line.startswith('!Sample_title = '): cur['title']=line.split('=',1)[1].strip()
                  elif line.startswith('!Sample_source_name_ch1 = '): cur['source']=line.split('=',1)[1].strip()
                  elif line.startswith('!Sample_characteristics_ch1 = '): cur['characteristics'].append(line.split('=',1)[1].strip())
                  elif line.startswith('!Sample_relation = '): cur['relations'].append(line.split('=',1)[1].strip())
                  cur['all_accessions'] += re.findall(r'(?:SRX|SRR|SRS|SAMN)\d+',line)
          if cur: samples.append(cur)
          # family SOFT can include non-sample records; SAMPLE blocks only are retained.
          by_srx={}
          for s in samples:
              for x in sorted(set(s['all_accessions'])):
                  if x.startswith('SRX'):
                      if x in by_srx and by_srx[x]['gsm']!=s['gsm']:
                          raise SystemExit(f'duplicate GEO SRX relation {x}')
                      by_srx[x]=s

          fields_raw=get('https://www.ebi.ac.uk/ena/portal/api/returnFields?result=read_run').decode('utf-8','replace')
          (out/'ena_read_run_fields.tsv').write_text(fields_raw,encoding='utf-8')
          available=set()
          for row in csv.DictReader(io.StringIO(fields_raw),delimiter='\t'):
              for k in ('columnId','field','id'):
                  if row.get(k): available.add(row[k])
          desired=['run_accession','experiment_accession','sample_accession','secondary_sample_accession','study_accession','secondary_study_accession','sample_alias','experiment_alias','library_name','sample_title','scientific_name','fastq_ftp','fastq_md5','fastq_bytes']
          fields=[x for x in desired if x in available]
          # run_accession should always exist; if field-catalog parsing changes, use a minimal known-safe set.
          if 'run_accession' not in fields:
              fields=['run_accession','experiment_accession','sample_accession','secondary_sample_accession','study_accession','secondary_study_accession','sample_alias','experiment_alias','library_name','scientific_name']
          url='https://www.ebi.ac.uk/ena/portal/api/filereport?'+urllib.parse.urlencode({
              'accession':'PRJNA976199','result':'read_run','fields':','.join(fields),'format':'tsv','download':'true'})
          ena_text=get(url).decode('utf-8','replace')
          (out/'PRJNA976199_read_run.tsv').write_text(ena_text,encoding='utf-8')
          runs=list(csv.DictReader(io.StringIO(ena_text),delimiter='\t'))
          if len(runs)!=27:
              raise SystemExit(f'expected 27 ENA runs for PRJNA976199, got {len(runs)}')
          observed={r['run_accession'] for r in runs}
          expected={f'SRR{i}' for i in range(24413180,24413207)}
          if observed!=expected:
              raise SystemExit({'missing':sorted(expected-observed),'extra':sorted(observed-expected)})

          rows=[]
          for r in sorted(runs,key=lambda x:x['run_accession']):
              s=by_srx.get(r.get('experiment_accession',''))
              rows.append({
                  'run':r.get('run_accession',''),
                  'experiment':r.get('experiment_accession',''),
                  'sample_accession':r.get('sample_accession',''),
                  'secondary_sample_accession':r.get('secondary_sample_accession',''),
                  'sample_alias':r.get('sample_alias',''),
                  'experiment_alias':r.get('experiment_alias',''),
                  'library_name':r.get('library_name',''),
                  'ena_sample_title':r.get('sample_title',''),
                  'gsm':s['gsm'] if s else '',
                  'geo_title':s['title'] if s else '',
                  'geo_source':s['source'] if s else '',
                  'geo_characteristics':' | '.join(s['characteristics']) if s else '',
                  'geo_relations':' | '.join(s['relations']) if s else '',
              })
          with (out/'run_geo_crosswalk.tsv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]),delimiter='\t');w.writeheader();w.writerows(rows)

          # Never infer biology from SRR monotonic order. Print archive labels verbatim for human/auditable freezing.
          print(json.dumps({'geo_route':geo_route,'n_geo_samples':len(samples),'n_geo_srx_links':len(by_srx),'n_ena_runs':len(runs),'ena_fields':fields},indent=2))
          print('\nRUN-LEVEL ARCHIVE LABELS (verbatim; no condition inference):')
          for x in rows:
              print('\t'.join([x['run'],x['experiment'],x['sample_accession'],x['secondary_sample_accession'],x['sample_alias'],x['experiment_alias'],x['library_name'],x['ena_sample_title'],x['gsm'],x['geo_title'],x['geo_source'],x['geo_characteristics']]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-free-creticulata-mapping-audit-v0-1
          path: build/creticulata_mapping_audit_v0_1/
          if-no-files-found: error
