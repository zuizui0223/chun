name: Paper 1 AJB upload bundle v0.4

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Historical commit containing the frozen pre-ecological v0.4 bundle
        required: true
        default: b8a1983fd957fe45f3b399dbc4df2d6f773dfd5c

permissions:
  contents: read

jobs:
  build_upload_bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependency
        run: python -m pip install --disable-pip-version-check matplotlib
      - name: Prepare directories
        run: |
          mkdir -p build/ajb_upload_bundle/{manuscript,main_figures,appendices,provenance}
          mkdir -p build/ajb_upload_work/{supplementary_tables,supplementary_figures,source_audit}
      - name: Build AJB manuscript v0.4
        run: |
          python scripts/build_paper1_manuscript_v0_2.py \
            --v01 manuscript/PAPER1_AJB_MANUSCRIPT_V0_1.md \
            --abstract-source docs/PAPER1_TITLE_ABSTRACT_AJB.md \
            --corrections data/paper1_manuscript_v0_2_corrections.csv \
            --out build/ajb_upload_work/PAPER1_AJB_MANUSCRIPT_V0_2.md \
            --summary build/ajb_upload_bundle/provenance/v0_2_build_summary.json
          python scripts/build_paper1_submission_v0_3.py \
            --v02 build/ajb_upload_work/PAPER1_AJB_MANUSCRIPT_V0_2.md \
            --cleanup data/paper1_submission_cleanup_v0_3.json \
            --out build/ajb_upload_work/PAPER1_AJB_SUBMISSION_V0_3.md \
            --summary build/ajb_upload_bundle/provenance/v0_3_build_summary.json
          python scripts/build_paper1_ajb_submission_v0_4.py \
            --v03 build/ajb_upload_work/PAPER1_AJB_SUBMISSION_V0_3.md \
            --appendix-map data/paper1_ajb_appendix_mapping_v0_1.csv \
            --out build/ajb_upload_bundle/manuscript/PAPER1_AJB_UPLOAD_V0_4.md \
            --summary build/ajb_upload_bundle/provenance/v0_4_build_summary.json
          python scripts/validate_paper1_ajb_submission_v0_4.py \
            --manuscript build/ajb_upload_bundle/manuscript/PAPER1_AJB_UPLOAD_V0_4.md \
            --appendix-map data/paper1_ajb_appendix_mapping_v0_1.csv \
            --out build/ajb_upload_bundle/provenance/v0_4_validation_summary.json
      - name: Build Main Fig 1–6
        run: |
          python scripts/build_paper1_main_figures.py \
            --registry data/paper1_authoritative_results_v0_1.csv \
            --inputs data/paper1_figure_numeric_inputs_v0_1.csv \
            --out-dir build/ajb_upload_bundle/main_figures
      - name: Build internal Supplementary Tables and Figures
        run: |
          python scripts/audit_paper1_source_provenance.py \
            --registry data/paper1_authoritative_results_v0_1.csv \
            --wild-colour data/wfo55_accepted_species_wild_colour_registry_v0_1.csv \
            --micro-sources data/paper1_micro_source_provenance_v0_1.csv \
            --out-dir build/ajb_upload_work/source_audit
          python scripts/build_paper1_supp_tables.py \
            --disposition data/paper1_analysis_disposition_v0_1.csv \
            --micro data/paper1_micro_source_provenance_v0_1.csv \
            --wild-audit build/ajb_upload_work/source_audit/wild_colour_source_audit.csv \
            --ecology data/paper1_ecological_primary_references_v0_1.csv \
            --figure-inputs data/paper1_figure_numeric_inputs_v0_1.csv \
            --results data/paper1_authoritative_results_v0_1.csv \
            --out-dir build/ajb_upload_work/supplementary_tables
          python scripts/build_paper1_supp_figures.py \
            --inputs data/paper1_supp_figure_numeric_inputs_v0_1.csv \
            --registry data/paper1_authoritative_results_v0_1.csv \
            --out-dir build/ajb_upload_work/supplementary_figures
      - name: Materialize AJB Appendix S1–S9 upload files
        run: |
          mkdir -p build/ajb_upload_work/internal_bundle
          ln -s "$(pwd)/build/ajb_upload_work/supplementary_tables" build/ajb_upload_work/internal_bundle/supplementary_tables
          ln -s "$(pwd)/build/ajb_upload_work/supplementary_figures" build/ajb_upload_work/internal_bundle/supplementary_figures
          python scripts/materialize_paper1_ajb_appendices.py \
            --mapping data/paper1_ajb_appendix_mapping_v0_1.csv \
            --bundle-root build/ajb_upload_work/internal_bundle \
            --out-dir build/ajb_upload_bundle/appendices \
            --summary build/ajb_upload_bundle/provenance/appendix_materialization_summary.json
      - name: Copy frozen provenance and upload contract
        run: |
          cp data/paper1_authoritative_results_v0_1.csv build/ajb_upload_bundle/provenance/
          cp data/paper1_analysis_disposition_v0_1.csv build/ajb_upload_bundle/provenance/
          cp data/paper1_micro_source_provenance_v0_1.csv build/ajb_upload_bundle/provenance/
          cp data/paper1_ecological_primary_references_v0_1.csv build/ajb_upload_bundle/provenance/
          cp data/paper1_bibliographic_corrections_v0_1.csv build/ajb_upload_bundle/provenance/
          cp data/paper1_ajb_appendix_mapping_v0_1.csv build/ajb_upload_bundle/provenance/
          cp data/paper1_release_artifact_manifest_v0_2.csv build/ajb_upload_bundle/provenance/
          cp docs/PAPER1_AJB_UPLOAD_BUNDLE_README.md build/ajb_upload_bundle/README.md
      - name: Audit final AJB upload bundle
        run: |
          python scripts/audit_paper1_ajb_upload_bundle.py \
            --bundle build/ajb_upload_bundle \
            --out build/ajb_upload_bundle/BUNDLE_MANIFEST.json
          cat build/ajb_upload_bundle/BUNDLE_MANIFEST.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-ajb-upload-bundle-v0-4
          path: build/ajb_upload_bundle/
          if-no-files-found: error
