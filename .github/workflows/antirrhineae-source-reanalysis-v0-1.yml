name: Antirrhineae source reanalysis v0.1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire and audit the CC0 source bundle
        run: python scripts/ingest_antirrhineae_sources_v0_1.py --out-dir build/antirrhineae_source_v0_1
      - name: Preserve execution provenance
        if: always()
        run: |
          git rev-parse HEAD > build/antirrhineae_source_v0_1/ci_checkout_sha.txt
          python --version > build/antirrhineae_source_v0_1/python_version.txt
          cp scripts/ingest_antirrhineae_sources_v0_1.py build/antirrhineae_source_v0_1/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antirrhineae-source-v0-1
          path: build/antirrhineae_source_v0_1
          if-no-files-found: error
          retention-days: 90
