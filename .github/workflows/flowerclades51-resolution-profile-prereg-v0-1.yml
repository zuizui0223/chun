name: Flower-clades-51 resolution profile prereg v0.1

on:
  pull_request:
    paths:
      - 'data/flowerclades51_visible_colour_hierarchy_v0_1.csv'
      - 'data/flowerclades51_resolution_profile_prereg_v0_1.json'
      - 'docs/FLOWERCLADES51_RESOLUTION_PROFILE_PREREG_V0_1.md'
      - 'scripts/validate_flowerclades51_resolution_profile_prereg_v0_1.py'
      - '.github/workflows/flowerclades51-resolution-profile-prereg-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate outcome-blind preregistration
        run: python scripts/validate_flowerclades51_resolution_profile_prereg_v0_1.py
      - name: Confirm Paper 1 science firewall
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- manuscript data/paper1_authoritative_results_v0_2_2.csv data/paper1_main_figure_manifest_v0_2_2.csv || {
            echo 'Paper 1 science/manuscript changed unexpectedly' >&2
            exit 1
          }
