name: Camellia GBIF WorldClim macro niche

on:
  pull_request:
    paths:
      - 'data/camellia_macro_niche_taxa_v0_1.csv'
      - 'scripts/run_camellia_gbif_worldclim_niche.py'
      - '.github/workflows/camellia-gbif-worldclim-niche.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  niche:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy requests rasterio
      - name: Fetch WorldClim 2.1 with official-host fallback
        run: |
          mkdir -p build/worldclim build/camellia_macro_niche
          target=build/worldclim/wc2.1_10m_bio.zip
          primary='https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip'
          fallback='https://biogeo.ucdavis.edu/data/worldclim/v2.1/base/wc2.1_10m_bio.zip'
          if ! curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 "$primary" -o "$target"; then
            rm -f "$target"
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 "$fallback" -o "$target"
          fi
          python - <<'PY'
          import zipfile
          p='build/worldclim/wc2.1_10m_bio.zip'
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
          required={f'wc2.1_10m_bio_{x}.tif' for x in (1,4,6,12,15)}
          missing=sorted(required-names)
          if missing:
              raise SystemExit(f'WorldClim archive missing required rasters: {missing}')
          print(f'WorldClim archive verified: {len(names)} members')
          PY
      - name: Build GBIF + WorldClim species niche matrix
        run: |
          python scripts/run_camellia_gbif_worldclim_niche.py \
            --taxa data/camellia_macro_niche_taxa_v0_1.csv \
            --out-dir build/camellia_macro_niche \
            --worldclim-dir build/worldclim \
            --min-points 5
      - name: Report species niches
        if: always()
        run: |
          echo '### Camellia macro niche analysis' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/camellia_macro_niche/analysis_summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat build/camellia_macro_niche/analysis_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/camellia_macro_niche/species_climatic_niches.csv ]; then
            echo '#### Species climatic niches' >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat build/camellia_macro_niche/species_climatic_niches.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/camellia_macro_niche/colour_niche_group_tests.csv ]; then
            echo '#### A versus Y exact species-label tests' >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat build/camellia_macro_niche/colour_niche_group_tests.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload macro niche analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-gbif-worldclim-macro-niche
          path: build/camellia_macro_niche
          if-no-files-found: error
