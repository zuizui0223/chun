name: Angraecinae source reanalysis v0.1

on:
  pull_request:
    paths:
      - 'scripts/*angraecinae*v0_1.py'
      - '.github/workflows/angraecinae-source-reanalysis-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source, tree and inference dependencies
        run: |
          python -m pip install 'numpy==2.2.6' 'biopython==1.85' 'scipy==1.15.3'
          sudo apt-get update -qq
          sudo apt-get install -y -qq mafft iqtree
      - name: Acquire PLOS/PMC supplementary trait sources
        run: python scripts/ingest_angraecinae_sources_v0_1.py --out-dir build/angraecinae_source_v0_1
      - name: Recover organ-specific terminal colour states
        run: |
          python scripts/prepare_angraecinae_traits_v0_1.py \
            --source-dir build/angraecinae_source_v0_1 \
            --out-dir build/angraecinae_source_v0_1/traits
      - name: Recover source-mapped public sequences
        run: |
          python scripts/recover_angraecinae_sequences_v0_1.py \
            --source-dir build/angraecinae_source_v0_1 \
            --trait-csv build/angraecinae_source_v0_1/traits/terminal_organ_states.csv \
            --out-dir build/angraecinae_source_v0_1/sequences
      - name: Align and concatenate independent sequence inputs
        run: |
          python scripts/align_angraecinae_sequences_v0_1.py \
            --sequence-dir build/angraecinae_source_v0_1/sequences \
            --out-dir build/angraecinae_source_v0_1/alignments
      - name: Independently infer three ML topologies
        run: |
          mkdir -p build/angraecinae_source_v0_1/trees
          IQ=$(command -v iqtree2 || command -v iqtree)
          "$IQ" --version > build/angraecinae_source_v0_1/iqtree_version.txt
          mafft --version 2> build/angraecinae_source_v0_1/mafft_version.txt
          OUTGROUPS=$(python - <<'PY'
          import json
          d=json.load(open('build/angraecinae_source_v0_1/sequences/sequence_manifest.json'))
          print(','.join(d['outgroup_tips']))
          PY
          )
          test -n "$OUTGROUPS"
          for variant in plastid_full plastid50 all4_full; do
            "$IQ" \
              -s "build/angraecinae_source_v0_1/alignments/${variant}.fasta" \
              -p "build/angraecinae_source_v0_1/alignments/${variant}.nex" \
              -m GTR+G4 -o "$OUTGROUPS" -seed 20260907 -T 2 -B 1000 --bnni \
              --prefix "build/angraecinae_source_v0_1/trees/${variant}"
          done
      - name: Fit the common organ-specific GREEN-WHITE Mk models
        run: |
          python scripts/analyze_angraecinae_mk_v0_1.py \
            --trees-dir build/angraecinae_source_v0_1/trees \
            --sample-manifest build/angraecinae_source_v0_1/sequences/source_sample_manifest.csv \
            --traits build/angraecinae_source_v0_1/traits/terminal_organ_states.csv \
            --out-dir build/angraecinae_source_v0_1/analysis
          cat build/angraecinae_source_v0_1/analysis/analysis_results.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact executable code and versions
        if: always()
        run: |
          mkdir -p build/angraecinae_source_v0_1/repro_scripts
          cp scripts/*angraecinae*v0_1.py build/angraecinae_source_v0_1/repro_scripts/
          git rev-parse HEAD > build/angraecinae_source_v0_1/ci_checkout_sha.txt
          python -m pip freeze > build/angraecinae_source_v0_1/python_packages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angraecinae-source-v0-1
          path: build/angraecinae_source_v0_1/
          if-no-files-found: error
          retention-days: 90
