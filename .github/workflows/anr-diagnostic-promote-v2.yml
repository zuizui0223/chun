name: One-shot promote ANR diagnostic v2

on:
  push:
    branches:
      - agent/anr-reference-copy-resolution
    paths:
      - '.github/workflows/anr-diagnostic-promote-v2.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace the exploratory v1 workflow with the crosswalk-resolved workflow
        run: |
          test -f .github/workflows/anr-reference-copy-diagnostic-v2.yml
          rm -f .github/workflows/anr-reference-copy-diagnostic.yml
          mv .github/workflows/anr-reference-copy-diagnostic-v2.yml \
             .github/workflows/anr-reference-copy-diagnostic.yml
          rm -f .github/workflows/anr-diagnostic-hotfix.yml
          rm -f .github/workflows/anr-diagnostic-promote-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/workflows
          git commit -m 'Promote crosswalk-resolved ANR diagnostic workflow'
          git push origin HEAD:${GITHUB_REF_NAME}
