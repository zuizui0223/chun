name: Cross-radiation EL submission metadata v0.1

on:
  push:
    branches:
      - submission/cross-radiation-el-metadata-v0-1
  pull_request:
    paths:
      - 'submission/CROSS_RADIATION_EL_SUBMISSION_METADATA_V0_1.json'
      - 'scripts/validate_cross_radiation_el_submission_metadata_v0_1.py'
      - 'tests/test_cross_radiation_el_submission_metadata_v0_1.py'
      - 'docs/CROSS_RADIATION_EL_SUBMISSION_METADATA_GATE_V0_1.md'
      - '.github/workflows/cross-radiation-el-submission-metadata-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest tests/test_cross_radiation_el_submission_metadata_v0_1.py
      - name: Validate metadata scaffold
        if: ${{ hashFiles('submission/CROSS_RADIATION_EL_SUBMISSION_METADATA_V0_1.json') != '' }}
        run: |
          mkdir -p build/cross_radiation_el_metadata_v0_1
          python scripts/validate_cross_radiation_el_submission_metadata_v0_1.py \
            --input submission/CROSS_RADIATION_EL_SUBMISSION_METADATA_V0_1.json \
            --summary build/cross_radiation_el_metadata_v0_1/summary.json
      - name: Confirm scientific and Paper 1 firewalls
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- \
            data/cross_radiation_evolution_letters_claim_registry_v0_1.json \
            manuscript/CROSS_RADIATION_EVOLUTION_LETTERS_V0_2.md \
            manuscript/PAPER1_AJB_MANUSCRIPT_V0_2.md \
            data/paper1_authoritative_results_v0_2_2.csv \
            data/paper1_main_figure_manifest_v0_2_2.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-radiation-el-submission-metadata-v0-1
          path: build/cross_radiation_el_metadata_v0_1/*
          if-no-files-found: warn
          retention-days: 90
