name: Oil Camellia colour reported effect pilot

on:
  pull_request:
    paths:
      - 'data/oil_camellia_reported_effect_summary_v0_1.json'
      - 'scripts/fetch_pmc_oa_supplement_manifest.py'
      - 'scripts/inspect_tabular_supplements.py'
      - 'scripts/extract_oil_camellia_reported_metabolite_vector.py'
      - '.github/workflows/camellia-oil-colour-reported-effect-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl scipy
      - name: Fetch PMC10759395 OA package
        run: |
          python scripts/fetch_pmc_oa_supplement_manifest.py \
            --pmcid PMC10759395 \
            --out-dir build/oil_camellia_reported_effect
      - name: Inspect tabular supplements
        run: |
          python scripts/inspect_tabular_supplements.py \
            --root build/oil_camellia_reported_effect \
            --output build/oil_camellia_reported_effect/table_inspection.csv
      - name: Extract colour-material metabolite state vector
        run: |
          python scripts/extract_oil_camellia_reported_metabolite_vector.py \
            --table-s2 'build/oil_camellia_reported_effect/nested/12870_2023_4699_MOESM1_ESM/Table S2.xlsx' \
            --out-dir build/oil_camellia_reported_effect/effects
      - name: Verify frozen quantitative summary
        run: diff -u data/oil_camellia_reported_effect_summary_v0_1.json build/oil_camellia_reported_effect/effects/summary.json
      - name: Report
        if: always()
        run: |
          echo '### Oil Camellia W/P/CP/R quantitative supplement audit' >> "$GITHUB_STEP_SUMMARY"
          echo 'Taxon-name mapping is provenance-conflicted in the source; colour-material labels only are admissible.' >> "$GITHUB_STEP_SUMMARY"
          for f in summary.json supplement_manifest.csv table_inspection.csv inspection_failures.json effects/summary.json effects/metabolite_class_effects.csv effects/state_vector_contrasts.csv; do
            if [ -f "build/oil_camellia_reported_effect/$f" ]; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -c 80000 "build/oil_camellia_reported_effect/$f" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oil-camellia-colour-reported-effect-pilot
          path: |
            build/oil_camellia_reported_effect/summary.json
            build/oil_camellia_reported_effect/supplement_manifest.csv
            build/oil_camellia_reported_effect/table_inspection.csv
            build/oil_camellia_reported_effect/inspection_failures.json
            build/oil_camellia_reported_effect/effects
          if-no-files-found: error
