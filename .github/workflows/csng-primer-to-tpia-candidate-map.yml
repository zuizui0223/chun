name: CSNG primer to TPIA candidate map

on:
  pull_request:
    paths:
      - 'data/csng_qpcr_primers_v0_1.csv'
      - 'data/csng_primer_candidate_panels_v0_1.csv'
      - 'scripts/map_csng_primers_to_tpia_candidates.py'
      - '.github/workflows/csng-primer-to-tpia-candidate-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Map public CSNG qRT-PCR primers to predeclared candidate CDSs
        run: |
          python scripts/map_csng_primers_to_tpia_candidates.py \
            --primers data/csng_qpcr_primers_v0_1.csv \
            --candidates data/csng_primer_candidate_panels_v0_1.csv \
            --out-dir build/csng_primer_map
      - name: Report
        if: always()
        run: |
          for f in summary.json primer_candidate_mapping.csv; do
            if [ -f build/csng_primer_map/$f ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -c 120000 build/csng_primer_map/$f >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csng-primer-to-tpia-candidate-map
          path: build/csng_primer_map
          if-no-files-found: error
