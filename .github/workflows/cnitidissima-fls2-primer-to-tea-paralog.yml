name: CnFLS2 primer to tea FLS paralog audit

on:
  pull_request:
    paths:
      - 'data/cnitidissima_fls_source_transcripts_v0_1.csv'
      - 'scripts/map_cnitidissima_fls2_primer_to_tea_fls.py'
      - '.github/workflows/cnitidissima-fls2-primer-to-tea-paralog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests biopython
      - name: Map source CnFLS2 qRT-PCR primer to tea FLS source paralogs
        run: python scripts/map_cnitidissima_fls2_primer_to_tea_fls.py --output-dir build/cnfls2_primer_map
      - name: Report
        if: always()
        run: |
          for f in summary.json primer_similarity.csv; do
            if [ -f build/cnfls2_primer_map/$f ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -c 120000 build/cnfls2_primer_map/$f >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cnfls2-primer-to-tea-paralog-audit
          path: build/cnfls2_primer_map
          if-no-files-found: error
