name: Petunieae nested pigment-regulatory memory v0.1

on:
  pull_request:
    paths:
      - 'data/petunieae_nested_regulatory_memory_preregistered_design_v0_1.json'
      - 'results/petunieae_nested_regulatory_memory_v0_1/**'
      - 'scripts/analyze_petunieae_nested_regulatory_memory_v0_1.py'
      - 'tests/test_petunieae_nested_regulatory_memory_v0_1.py'
      - 'requirements/requirements-repository-integrity.txt'
      - '.github/workflows/petunieae-nested-regulatory-memory-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducibility dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/requirements-repository-integrity.txt

      - name: Acquire exact prior source archive (transport only)
        uses: actions/download-artifact@v4
        with:
          name: petunieae-prospective-osf-v0-1
          repository: zuizui0223/chun
          run-id: 34182646549
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/petunieae_frozen_source

      - name: Run frozen retrospective 47-tip conditional analysis
        run: |
          python scripts/analyze_petunieae_nested_regulatory_memory_v0_1.py \
            --source build/petunieae_frozen_source \
            --design data/petunieae_nested_regulatory_memory_preregistered_design_v0_1.json \
            --out build/petunieae_nested_regulatory_memory/result_v0_1.json

      - name: Verify independent hosted replay against recorded results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('build/petunieae_nested_regulatory_memory/result_v0_1.json').read_text())
          b = json.loads(Path('results/petunieae_nested_regulatory_memory_v0_1/result_v0_1.json').read_text())
          for k in ['source_hash_verified','source_article_doi','retained_tips','fine_state_counts','coarse_state_counts','expression_feature_count','pigment_feature_count','zero_variance_expression_columns','zero_variance_pigment_columns']:
              assert a[k] == b[k], (k,a[k],b[k])
          for role in ['primary_conditional_expression_memory','secondary_conditional_pigment_concentration_memory']:
              x,y=a[role],b[role]
              for k in ['same_fine_unordered_pairs','n_permutations','random_seed']:
                  assert x[k] == y[k], (role,k,x[k],y[k])
              for k in ['rho','null_mean_rho','p_one_sided','null_q025','null_q975']:
                  # Compare frozen numerical outcomes on the pinned runner, allowing
                  # small changes in Monte Carlo streams across NumPy versions.
                  assert abs(x[k] - y[k]) < (0.003 if k != 'rho' else 1e-9), (role,k,x[k],y[k])
          assert a['primary_conditional_expression_memory']['rho'] > 0
          assert a['primary_conditional_expression_memory']['p_one_sided'] <= 0.01
          assert a['secondary_conditional_pigment_concentration_memory']['p_one_sided'] > 0.05
          print('PUBLISHED_RESULT_REPLAY_PASS')
          PY

      - name: Test program invariants without requiring source download
        run: pytest -q tests/test_petunieae_nested_regulatory_memory_v0_1.py tests/test_integrated_temporal_mechanisms_gate_v0_1.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: petunieae-nested-regulatory-memory-v0-1-replay
          path: build/petunieae_nested_regulatory_memory/
          if-no-files-found: warn
