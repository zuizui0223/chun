name: Erica 2019 UPLC qualitative chemistry source gate v0.1

on:
  pull_request:
    paths:
      - 'data/erica_2019_table2_qualitative_chemistry_source_v0_1.json'
      - 'scripts/audit_erica_2019_qualitative_chemistry_coverage_v0_1.py'
      - 'tests/test_erica_2019_qualitative_chemistry_coverage_v0_1.py'
      - 'results/erica_2019_qualitative_chemistry_availability_v0_1/**'
      - '.github/workflows/erica-2019-qualitative-chemistry-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read_original_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Test original 30-row qualitative chemistry transcription and no new memory result
        run: python -m pytest -q tests/test_erica_2019_qualitative_chemistry_coverage_v0_1.py
      - name: Check original source qualitative chemistry against 22 unchanged outcome taxa
        run: |
          python scripts/audit_erica_2019_qualitative_chemistry_coverage_v0_1.py \
            --source-qualitative-table2 data/erica_2019_table2_qualitative_chemistry_source_v0_1.json \
            --original-qpcr-crosswalk data/erica_table2_visible_colour_qpcr_taxon_crosswalk_v0_1.json \
            --erica-fixed-outcome results/erica_voucher_averaged_developmental_memory_v0_1/result_v0_1.json \
            --petunieae-adjusted results/petunieae_pigment_adjusted_regulatory_memory_v0_1/result_v0_1.json \
            --out build/erica_2019_qualitative_chemistry_availability_v0_1.json
      - name: Enforce saved biological source counts and original negative result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('build/erica_2019_qualitative_chemistry_availability_v0_1.json').read_text())
          b=json.loads(Path('results/erica_2019_qualitative_chemistry_availability_v0_1/result_v0_1.json').read_text())
          assert a.keys()==b.keys()
          for k in a:
              if isinstance(a[k],float):
                  assert abs(a[k]-b[k])<1e-13,k
              else: assert a[k]==b[k],k
          assert a['source_only_N_examined_taxa']==22
          assert a['source_qualitative_production_counts']['NORMAL_ANTHOCYANIN']==18
          assert a['same_visible_hue_unordered_taxon_pairs']==83
          assert a['same_visible_hue_and_same_qualitative_anthocyanin_label_pairs']==82
          assert a['different_visible_hue_but_same_qualitative_anthocyanin_label_pairs']==72
          assert a['original_erica_P']==0.4988
          assert not a['numeric_raw_HPLC_compound_matrix_verified']
          assert a['no_new_expression_phylogenetic_memory_statistic']
          assert a['original_erica_NOT_SUPPORTED_retained']
          assert a['Petunieae_exact_biochemical_condition_is_not_met']
          assert a['original_Camellia_AJB_EL_unchanged']
          print('ERICA_2019_SOURCE_CHEMISTRY_AVAILABILITY_GATE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erica-2019-qualitative-chemistry-source-v0-1
          path: build/erica_2019_qualitative_chemistry_availability_v0_1.json
          if-no-files-found: warn
