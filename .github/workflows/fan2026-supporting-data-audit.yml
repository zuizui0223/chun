name: Fan 2026 supporting data audit

on:
  pull_request:
    paths:
      - 'scripts/audit_fan2026_datas1.py'
      - '.github/workflows/fan2026-supporting-data-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl
      - name: Download open-access Wiley Data S1
        run: |
          mkdir -p build/fan2026_datas1
          url='https://onlinelibrary.wiley.com/action/downloadSupplement?doi=10.1111%2Fpbi.70442&file=pbi70442-sup-0002-DataS1.xlsx'
          curl --fail --location --retry 3 --retry-all-errors \
            -A 'Mozilla/5.0 chun-public-data-audit/0.1' \
            "$url" -o build/fan2026_datas1/DataS1.xlsx
          python - <<'PY'
          from pathlib import Path
          p=Path('build/fan2026_datas1/DataS1.xlsx')
          print('bytes',p.stat().st_size)
          if p.read_bytes()[:2] != b'PK':
              raise SystemExit('download is not an XLSX/ZIP file')
          PY
      - name: Inventory supporting workbook
        run: |
          python scripts/audit_fan2026_datas1.py \
            build/fan2026_datas1/DataS1.xlsx \
            --out-dir build/fan2026_datas1/extracted
      - name: Report
        if: always()
        run: |
          if [ -f build/fan2026_datas1/extracted/sheet_inventory.csv ]; then
            echo '### Fan 2026 Data S1 inventory' >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat build/fan2026_datas1/extracted/sheet_inventory.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fan2026-supporting-data-audit
          path: build/fan2026_datas1
          if-no-files-found: error
