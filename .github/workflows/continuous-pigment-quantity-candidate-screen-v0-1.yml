name: Continuous pigment quantity candidate screen v0.1

on:
  pull_request:
    paths:
      - 'data/continuous_pigment_quantity_candidate_screen_v0_1.csv'
      - 'data/continuous_pigment_quantity_candidate_screen_summary_v0_1.json'
      - 'scripts/validate_continuous_pigment_quantity_candidate_screen_v0_1.py'
      - 'docs/CONTINUOUS_PIGMENT_QUANTITY_CANDIDATE_SCREEN_V0_1.md'
      - '.github/workflows/continuous-pigment-quantity-candidate-screen-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded candidate screen
        run: |
          python scripts/validate_continuous_pigment_quantity_candidate_screen_v0_1.py \
            --gate data/continuous_pigment_quantity_prospective_gate_v0_1.json \
            --screen data/continuous_pigment_quantity_candidate_screen_v0_1.csv \
            --out build/continuous_pigment_quantity_candidate_screen_summary_v0_1.json
      - name: Verify frozen screen result exactly
        run: |
          python - <<'PY'
          import json
          observed=json.load(open('build/continuous_pigment_quantity_candidate_screen_summary_v0_1.json'))
          expected=json.load(open('data/continuous_pigment_quantity_candidate_screen_summary_v0_1.json'))
          assert observed==expected, (observed, expected)
          assert observed['qualified_candidates']==0
          assert observed['decisive_target_outcomes_inspected']==0
          assert observed['candidate_frames_screened']==18
          assert observed['unique_source_publications_screened']==17
          assert observed['closest_candidate']['radiation']=='RHODODENDRON_30_SPECIES'
          assert observed['decision']=='NO_QUALIFIED_UNUSED_RADIATION'
          assert observed['paper1_science_changed'] is False
          print(json.dumps(observed, indent=2))
          PY
      - name: Confirm prospective gate was not altered during screening
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- \
            data/continuous_pigment_quantity_prospective_gate_v0_1.json \
            data/continuous_pigment_quantity_prospective_gate_receipt_v0_1.json \
            docs/CONTINUOUS_PIGMENT_QUANTITY_PROSPECTIVE_GATE_V0_1.md \
            scripts/validate_continuous_pigment_quantity_prospective_gate_v0_1.py || {
              echo 'Frozen continuous-quantity gate changed during candidate screening' >&2
              exit 1
            }
      - name: Confirm outcome firewall and Paper 1 firewall
        run: |
          ! grep -E 'best_target_class|target_class_AICc|target_class_effect_size' data/continuous_pigment_quantity_candidate_screen_v0_1.csv
          git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- \
            manuscript \
            data/paper1_authoritative_results_v0_2_2.csv \
            data/paper1_main_figure_manifest_v0_2_2.csv || {
              echo 'Paper 1 science/manuscript changed unexpectedly' >&2
              exit 1
            }
