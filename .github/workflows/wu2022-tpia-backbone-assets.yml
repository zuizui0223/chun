name: Wu 2022 TPIA backbone assets

on:
  pull_request:
    paths:
      - 'scripts/audit_wu2022_tpia_backbone_assets.py'
      - '.github/workflows/wu2022-tpia-backbone-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Fetch Wu 2022 Table S1-S18 workbook
        run: |
          mkdir -p build/wu2022_tpia
          python - <<'PY'
          from pathlib import Path
          import requests, zipfile, io
          name='tpj15799-sup-0002-TableS1-S18.xlsx'
          urls=[
            'https://onlinelibrary.wiley.com/action/downloadSupplement?doi=10.1111%2Ftpj.15799&file='+name,
            'https://onlinelibrary.wiley.com/doi/suppl/10.1111/tpj.15799/supinfo/'+name,
          ]
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 chun-public-backbone-audit/0.1'
          errors=[]
          for u in urls:
              try:
                  r=s.get(u,timeout=120,allow_redirects=True)
                  if r.status_code==200 and r.content[:2]==b'PK':
                      # xlsx is a zip container; validate before accepting.
                      zipfile.ZipFile(io.BytesIO(r.content)).testzip()
                      Path('build/wu2022_tpia/TableS1-S18.xlsx').write_bytes(r.content)
                      Path('build/wu2022_tpia/supplement_url.txt').write_text(r.url+'\n')
                      print('recovered',len(r.content),'bytes from',r.url)
                      break
                  errors.append((u,r.status_code,r.headers.get('content-type'),len(r.content)))
              except Exception as e: errors.append((u,type(e).__name__,str(e)))
          else:
              raise SystemExit('Wu supplement workbook not recovered: '+repr(errors))
          PY
      - name: Crosswalk publisher taxa to TPIA assemblies
        run: |
          python scripts/audit_wu2022_tpia_backbone_assets.py \
            --supp-xlsx build/wu2022_tpia/TableS1-S18.xlsx \
            --out-dir build/wu2022_tpia/audit
      - name: Report
        if: always()
        run: |
          echo '### Wu 2022 TPIA backbone asset gate' >> "$GITHUB_STEP_SUMMARY"
          for f in build/wu2022_tpia/supplement_url.txt build/wu2022_tpia/audit/summary.json build/wu2022_tpia/audit/wu2022_tpia_species_crosswalk.csv build/wu2022_tpia/audit/tpia_transcriptome_bulk_catalog.csv; do
            if [ -f "$f" ]; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -c 30000 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wu2022-tpia-backbone-assets
          path: build/wu2022_tpia
          if-no-files-found: error
