name: Petunieae fixed-functional-module influence source diagnostic v0.1

on:
  pull_request:
    paths:
      - 'scripts/audit_petunieae_functional_module_influence_v0_1.py'
      - 'tests/test_petunieae_functional_module_influence_v0_1.py'
      - 'results/petunieae_functional_module_influence_v0_1/**'
      - '.github/workflows/petunieae-functional-module-influence-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  descriptive_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned scientific dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/requirements-repository-integrity.txt
      - name: Check original exact modules and forbid P-value rescue
        run: python -m pytest -q tests/test_petunieae_functional_module_influence_v0_1.py
      - name: Retrieve byte-verified original Wheeler 2023 Petunieae data
        uses: actions/download-artifact@v4
        with:
          name: petunieae-prospective-osf-v0-1
          repository: zuizui0223/chun
          run-id: 34182646549
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/frozen_source
      - name: Perform exactly 47 leave-one-tip and 6 leave-one-pigment-code original-source diagnostics
        run: |
          python scripts/audit_petunieae_functional_module_influence_v0_1.py \
            --source build/frozen_source \
            --design data/petunieae_functional_module_memory_design_v0_1.json \
            --original-design data/petunieae_nested_regulatory_memory_preregistered_design_v0_1.json \
            --frozen-module-result results/petunieae_functional_module_memory_v0_1/result_v0_1.json \
            --original-adjusted-result results/petunieae_pigment_adjusted_regulatory_memory_v0_1/result_v0_1.json \
            --out build/petunieae_functional_module_influence_v0_1.json
      - name: Enforce no newly selected subset or significance inference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/petunieae_functional_module_influence_v0_1.json').read_text())
          assert r['status']=='POST_OUTCOME_DESCRIPTIVE_PETUNIEAE_MODULE_INFLUENCE_ONLY'
          assert r['original_source_SHA256_verified']
          assert r['n_tips']==47 and r['n_original_same_chemical_state_pairs']==183
          assert len(r['leave_one_taxon_details'])==47
          assert len(r['leave_one_fine_state_details'])==6
          assert r['module_loo_summaries']['leave_one_tip']['n_total']==47
          assert r['module_loo_summaries']['leave_one_fine_state']['n_total']==6
          for m,v in r['all_tips_original_module_rho_reproduced'].items():
              assert m in ['LATE_ANTHOCYANIN_EXECUTION','FLAVONOL_BRANCH_AND_ACTIVATION',
                           'EARLY_SHARED_AND_REGULATORY']
              assert -1<=v<=1
          assert r['new_p_values']==0 and r['independent_validations']==0
          assert r['no_significance_or_module_difference_rescue']
          assert r['original_module_maxT_decisions_unchanged']
          assert r['original_nearest_two_predictor_still_FAIL']
          assert r['original_frozen_Camellia_AJB_and_EL_unchanged']
          print('PETUNIEAE_FIXED_MODULE_POST_OUTCOME_INFLUENCE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: petunieae-functional-module-influence-v0-1
          path: build/petunieae_functional_module_influence_v0_1.json
          if-no-files-found: warn
