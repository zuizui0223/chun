name: Camellia ultimate-cause pre-branch tests

on:
  pull_request:
    paths:
      - 'requirements-camellia-analysis.txt'
      - 'scripts/fetch_pmc_cloud_media_v0_1.py'
      - 'scripts/test_ultimate_cause_prebranch.py'
      - '.github/workflows/camellia-ultimate-cause-prebranch-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-camellia-analysis.txt
      - name: Rebuild frozen runtime91 panel
        run: |
          mkdir -p build/ultimate_pre/fan_package
          python scripts/build_wu2022_angio353_backbone_panel.py \
            --manifest data/wu2022_public_backbone_manifest_v0_3.csv \
            --runtime-exclusions data/wu2022_tpia_runtime_exclusions_v0_1.csv \
            --output build/ultimate_pre/runtime91.csv \
            --summary build/ultimate_pre/runtime91_summary.json \
            --expected-total 98 --expected-frozen-assembled 93 --expected-frozen-raw 5 \
            --expected-runtime-assembled 91
          python - <<'PY'
          import csv
          p='build/ultimate_pre/runtime91.csv'
          rows=list(csv.DictReader(open(p,newline='',encoding='utf-8-sig')))
          fields=list(rows[0])
          if 'source_taxon' not in fields:
              fields.append('source_taxon')
              for r in rows: r['source_taxon']=r.get('taxon','')
              with open(p,'w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
      - name: Rebuild deterministic Fan 2026 colour seed
        run: |
          python scripts/fetch_pmc_cloud_media_v0_1.py \
            --pmcid PMC12946509 \
            --out-dir build/ultimate_pre/fan_package \
            --require-glob '*s002*.xlsx'
          xlsx=$(find build/ultimate_pre/fan_package -type f -iname '*s002*.xlsx' | head -n 1)
          test -n "$xlsx"
          python scripts/build_fan2026_species_colour_seed.py "$xlsx" \
            --output build/ultimate_pre/fan_species_colour_seed.csv \
            --audit build/ultimate_pre/fan_seed_audit.json
      - name: Test frozen hypotheses without inspecting topology
        run: |
          python scripts/test_ultimate_cause_prebranch.py \
            --panel build/ultimate_pre/runtime91.csv \
            --fan-colour build/ultimate_pre/fan_species_colour_seed.csv \
            --climate data/fan2026_chelsa_species_compact_v0_1.csv \
            --mechanism data/camellia_flower_color_mechanism_meta_v0_3.csv \
            --out-dir build/ultimate_pre/result \
            --permutations 100000 --seed 20260820
      - name: Report
        run: |
          echo '### Ultimate-cause pre-branch tests' >> "$GITHUB_STEP_SUMMARY"
          cat build/ultimate_pre/result/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: camellia-ultimate-cause-prebranch-tests
          path: |
            build/ultimate_pre/runtime91_summary.json
            build/ultimate_pre/fan_seed_audit.json
            build/ultimate_pre/result/
          if-no-files-found: error
