name: Paper 1 AJB submission-clean v0.3

on:
  pull_request:
    paths:
      - 'data/paper1_submission_cleanup_v0_3.json'
      - 'scripts/build_paper1_submission_v0_3.py'
      - 'scripts/validate_paper1_submission_v0_3.py'
      - '.github/workflows/paper1-submission-v0-3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frozen AJB manuscript v0.2
        run: |
          mkdir -p build/paper1_submission_v0_3
          python scripts/build_paper1_manuscript_v0_2.py \
            --v01 manuscript/PAPER1_AJB_MANUSCRIPT_V0_1.md \
            --abstract-source docs/PAPER1_TITLE_ABSTRACT_AJB.md \
            --corrections data/paper1_manuscript_v0_2_corrections.csv \
            --out build/paper1_submission_v0_3/PAPER1_AJB_MANUSCRIPT_V0_2.md \
            --summary build/paper1_submission_v0_3/v0_2_build_summary.json
      - name: Remove internal project language and bind Supplementary identifiers
        run: |
          python scripts/build_paper1_submission_v0_3.py \
            --v02 build/paper1_submission_v0_3/PAPER1_AJB_MANUSCRIPT_V0_2.md \
            --cleanup data/paper1_submission_cleanup_v0_3.json \
            --out build/paper1_submission_v0_3/PAPER1_AJB_SUBMISSION_V0_3.md \
            --summary build/paper1_submission_v0_3/v0_3_build_summary.json
      - name: Validate submission-clean manuscript
        run: |
          python scripts/validate_paper1_submission_v0_3.py \
            --manuscript build/paper1_submission_v0_3/PAPER1_AJB_SUBMISSION_V0_3.md \
            --out build/paper1_submission_v0_3/v0_3_validation_summary.json
      - name: Report
        run: |
          echo '### Submission-clean v0.3 build' >> "$GITHUB_STEP_SUMMARY"
          cat build/paper1_submission_v0_3/v0_3_build_summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '### Submission-clean v0.3 validation' >> "$GITHUB_STEP_SUMMARY"
          cat build/paper1_submission_v0_3/v0_3_validation_summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-ajb-submission-v0-3
          path: build/paper1_submission_v0_3/
          if-no-files-found: error
