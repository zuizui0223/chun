name: Iochrominae Dryad access recheck v0.3

on:
  pull_request:
    paths:
      - 'scripts/recheck_iochrominae_dryad_access_v0_3.py'
      - 'tests/test_recheck_iochrominae_dryad_access_v0_3.py'
      - 'data/iochrominae_dryad_access_recheck_v0_3.json'
      - 'docs/IOCHROMINAE_DRYAD_ACCESS_RECHECK_V0_3.md'
      - '.github/workflows/iochrominae-dryad-access-recheck-v0-3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: python -m pip install pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_recheck_iochrominae_dryad_access_v0_3.py
      - name: Confirm profile outcome remains absent
        run: test ! -e results/iochrominae_biochemical_resolution_profile_v0_1
      - name: Recheck exact Dryad objects
        run: python scripts/recheck_iochrominae_dryad_access_v0_3.py --out build/iochrominae_dryad_access_recheck_v0_3.json
      - name: Assert outcome firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/iochrominae_dryad_access_recheck_v0_3.json'))
          assert x['profile_auc_computed'] is False
          assert x['archive_data_rows_opened'] is False
          assert x['paper1_science_changed'] is False
          print(x['status'])
          PY
      - name: Confirm frozen EL v0.3 science
        run: python scripts/validate_cross_radiation_el_v0_3_science_freeze_v0_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iochrominae-dryad-access-recheck-v0-3
          path: build/
