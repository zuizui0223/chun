name: Linoideae nuclear ITS sensitivity v0.2
on:
  pull_request:
    paths:
      - '.github/workflows/linoideae-nuclear-sensitivity-v0-2.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  its:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: linoideae-source-v0-2
          run-id: 34115602382
          github-token: ${{ github.token }}
          path: build/source
      - name: Validate frozen source alignment and normalize reverse-strand labels
        run: |
          python -m pip install biopython==1.85
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from Bio import SeqIO
          src=Path('build/source/alignments/ITS.aligned.fasta');out=Path('build/linoideae_its_v0_2');out.mkdir(parents=True,exist_ok=True)
          digest=hashlib.sha256(src.read_bytes()).hexdigest()
          assert digest=='40d66cb066cc2946b6e69af45bfe6cbf91fd0151f70ca098f4ceb846b8bcda45',digest
          rows=list(SeqIO.parse(src,'fasta'))
          for r in rows:
              r.id=r.id.removeprefix('_R_');r.name=r.id;r.description=''
          assert len(rows)==111 and len({r.id for r in rows})==111 and 'LINO001' in {r.id for r in rows}
          SeqIO.write(rows,out/'ITS.fasta','fasta')
          (out/'manifest.json').write_text(json.dumps({'source_run':34115602382,'source_artifact':10016488210,'source_alignment_sha256':digest,'tips':111,'ingroup_tips':110,'claim_boundary':'Nuclear ITS-only sensitivity, not an independent clade or multilocus nuclear species tree.'},indent=2)+'\n')
          PY
      - name: Infer ITS-only ML tree with sequence-bootstrap sensitivity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iqtree
          IQ=$(command -v iqtree2 || command -v iqtree)
          "$IQ" --version > build/linoideae_its_v0_2/iqtree_version.txt
          "$IQ" -s build/linoideae_its_v0_2/ITS.fasta -m GTR+G4 -o LINO001 -seed 20260907 -T 2 -B 1000 --bnni --prefix build/linoideae_its_v0_2/ITS
          git rev-parse HEAD > build/linoideae_its_v0_2/ci_checkout_sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linoideae-its-v0-2
          path: build/linoideae_its_v0_2
          if-no-files-found: error
