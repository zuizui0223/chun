name: Paper 1 Fig6 identifiability v0.2

on:
  pull_request:
    paths:
      - 'data/paper1_fig6_event_gate_v0_2.csv'
      - 'data/paper1_fig6_synthesis_v0_2.csv'
      - 'scripts/build_paper1_fig6_identifiability_v0_2.py'
      - '.github/workflows/paper1-fig6-identifiability-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fig6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependency
        run: python -m pip install --disable-pip-version-check matplotlib
      - name: Build Fig. 6 from frozen synthesis tables
        run: |
          python scripts/build_paper1_fig6_identifiability_v0_2.py \
            --events data/paper1_fig6_event_gate_v0_2.csv \
            --synthesis data/paper1_fig6_synthesis_v0_2.csv \
            --out-dir build/paper1_fig6_v0_2
      - name: Guard outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/paper1_fig6_v0_2')
          s=json.load(open(root/'summary.json'))
          assert s['status']=='paper1_fig6_identifiability_built'
          assert s['event_rows']==3 and s['synthesis_rows']==4
          assert s['cross_scenario_robust_events']==0
          assert (root/'paper1_fig6_identifiability_synthesis_v0_2.svg').stat().st_size > 1000
          assert (root/'paper1_fig6_identifiability_synthesis_v0_2.png').stat().st_size > 1000
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-fig6-identifiability-v0-2
          path: build/paper1_fig6_v0_2/
          if-no-files-found: error
