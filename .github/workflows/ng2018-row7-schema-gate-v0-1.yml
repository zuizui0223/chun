name: Ng2018 row7 schema gate v0.1

on:
  pull_request:
    paths:
      - 'scripts/probe_ng2018_solanaceae_sources_v0_1.py'
      - 'scripts/preflight_ng2018_schema_tree_v0_1.py'
      - 'scripts/preflight_ng2018_row3_structure_v0_1.py'
      - 'scripts/open_ng2018_row7_schema_v0_1.py'
      - 'tests/test_open_ng2018_row7_schema_v0_1.py'
      - '.github/workflows/ng2018-row7-schema-gate-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install pytest openpyxl
      - name: Unit tests
        run: pytest -q tests/test_open_ng2018_row7_schema_v0_1.py
      - name: Open frozen row7 schema only
        run: python scripts/open_ng2018_row7_schema_v0_1.py --out build/ng2018_row7_schema_v0_1.json
      - name: Assert outcome firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/ng2018_row7_schema_v0_1.json'))
          assert x['header_row_frozen_before_value_opening']==7
          assert x['rows_8_plus_opened'] is False
          assert x['trait_data_rows_opened']==0
          assert x['trait_state_frequencies_computed'] is False
          assert x['tree_trait_crosswalk_computed'] is False
          assert x['hidden_memory_auc_computed'] is False
          print(x['status'])
          print('header=',x['header'])
          print('trait_columns=',x['trait_columns_matching_frozen_terms'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ng2018-row7-schema-gate-v0-1
          path: build/
