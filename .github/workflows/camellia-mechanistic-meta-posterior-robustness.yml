name: Camellia mechanism meta posterior robustness

on:
  pull_request:
    paths:
      - 'data/camellia_flower_color_mechanism_meta_v0_3.csv'
      - 'data/mechanistic_meta_posterior_robustness_v0_1.csv'
      - 'scripts/analyze_mechanistic_meta_posterior_robustness.py'
      - '.github/workflows/camellia-mechanistic-meta-posterior-robustness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check scipy
      - name: Recompute posterior robustness
        run: |
          python scripts/analyze_mechanistic_meta_posterior_robustness.py \
            data/camellia_flower_color_mechanism_meta_v0_3.csv \
            --output /tmp/mechanistic_meta_posterior_robustness.csv
      - name: Verify frozen result
        run: diff --strip-trailing-cr -u data/mechanistic_meta_posterior_robustness_v0_1.csv /tmp/mechanistic_meta_posterior_robustness.csv
