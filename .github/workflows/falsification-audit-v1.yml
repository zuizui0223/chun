name: falsification-audit-v1

on:
  push:
    branches:
      - analysis/falsification-audit-v1
    paths:
      - 'analysis/falsification_*_v1.*'
      - 'analysis/validate_falsification_audit_v1.py'
      - '.github/workflows/falsification-audit-v1.yml'
  pull_request:
    paths:
      - 'analysis/falsification_*_v1.*'
      - 'analysis/validate_falsification_audit_v1.py'
      - '.github/workflows/falsification-audit-v1.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python analysis/validate_falsification_audit_v1.py
