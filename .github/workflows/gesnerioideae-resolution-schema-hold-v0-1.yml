name: Gesnerioideae resolution schema HOLD v0.1

on:
  pull_request:
    paths:
      - 'data/gesnerioideae_resolution_schema_decision_v0_1.json'
      - 'docs/GESNERIOIDEAE_RESOLUTION_SCHEMA_HOLD_V0_1.md'
      - 'scripts/validate_gesnerioideae_resolution_schema_hold_v0_1.py'
      - '.github/workflows/gesnerioideae-resolution-schema-hold-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen upstream preregistration remains outcome-blind
        run: python scripts/validate_gesnerioideae_resolution_profile_prereg_v0_1.py
      - name: Validate schema HOLD and absence of outcome result
        run: python scripts/validate_gesnerioideae_resolution_schema_hold_v0_1.py
      - name: Confirm preregistration and Paper 1 science firewall
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- \
            data/gesnerioideae_resolution_profile_prereg_v0_1.json \
            docs/GESNERIOIDEAE_RESOLUTION_PROFILE_PREREG_V0_1.md \
            manuscript \
            data/paper1_authoritative_results_v0_2_2.csv \
            data/paper1_main_figure_manifest_v0_2_2.csv || {
              echo 'Frozen preregistration or Paper 1 changed unexpectedly' >&2
              exit 1
            }
