name: Paper 1 AJB upload bundle v0.5 ecological integration

on:
  pull_request:
    paths:
      - 'data/ecological_driver_effect_size_registry_v0_2.csv'
      - 'data/ecological_driver_study_registry_v0_2.csv'
      - 'data/paper1_ajb_appendix_mapping_v0_2.csv'
      - 'data/paper1_main_figure_manifest_v0_2.csv'
      - 'data/paper1_ecological_release_delta_manifest_v0_1.csv'
      - 'docs/ECOLOGICAL_DRIVER_META_V2_RESULT.md'
      - 'docs/PAPER1_ECOLOGICAL_INTEGRATION_V1.md'
      - 'docs/PAPER1_TITLE_ABSTRACT_AJB.md'
      - 'docs/PAPER1_AJB_UPLOAD_BUNDLE_V0_5_README.md'
      - 'docs/PAPER1_MAIN_FIGURE_V0_2_FREEZE.md'
      - 'scripts/analyze_ecological_driver_meta_v2.py'
      - 'scripts/build_paper1_ecological_integration_v1.py'
      - 'scripts/apply_paper1_ecological_citations_v1.py'
      - 'scripts/build_paper1_ecological_fig6_v2.py'
      - 'scripts/build_paper1_main_figures.py'
      - 'scripts/build_paper1_supp_tables.py'
      - 'scripts/build_paper1_submission_v0_3.py'
      - 'scripts/build_paper1_ajb_submission_v0_4.py'
      - 'scripts/validate_paper1_ajb_submission_v0_4.py'
      - 'scripts/audit_paper1_ajb_upload_bundle.py'
      - '.github/workflows/paper1-ajb-upload-bundle-v0-5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_upload_bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependency
        run: python -m pip install --disable-pip-version-check matplotlib
      - name: Prepare directories
        run: |
          mkdir -p build/ajb_upload_bundle_v0_5/{manuscript,main_figures,appendices,provenance}
          mkdir -p build/ajb_upload_work_v0_5/{ecological_meta,supplementary_tables,supplementary_figures,source_audit}
      - name: Reproduce ecological-driver meta-analysis v2
        run: |
          python scripts/analyze_ecological_driver_meta_v2.py \
            --effects data/ecological_driver_effect_size_registry_v0_2.csv \
            --studies data/ecological_driver_study_registry_v0_2.csv \
            --out-dir build/ajb_upload_work_v0_5/ecological_meta
      - name: Build and validate ecological-v2 AJB manuscript v0.5
        run: |
          python scripts/build_paper1_ecological_integration_v1.py \
            --input manuscript/PAPER1_AJB_MANUSCRIPT_V0_1.md \
            --output build/ajb_upload_work_v0_5/PAPER1_AJB_MANUSCRIPT_ECO_RAW.md
          python scripts/apply_paper1_ecological_citations_v1.py \
            --input build/ajb_upload_work_v0_5/PAPER1_AJB_MANUSCRIPT_ECO_RAW.md \
            --output build/ajb_upload_work_v0_5/PAPER1_AJB_MANUSCRIPT_ECO_BASE.md
          python scripts/build_paper1_manuscript_v0_2.py \
            --v01 build/ajb_upload_work_v0_5/PAPER1_AJB_MANUSCRIPT_ECO_BASE.md \
            --abstract-source docs/PAPER1_TITLE_ABSTRACT_AJB.md \
            --corrections data/paper1_manuscript_v0_2_corrections.csv \
            --out build/ajb_upload_work_v0_5/PAPER1_AJB_MANUSCRIPT_V0_2.md \
            --summary build/ajb_upload_bundle_v0_5/provenance/v0_2_build_summary.json
          python scripts/validate_paper1_manuscript_v0_1.py \
            --manuscript build/ajb_upload_work_v0_5/PAPER1_AJB_MANUSCRIPT_V0_2.md \
            --out build/ajb_upload_bundle_v0_5/provenance/ecological_claim_gate.json \
            --max-abstract-words 250 \
            --version-label submission_candidate_v0_5_ecological_v2 \
            --require-ecology-v2
          python scripts/build_paper1_submission_v0_3.py \
            --v02 build/ajb_upload_work_v0_5/PAPER1_AJB_MANUSCRIPT_V0_2.md \
            --cleanup data/paper1_submission_cleanup_v0_3.json \
            --out build/ajb_upload_work_v0_5/PAPER1_AJB_SUBMISSION_V0_3.md \
            --summary build/ajb_upload_bundle_v0_5/provenance/v0_3_build_summary.json
          python scripts/build_paper1_ajb_submission_v0_4.py \
            --v03 build/ajb_upload_work_v0_5/PAPER1_AJB_SUBMISSION_V0_3.md \
            --appendix-map data/paper1_ajb_appendix_mapping_v0_2.csv \
            --out build/ajb_upload_bundle_v0_5/manuscript/PAPER1_AJB_UPLOAD_V0_5.md \
            --summary build/ajb_upload_bundle_v0_5/provenance/v0_5_build_summary.json \
            --submission-version v0.5 \
            --source-version v0.3-ecological-v2
          python scripts/validate_paper1_ajb_submission_v0_4.py \
            --manuscript build/ajb_upload_bundle_v0_5/manuscript/PAPER1_AJB_UPLOAD_V0_5.md \
            --appendix-map data/paper1_ajb_appendix_mapping_v0_2.csv \
            --out build/ajb_upload_bundle_v0_5/provenance/v0_5_validation_summary.json \
            --submission-version v0.5 \
            --require-ecology-v2
      - name: Build Main Figs 1-5 and ecological Fig. 6
        run: |
          python scripts/build_paper1_main_figures.py \
            --registry data/paper1_authoritative_results_v0_1.csv \
            --inputs data/paper1_figure_numeric_inputs_v0_1.csv \
            --out-dir build/ajb_upload_bundle_v0_5/main_figures \
            --skip-fig6
          python scripts/build_paper1_ecological_fig6_v2.py \
            --summary build/ajb_upload_work_v0_5/ecological_meta/summary.json \
            --effects data/ecological_driver_effect_size_registry_v0_2.csv \
            --out-dir build/ajb_upload_bundle_v0_5/main_figures
      - name: Build Supporting Information and ecological Appendix S4
        run: |
          python scripts/audit_paper1_source_provenance.py \
            --registry data/paper1_authoritative_results_v0_1.csv \
            --wild-colour data/wfo55_accepted_species_wild_colour_registry_v0_1.csv \
            --micro-sources data/paper1_micro_source_provenance_v0_1.csv \
            --out-dir build/ajb_upload_work_v0_5/source_audit
          python scripts/build_paper1_supp_tables.py \
            --disposition data/paper1_analysis_disposition_v0_1.csv \
            --micro data/paper1_micro_source_provenance_v0_1.csv \
            --wild-audit build/ajb_upload_work_v0_5/source_audit/wild_colour_source_audit.csv \
            --ecology data/paper1_ecological_primary_references_v0_1.csv \
            --ecology-effects data/ecological_driver_effect_size_registry_v0_2.csv \
            --ecology-studies data/ecological_driver_study_registry_v0_2.csv \
            --figure-inputs data/paper1_figure_numeric_inputs_v0_1.csv \
            --results data/paper1_authoritative_results_v0_1.csv \
            --out-dir build/ajb_upload_work_v0_5/supplementary_tables
          python scripts/build_paper1_supp_figures.py \
            --inputs data/paper1_supp_figure_numeric_inputs_v0_1.csv \
            --registry data/paper1_authoritative_results_v0_1.csv \
            --out-dir build/ajb_upload_work_v0_5/supplementary_figures
      - name: Materialize AJB Appendix S1-S9 upload files
        run: |
          mkdir -p build/ajb_upload_work_v0_5/internal_bundle
          ln -s "$(pwd)/build/ajb_upload_work_v0_5/supplementary_tables" build/ajb_upload_work_v0_5/internal_bundle/supplementary_tables
          ln -s "$(pwd)/build/ajb_upload_work_v0_5/supplementary_figures" build/ajb_upload_work_v0_5/internal_bundle/supplementary_figures
          python scripts/materialize_paper1_ajb_appendices.py \
            --mapping data/paper1_ajb_appendix_mapping_v0_2.csv \
            --bundle-root build/ajb_upload_work_v0_5/internal_bundle \
            --out-dir build/ajb_upload_bundle_v0_5/appendices \
            --summary build/ajb_upload_bundle_v0_5/provenance/appendix_materialization_summary.json
      - name: Copy frozen provenance and upload contract
        run: |
          cp data/paper1_authoritative_results_v0_1.csv build/ajb_upload_bundle_v0_5/provenance/
          cp data/paper1_analysis_disposition_v0_1.csv build/ajb_upload_bundle_v0_5/provenance/
          cp data/paper1_micro_source_provenance_v0_1.csv build/ajb_upload_bundle_v0_5/provenance/
          cp data/paper1_ecological_primary_references_v0_1.csv build/ajb_upload_bundle_v0_5/provenance/
          cp data/ecological_driver_effect_size_registry_v0_2.csv build/ajb_upload_bundle_v0_5/provenance/
          cp data/ecological_driver_study_registry_v0_2.csv build/ajb_upload_bundle_v0_5/provenance/
          cp docs/ECOLOGICAL_DRIVER_META_V2_RESULT.md build/ajb_upload_bundle_v0_5/provenance/
          cp build/ajb_upload_work_v0_5/ecological_meta/summary.json build/ajb_upload_bundle_v0_5/provenance/ecological_meta_v2_summary.json
          cp data/paper1_bibliographic_corrections_v0_1.csv build/ajb_upload_bundle_v0_5/provenance/
          cp data/paper1_ajb_appendix_mapping_v0_1.csv build/ajb_upload_bundle_v0_5/provenance/
          cp data/paper1_ajb_appendix_mapping_v0_2.csv build/ajb_upload_bundle_v0_5/provenance/
          cp data/paper1_main_figure_manifest_v0_2.csv build/ajb_upload_bundle_v0_5/provenance/
          cp docs/PAPER1_MAIN_FIGURE_V0_2_FREEZE.md build/ajb_upload_bundle_v0_5/provenance/
          cp data/paper1_release_artifact_manifest_v0_2.csv build/ajb_upload_bundle_v0_5/provenance/
          cp data/paper1_ecological_release_delta_manifest_v0_1.csv build/ajb_upload_bundle_v0_5/provenance/
          cp docs/PAPER1_AJB_UPLOAD_BUNDLE_V0_5_README.md build/ajb_upload_bundle_v0_5/README.md
      - name: Audit final ecological-v2 AJB upload bundle
        run: |
          python scripts/audit_paper1_ajb_upload_bundle.py \
            --bundle build/ajb_upload_bundle_v0_5 \
            --out build/ajb_upload_bundle_v0_5/BUNDLE_MANIFEST.json \
            --manuscript-name PAPER1_AJB_UPLOAD_V0_5.md \
            --bundle-version v0.5-ajb-upload-ecological-v2 \
            --require-ecology-v2
          cat build/ajb_upload_bundle_v0_5/BUNDLE_MANIFEST.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-ajb-upload-bundle-v0-5
          path: build/ajb_upload_bundle_v0_5/
          if-no-files-found: error
