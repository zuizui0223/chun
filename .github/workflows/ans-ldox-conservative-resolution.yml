name: ANS-LDOX conservative sequence resolution

on:
  pull_request:
    paths:
      - 'data/creticulata_ans_reference_feature_effects_v0_1.csv'
      - 'data/ans_ldox_source_feature_decisions_v0_1.csv'
      - 'data/ans_ldox_primer_linkage_deduplicated_v0_1.csv'
      - 'data/ans_ldox_conservative_summary_v0_1.json'
      - 'data/pigment_node_source_id_crosswalk_v0_2.csv'
      - 'data/orthology_resolution_by_feature_v0_2.csv'
      - 'data/micro_accessibility_node_score_harmonized_v0_2.csv'
      - 'scripts/summarize_ans_ldox_conservative.py'
      - '.github/workflows/ans-ldox-conservative-resolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile conservative summarizer
        run: python -m py_compile scripts/summarize_ans_ldox_conservative.py

      - name: Verify conservative evidence contract
        run: |
          python - <<'PY'
          import csv
          import json

          decisions = {r['feature']: r for r in csv.DictReader(open('data/ans_ldox_source_feature_decisions_v0_1.csv'))}
          effects = {r['gene_id']: r for r in csv.DictReader(open('data/creticulata_ans_reference_feature_effects_v0_1.csv'))}
          summary = json.load(open('data/ans_ldox_conservative_summary_v0_1.json'))

          canonical = decisions['gene-LOC114274940']
          divergent = decisions['gene-LOC114288034']
          weak = decisions['gene-LOC114295638']
          novel = decisions['novel.12638']
          crans = decisions['CrANS']

          assert canonical['sequence_gate'] == 'canonical_ANS_LDOX_like'
          assert float(canonical['protein_identity']) >= 0.95
          assert float(canonical['protein_query_coverage']) >= 0.95
          assert canonical['direction_red_minus_white'] == 'red_directed'
          assert float(effects['gene-LOC114274940']['red_minus_white_log2fpkm']) > 0

          assert divergent['sequence_gate'] == 'divergent_ANS_family_candidate'
          assert float(divergent['protein_identity']) >= 0.70
          assert float(divergent['protein_identity']) < 0.95
          assert divergent['direction_red_minus_white'] == 'white_directed'
          assert float(effects['gene-LOC114288034']['red_minus_white_log2fpkm']) < 0

          assert weak['sequence_gate'] == 'fails_strict_ANS_sequence_gate'
          assert weak['reference_lineage_anchor'] == 'no'
          assert novel['sequence_gate'] == 'de_novo_ANS_annotation_sequence_unresolved'
          assert crans['assay_link_status'] == 'one_unique_exact_reference_model_link'
          assert crans['species_native_sequence_recovered'] == 'no'

          counts = summary['evidence_counts']
          assert counts['ANS_family_recurrence_clusters'] == 3
          assert counts['reference_lineage_anchored_clusters'] == 2
          assert counts['species_native_strict_node_clusters'] == 0
          assert counts['strict_crossspecies_exact_recurrence_clusters'] == 0
          assert summary['within_reticulata_reference_mapped_contrast']['copy_or_paralog_direction_heterogeneity_supported'] is True
          PY

      - name: Verify deduplicated CrANS assay link
        run: |
          python - <<'PY'
          import csv
          rows = [r for r in csv.DictReader(open('data/ans_ldox_primer_linkage_deduplicated_v0_1.csv')) if r['assay_feature'] == 'CrANS']
          exact = [r for r in rows if r['deduplicated_link_status'] == 'one_unique_exact_reference_model_link']
          assert len(exact) == 1
          assert exact[0]['unique_exact_amplicons'] == '1'
          assert exact[0]['species_native_sequence_recovered'] == 'no'
          PY

      - name: Verify authoritative ledger state
        run: |
          python - <<'PY'
          import csv
          orth = {r['feature']: r for r in csv.DictReader(open('data/orthology_resolution_by_feature_v0_2.csv'))}
          score = {r['feature']: r for r in csv.DictReader(open('data/micro_accessibility_node_score_harmonized_v0_2.csv'))}
          assert orth['ANS']['family_recurrence_clusters'] == '3'
          assert orth['ANS']['named_or_sequence_anchored_clusters'] == '2'
          assert orth['ANS']['strict_crossspecies_exact_recurrence_clusters'] == '0'
          assert score['ANS']['anchored_clusters'] == '2'
          assert score['ANS']['strict_node_predictor'] == '0'
          PY
