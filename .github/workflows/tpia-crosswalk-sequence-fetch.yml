name: TPIA2 crosswalk sequence fetch

on:
  pull_request:
    paths:
      - 'data/tpia_yunkang10_priority_crosswalk_v0_1.csv'
      - 'scripts/fetch_tpia_crosswalk_sequences.py'
      - '.github/workflows/tpia-crosswalk-sequence-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Fetch YK10/SCZV1/SCZV2 CDS and transcript sequences
        run: |
          python scripts/fetch_tpia_crosswalk_sequences.py \
            --crosswalk data/tpia_yunkang10_priority_crosswalk_v0_1.csv \
            --out-dir build/tpia_crosswalk_sequences
      - name: Report
        if: always()
        run: |
          for f in summary.json request_audit.csv fasta_records.csv; do
            if [ -f build/tpia_crosswalk_sequences/$f ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -c 100000 build/tpia_crosswalk_sequences/$f >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tpia-crosswalk-sequence-fetch
          path: build/tpia_crosswalk_sequences
          if-no-files-found: error
