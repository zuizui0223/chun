name: Paper 1 AJB upload bundle v1.0 novelty-forward

on:
  pull_request:
    paths:
      - 'scripts/*paper1*.py'
      - 'tests/test_paper1_*.py'
      - 'data/paper1_*'
      - 'manuscript/PAPER1_*'
      - 'docs/PAPER1_*'
      - 'requirements/requirements-paper1-submission.txt'
      - 'README.md'
      - '.github/workflows/paper1-ajb-upload-bundle-v1-0.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install submission dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/requirements-paper1-submission.txt
      - name: Test Paper 1 reproducibility primitives
        run: pytest -q tests/test_paper1_ajb_docx_determinism_v1_0.py
      - name: Build audited AJB v1.0 upload bundle twice
        run: |
          python scripts/build_paper1_ajb_bundle_v1_0.py \
            --out-dir build/paper1-ajb-upload-v1-0
          python scripts/build_paper1_ajb_bundle_v1_0.py \
            --out-dir build/paper1-ajb-upload-v1-0-repeat
      - name: Require byte-identical repeated bundle
        run: |
          python scripts/check_paper1_ajb_bundle_determinism_v1_0.py \
            --first build/paper1-ajb-upload-v1-0 \
            --second build/paper1-ajb-upload-v1-0-repeat
      - name: Report final manifest
        run: cat build/paper1-ajb-upload-v1-0/BUNDLE_MANIFEST.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-ajb-upload-bundle-v1-0
          path: build/paper1-ajb-upload-v1-0/
          if-no-files-found: error
