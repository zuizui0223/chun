name: Candidate-free C. nitidissima trajectory v0.1

on:
  pull_request:
    paths:
      - 'data/candidate_free_cn_stage_run_manifest_v0_1.csv'
      - 'data/candidate_free_cn_endpoint_contrast_v0_1.csv'
      - 'data/candidate_free_pigment_module_schema_v0_1.csv'
      - 'data/candidate_free_canonical_bridge_v0_1.csv'
      - 'scripts/build_candidate_free_family_map_from_gff_v0_1.py'
      - 'scripts/prepare_candidate_free_reference_v0_1.sh'
      - 'scripts/aggregate_salmon_family_expression_v0_1.py'
      - 'scripts/score_candidate_free_modules_v0_1.py'
      - 'scripts/summarize_candidate_free_ordered_trajectory_v0_1.py'
      - 'scripts/build_candidate_free_measurement_registry_v0_1.py'
      - '.github/workflows/candidate-free-cn-trajectory-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-free-cn-trajectory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REF_ACCESSION: GCF_004153795.1
      MAX_SPOTS_PER_RUN: '500000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RNA-seq and reference tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sra-toolkit salmon unzip ca-certificates
          salmon --version
          fasterq-dump --version

      - name: Prepare fixed annotation-informative reference
        run: |
          bash scripts/prepare_candidate_free_reference_v0_1.sh build/cn_trajectory_v0_1
          cat build/cn_trajectory_v0_1/reference_route_diagnostic.txt

      - name: Build outcome-independent family map and Salmon index
        run: |
          python scripts/build_candidate_free_family_map_from_gff_v0_1.py \
            --gff "$GFF" --rna-fasta "$RNA_FASTA" \
            --out-dir build/cn_trajectory_v0_1/family_map
          python - <<'PY'
          import json
          s=json.load(open('build/cn_trajectory_v0_1/family_map/family_mapping_summary.json'))
          if s['n_mapped_transcripts']==0:
              raise SystemExit('fixed reference resolves no preregistered pigment family')
          print(json.dumps(s,indent=2,ensure_ascii=False))
          PY
          salmon index -t "$RNA_FASTA" -i build/cn_trajectory_v0_1/salmon_index -p 2

      - name: Quantify all 15 prespecified developmental runs
        run: |
          mkdir -p build/cn_trajectory_v0_1/quant build/cn_trajectory_v0_1/reads
          tail -n +2 data/candidate_free_cn_stage_run_manifest_v0_1.csv | cut -d, -f1 | while read -r RUN; do
            echo "Quantifying $RUN from first ${MAX_SPOTS_PER_RUN} SRA spots"
            rm -f build/cn_trajectory_v0_1/reads/${RUN}_1.fastq build/cn_trajectory_v0_1/reads/${RUN}_2.fastq
            rm -rf build/cn_trajectory_v0_1/reads/tmp_${RUN}
            mkdir -p build/cn_trajectory_v0_1/reads/tmp_${RUN}
            fasterq-dump "$RUN" --split-files -e 2 -m 1GB \
              -t build/cn_trajectory_v0_1/reads/tmp_${RUN} \
              -O build/cn_trajectory_v0_1/reads -X "$MAX_SPOTS_PER_RUN"
            test -s build/cn_trajectory_v0_1/reads/${RUN}_1.fastq
            test -s build/cn_trajectory_v0_1/reads/${RUN}_2.fastq
            salmon quant -i build/cn_trajectory_v0_1/salmon_index -l A \
              -1 build/cn_trajectory_v0_1/reads/${RUN}_1.fastq \
              -2 build/cn_trajectory_v0_1/reads/${RUN}_2.fastq \
              --validateMappings -p 2 -o build/cn_trajectory_v0_1/quant/${RUN}
            rm -f build/cn_trajectory_v0_1/reads/${RUN}_1.fastq build/cn_trajectory_v0_1/reads/${RUN}_2.fastq
            rm -rf build/cn_trajectory_v0_1/reads/tmp_${RUN}
          done

      - name: Aggregate candidate-free family expression
        run: |
          python scripts/aggregate_salmon_family_expression_v0_1.py \
            --quant-root build/cn_trajectory_v0_1/quant \
            --manifest data/candidate_free_cn_stage_run_manifest_v0_1.csv \
            --family-map build/cn_trajectory_v0_1/family_map/transcript_family_map.csv \
            --dataset-id CF_CN_01 --min-percent-mapped 10 \
            --out build/cn_trajectory_v0_1/family_expression.csv

      - name: Score fixed modules and ordered trajectory
        run: |
          python scripts/score_candidate_free_modules_v0_1.py \
            --expression build/cn_trajectory_v0_1/family_expression.csv \
            --modules data/candidate_free_pigment_module_schema_v0_1.csv \
            --contrasts data/candidate_free_cn_endpoint_contrast_v0_1.csv \
            --out-dir build/cn_trajectory_v0_1/scored
          python scripts/summarize_candidate_free_ordered_trajectory_v0_1.py \
            --scores build/cn_trajectory_v0_1/scored/sample_module_scores.csv \
            --dependence-cluster CNITIDISSIMA \
            --out-dir build/cn_trajectory_v0_1/trajectory

      - name: Guard prespecified design without forcing direction
        run: |
          python - <<'PY'
          import json
          s=json.load(open('build/cn_trajectory_v0_1/trajectory/trajectory_summary.json'))
          assert s['prespecified_stages']==['S1','S2','S3','S4','S5']
          assert set(s['axes'])=={'A','F','C','P'}
          assert '5!' in s['uncertainty_test']
          assert 'largest' in s['forbidden_rule']
          print(json.dumps(s,indent=2,ensure_ascii=False))
          PY

      - name: Export canonical candidate-free measurement registry
        run: |
          python scripts/build_candidate_free_measurement_registry_v0_1.py \
            --bridge data/candidate_free_canonical_bridge_v0_1.csv \
            --cn build/cn_trajectory_v0_1/trajectory/trajectory_summary.json \
            --out build/cn_trajectory_v0_1/candidate_free_measurements.csv \
            --summary build/cn_trajectory_v0_1/candidate_free_measurements.summary.json

      - name: Preserve lightweight diagnostics
        if: always()
        run: |
          mkdir -p build/cn_trajectory_v0_1/diagnostics
          cp build/cn_trajectory_v0_1/reference_contract.txt build/cn_trajectory_v0_1/diagnostics/ 2>/dev/null || true
          cp build/cn_trajectory_v0_1/reference_route_diagnostic.txt build/cn_trajectory_v0_1/diagnostics/ 2>/dev/null || true
          printf 'reference=%s\nmax_spots_per_run=%s\nruns=15\nstages=5\nprimary=ordered_S1_to_S5_trajectory\n' "$REF_ACCESSION" "$MAX_SPOTS_PER_RUN" > build/cn_trajectory_v0_1/diagnostics/run_contract.txt
          find build/cn_trajectory_v0_1 -maxdepth 3 -type f -printf '%p\t%s bytes\n' 2>/dev/null | sort > build/cn_trajectory_v0_1/diagnostics/files.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-free-cn-trajectory-v0-1
          path: |
            build/cn_trajectory_v0_1/family_map/
            build/cn_trajectory_v0_1/family_expression.csv
            build/cn_trajectory_v0_1/family_expression.summary.json
            build/cn_trajectory_v0_1/scored/
            build/cn_trajectory_v0_1/trajectory/
            build/cn_trajectory_v0_1/candidate_free_measurements.csv
            build/cn_trajectory_v0_1/candidate_free_measurements.summary.json
            build/cn_trajectory_v0_1/diagnostics/
          if-no-files-found: warn
