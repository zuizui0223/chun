name: Paper 1 AJB upload bundle v0.7 science v0.2 framing v0.3

on:
  pull_request:
    paths:
      - 'manuscript/PAPER1_AJB_MANUSCRIPT_V0_2.md'
      - 'data/paper1_authoritative_results_v0_2.csv'
      - 'data/paper1_main_figure_manifest_v0_2.csv'
      - 'data/paper1_reference_registry_v0_3.csv'
      - 'data/paper1_ajb_appendix_mapping_v0_3.csv'
      - 'data/paper1_fig1_framework_v0_2.csv'
      - 'data/paper1_fig1_observation_contract_v0_2.csv'
      - 'data/paper1_fig2_candidate_free_signature_v0_2.csv'
      - 'data/paper1_fig2_recurrence_intervals_v0_2.csv'
      - 'data/paper1_fig2_direct_overlap_v0_2.csv'
      - 'data/paper1_figure_numeric_inputs_v0_1.csv'
      - 'data/paper1_fig5_nearest_same_v0_2.csv'
      - 'data/paper1_fig5_robustness_status_v0_2.csv'
      - 'data/paper1_fig6_event_gate_v0_2.csv'
      - 'data/paper1_fig6_synthesis_v0_2.csv'
      - 'data/wfo55_accepted_species_wild_colour_registry_v0_1.csv'
      - 'data/ecological_driver_effect_size_registry_v0_2.csv'
      - 'scripts/validate_paper1_result_registry.py'
      - 'scripts/build_paper1_novelty_framed_v0_3.py'
      - 'scripts/validate_paper1_reference_registry_v0_3.py'
      - 'scripts/build_paper1_submission_v0_6.py'
      - 'scripts/build_paper1_submission_v0_7.py'
      - 'scripts/build_paper1_ajb_docx_v0_7.py'
      - 'scripts/build_paper1_ajb_bundle_v0_7.py'
      - 'scripts/audit_paper1_ajb_bundle_v0_7.py'
      - 'scripts/build_paper1_fig1_framework_v0_2.py'
      - 'scripts/build_paper1_fig2_molecular_v0_2.py'
      - 'scripts/build_paper1_fig3_fig4_audits_v0_2.py'
      - 'scripts/build_paper1_fig5_macro_v0_2.py'
      - 'scripts/build_paper1_fig6_identifiability_v0_2.py'
      - 'scripts/build_paper1_supp_figures_v0_2.py'
      - 'docs/PAPER1_NOVELTY_LITERATURE_AUDIT_2026-08-27.md'
      - 'docs/PAPER1_NOVELTY_CORE_ATTACK_ADDENDUM_2026-08-27.md'
      - 'docs/PAPER1_AJB_UPLOAD_BUNDLE_V0_7_README.md'
      - '.github/workflows/paper1-ajb-upload-bundle-v0-7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_upload_bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manuscript and plotting dependencies
        run: python -m pip install --disable-pip-version-check matplotlib python-docx
      - name: Build and audit AJB v0.7 bundle
        run: |
          python scripts/build_paper1_ajb_bundle_v0_7.py \
            --out-dir build/ajb_upload_bundle_v0_7
          cat build/ajb_upload_bundle_v0_7/BUNDLE_MANIFEST.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-ajb-upload-bundle-v0-7
          path: build/ajb_upload_bundle_v0_7/
          if-no-files-found: error
