name: Cape Erica 28-taxon qPCR workbook source preflight v0.1

on:
  pull_request:
    paths:
      - 'scripts/preflight_erica_qpcr_xlsx_source_v0_1.py'
      - 'tests/test_erica_qpcr_xlsx_source_preflight_v0_1.py'
      - 'tests/test_erica_qpcr_xlsx_source_keys_v0_1.py'
      - 'scripts/audit_erica_qpcr_source_keys_v0_1.py'
      - '.github/workflows/erica-qpcr-xlsx-source-preflight-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fail-closed transport and workbook parsing tests
        run: |
          python -m unittest discover -s tests -p 'test_erica_qpcr_xlsx_source_preflight_v0_1.py' -v
          python -m unittest discover -s tests -p 'test_erica_qpcr_xlsx_source_keys_v0_1.py' -v
      - name: Fetch 28-taxon qPCR XLSX from published repository link
        run: |
          python scripts/preflight_erica_qpcr_xlsx_source_v0_1.py \
            --out build/erica_qpcr_source_receipt_v0_1.json \
            --save-xlsx build/erica_source_original.xlsx
      - name: Audit qPCR source taxon/stage/gene IDs without opening outcome
        run: |
          if [ -f build/erica_source_original.xlsx ]; then
            python scripts/audit_erica_qpcr_source_keys_v0_1.py \
              --source build/erica_source_original.xlsx \
              --out build/erica_qpcr_source_keys_v0_1.json
          else
            echo 'SOURCE_ACCESS_HOLD_SKIP_KEY_AUDIT'
          fi
      - name: Enforce source-only gate regardless of transport result
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('build/erica_qpcr_source_receipt_v0_1.json')
          r=json.loads(p.read_text())
          assert r['source']['figshare_file_id']==18004067
          assert r['no_biological_outcome_opened'] is True
          assert r['new_gene_memory_replicate_admitted'] is False
          assert r['trait_tree_expression_joint_source_verified'] is False
          assert r['original_submission_artifacts_unchanged'] is True
          if r['status'].startswith('SOURCE_XLSX_BYTES_RECOVERED'):
              assert r['xlsx_structure']=='PASS'
              assert r['sheets']
              assert pathlib.Path('build/erica_source_original.xlsx').is_file()
          else:
              assert r['status']=='HOLD_EXACT_QPCR_WORKBOOK_NOT_RECOVERED'
              assert not pathlib.Path('build/erica_source_original.xlsx').exists()
          print('ERICA_PREFLIGHT_FAIL_CLOSED_VALIDATED',r['status'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erica-qPCR-source-only-v0-1
          path: |
            build/erica_qpcr_source_receipt_v0_1.json
            build/erica_source_original.xlsx
            build/erica_qpcr_source_keys_v0_1.json
          if-no-files-found: warn
