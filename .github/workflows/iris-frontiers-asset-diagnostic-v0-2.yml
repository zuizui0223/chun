name: Iris Frontiers legacy asset diagnostic v0.2

on:
  pull_request:
    paths:
      - 'scripts/diagnose_frontiers_iris_assets_v0_2.py'
      - '.github/workflows/iris-frontiers-asset-diagnostic-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe legacy and current publisher routes
        run: python scripts/diagnose_frontiers_iris_assets_v0_2.py --out build/iris_frontiers_asset_diagnostic_v0_2.json
      - name: Require one successful asset per frozen source target
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/iris_frontiers_asset_diagnostic_v0_2.json'))
          print('targets:',[(d['description'],d['xml_href'],d['successes']) for d in x['diagnostics']])
          assert len(x['diagnostics'])==2
          assert all(len(d['successes'])==1 for d in x['diagnostics']), x
          assert x['row_level_values_emitted'] is False and x['auc_computed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-frontiers-asset-diagnostic-v0-2
          path: build/iris_frontiers_asset_diagnostic_v0_2.json
          if-no-files-found: warn
          retention-days: 90
