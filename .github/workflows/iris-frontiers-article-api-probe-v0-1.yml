name: Iris Frontiers article metadata probe v0.1

on:
  pull_request:
    paths:
      - 'scripts/probe_frontiers_iris_article_api_v0_1.py'
      - '.github/workflows/iris-frontiers-article-api-probe-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Frontiers article metadata endpoints only
        run: python scripts/probe_frontiers_iris_article_api_v0_1.py --out build/iris_frontiers_article_api_probe_v0_1.json
      - name: Show file-like metadata only
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/iris_frontiers_article_api_probe_v0_1.json'))
          for p in x['probes']:
              print('\n',p.get('url'),p.get('status'),p.get('content_type'),p.get('error'))
              print('file_like_strings=',p.get('file_like_strings'))
          assert x['row_level_values_emitted'] is False and x['auc_computed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-frontiers-article-api-probe-v0-1
          path: build/iris_frontiers_article_api_probe_v0_1.json
          if-no-files-found: warn
          retention-days: 90
