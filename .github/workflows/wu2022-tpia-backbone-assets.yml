# Held-out macro entrypoint: resolve and freeze the public Wu 2022 nuclear-backbone assets before any colour-transition test.
name: Wu 2022 TPIA backbone assets

on:
  pull_request:
    paths:
      - 'scripts/audit_wu2022_tpia_backbone_assets.py'
      - 'scripts/build_wu2022_tpia_preferred_manifest_v2.py'
      - 'scripts/fetch_sra_runinfo.py'
      - 'data/camellia_phylogeny_public_seeds_v0_1.csv'
      - 'data/wu2022_public_backbone_*'
      - 'docs/WU2022_PUBLIC_BACKBONE_ASSET_RESULT.md'
      - '.github/workflows/wu2022-tpia-backbone-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Resolve PRJNA665925 public RunInfo
        run: |
          mkdir -p build/wu2022_tpia/sra build/wu2022_tpia/audit
          python scripts/fetch_sra_runinfo.py \
            --seeds data/camellia_phylogeny_public_seeds_v0_1.csv \
            --out-dir build/wu2022_tpia/sra \
            --include-status phylogeny_candidate

      - name: Try publisher Table S1-S18 workbook
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests, zipfile, io, json
          name='tpj15799-sup-0002-TableS1-S18.xlsx'
          urls=[
            'https://onlinelibrary.wiley.com/action/downloadSupplement?doi=10.1111%2Ftpj.15799&file='+name,
            'https://onlinelibrary.wiley.com/doi/suppl/10.1111/tpj.15799/supinfo/'+name,
          ]
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 chun-public-backbone-audit/0.4'
          errors=[]
          for u in urls:
              try:
                  r=s.get(u,timeout=120,allow_redirects=True)
                  if r.status_code==200 and r.content[:2]==b'PK':
                      zipfile.ZipFile(io.BytesIO(r.content)).testzip()
                      Path('build/wu2022_tpia/TableS1-S18.xlsx').write_bytes(r.content)
                      Path('build/wu2022_tpia/supplement_url.txt').write_text(r.url+'\n')
                      print('publisher workbook recovered',len(r.content),'bytes')
                      break
                  errors.append((u,r.status_code,r.headers.get('content-type'),len(r.content)))
              except Exception as e:
                  errors.append((u,type(e).__name__,str(e)))
          else:
              Path('build/wu2022_tpia/supplement_fetch_status.json').write_text(json.dumps({
                  'status':'publisher_blocked_or_unavailable',
                  'errors':errors,
                  'decision':'continue with reproducible PRJNA665925 RunInfo species set; do not infer missing cultivated-tea duplicate tips'
              },indent=2)+'\n')
          PY

      - name: Crosswalk public Wu taxa to TPIA catalogs
        run: |
          args=(--sra-runinfo build/wu2022_tpia/sra/CPHY001_PRJNA665925_runinfo.csv --out-dir build/wu2022_tpia/audit)
          if [ -f build/wu2022_tpia/TableS1-S18.xlsx ]; then args+=(--supp-xlsx build/wu2022_tpia/TableS1-S18.xlsx); fi
          python scripts/audit_wu2022_tpia_backbone_assets.py "${args[@]}"

      - name: Build provenance-safe preferred assembly manifest
        run: |
          python scripts/build_wu2022_tpia_preferred_manifest_v2.py \
            --run-taxa build/wu2022_tpia/audit/prjna665925_run_taxa.csv \
            --allassemblies build/wu2022_tpia/audit/tpia_allassemblies_catalog.csv \
            --bulk build/wu2022_tpia/audit/tpia_transcriptome_bulk_catalog.csv \
            --aliases build/wu2022_tpia/audit/wu2022_archive_tpia_alias_crosswalk.csv \
            --output build/wu2022_tpia/audit/wu2022_preferred_assembly_manifest_v2.csv \
            --summary build/wu2022_tpia/audit/preferred_manifest_v2_summary.json

      - name: Validate held-out asset gate
        run: |
          python - <<'PY'
          import csv,json
          s=json.load(open('build/wu2022_tpia/audit/preferred_manifest_v2_summary.json'))
          assert s['source_species_level_taxa']==98, s
          assert s['manifest_rows']==98, s
          assert s['coverage_fraction']==1.0, s
          assert s['id_bound_allassemblies']==95, s
          assert s['bulk_fallback']==3, s
          assert sorted(s['bulk_fallback_taxa'])==sorted(['Camellia campanisepala','Camellia lipoensis','Camellia salicifolia']), s
          rows=list(csv.DictReader(open('build/wu2022_tpia/audit/wu2022_preferred_assembly_manifest_v2.csv')))
          assert len(rows)==98
          assert len({r['source_taxon'] for r in rows})==98
          PY

      - name: Freeze public-backbone resource gate
        run: |
          cp build/wu2022_tpia/audit/wu2022_preferred_assembly_manifest_v2.csv data/wu2022_public_backbone_manifest_v0_1.csv
          cp build/wu2022_tpia/audit/preferred_manifest_v2_summary.json data/wu2022_public_backbone_asset_summary_v0_1.json
          cp build/wu2022_tpia/audit/summary.json data/wu2022_public_backbone_audit_summary_v0_1.json
          cp build/wu2022_tpia/audit/prjna665925_run_taxa.csv data/wu2022_prjna665925_run_taxa_v0_1.csv
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open('data/wu2022_public_backbone_asset_summary_v0_1.json'))
          text=f'''# Wu 2022 public nuclear-backbone asset gate\n\n## Result\n\nThe fully public `PRJNA665925` route resolves **{s["manifest_rows"]}/{s["source_species_level_taxa"]} species-level Camellia taxa** to a preferred public assembly/transcriptome source.\n\n- ID-bound `All_assemblies` routes: **{s["id_bound_allassemblies"]}** taxa.\n- Bulk fallback routes: **{s["bulk_fallback"]}** taxa.\n- Bulk fallback taxa: `Camellia campanisepala`, `Camellia lipoensis`, `Camellia salicifolia`.\n- Taxon-level source coverage: **100%**.\n\n## Decision\n\nThe macro-side bottleneck is no longer taxon-level source availability. The next gate is payload identity/checksum validation, especially for the three bulk-fallback taxa, followed by reconstruction of the Wu et al. low-copy nuclear backbone.\n\n## Claim boundary\n\nThis is a **resource/provenance gate only**. It does not reconstruct the 405-gene topology, estimate branch lengths, infer flower-colour ancestral states, count transitions, or test pigment-module enrichment. The Fan 2026 figure-only topology is not substituted for a machine-readable public tree.\n'''
          Path('docs/WU2022_PUBLIC_BACKBONE_ASSET_RESULT.md').write_text(text,encoding='utf-8')
          PY

      - name: Commit frozen asset gate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/wu2022_public_backbone_manifest_v0_1.csv data/wu2022_public_backbone_asset_summary_v0_1.json data/wu2022_public_backbone_audit_summary_v0_1.json data/wu2022_prjna665925_run_taxa_v0_1.csv docs/WU2022_PUBLIC_BACKBONE_ASSET_RESULT.md
          if git diff --cached --quiet; then
            echo 'Frozen Wu 2022 asset gate already matches.'
          else
            git commit -m 'Freeze Wu2022 public nuclear-backbone asset gate'
            git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          fi

      - name: Report
        if: always()
        run: |
          echo '### Wu 2022 TPIA backbone asset gate' >> "$GITHUB_STEP_SUMMARY"
          for f in build/wu2022_tpia/supplement_fetch_status.json build/wu2022_tpia/supplement_url.txt build/wu2022_tpia/sra/manifest_fetch_summary.csv build/wu2022_tpia/audit/summary.json build/wu2022_tpia/audit/preferred_manifest_v2_summary.json build/wu2022_tpia/audit/wu2022_preferred_assembly_manifest_v2.csv; do
            if [ -f "$f" ]; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -c 30000 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wu2022-tpia-backbone-assets
          path: build/wu2022_tpia
          if-no-files-found: error
