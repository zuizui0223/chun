name: Cross-radiation hierarchical rule v0.2
on:
  pull_request:
    paths:
      - 'scripts/summarize_cross_radiation_hierarchical_rule_v0_2.py'
      - 'data/cross_radiation_hierarchical_rule_v0_2.json'
      - 'docs/CROSS_RADIATION_HIERARCHICAL_RULE_V0_2.md'
      - '.github/workflows/cross-radiation-hierarchical-rule-v0-2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate v0.2 decision layer
        run: |
          mkdir -p build
          args=(--out build/cross_radiation_hierarchical_rule_v0_2.json)
          if test -s data/cross_radiation_hierarchical_rule_v0_2.json; then
            args+=(--expected data/cross_radiation_hierarchical_rule_v0_2.json)
          fi
          python scripts/summarize_cross_radiation_hierarchical_rule_v0_2.py "${args[@]}"
          cat build/cross_radiation_hierarchical_rule_v0_2.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-radiation-hierarchical-rule-v0-2
          path: build/cross_radiation_hierarchical_rule_v0_2.json
          if-no-files-found: error
          retention-days: 90
