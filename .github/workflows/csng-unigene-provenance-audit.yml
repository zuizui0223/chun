name: CSNG source unigene provenance audit

on:
  pull_request:
    paths:
      - 'scripts/fetch_pmc_oa_supplement_manifest.py'
      - 'scripts/extract_pdf_term_context.py'
      - '.github/workflows/csng-unigene-provenance-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Fetch PMC6471635 OA package
        run: |
          python scripts/fetch_pmc_oa_supplement_manifest.py \
            --pmcid PMC6471635 \
            --out-dir build/csng_source_provenance
      - name: Search supplementary PDFs for CSNG source IDs
        run: |
          python scripts/extract_pdf_term_context.py \
            --root build/csng_source_provenance \
            --terms CSNG38209 Csng38209 CSNG45659 Csng45659 CSNG5035 Csng5035 DFR LAR \
            --output build/csng_source_provenance/csng_term_context.json
      - name: Report
        if: always()
        run: |
          for f in summary.json supplement_manifest.csv csng_term_context.json; do
            if [ -f build/csng_source_provenance/$f ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -c 120000 build/csng_source_provenance/$f >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csng-source-unigene-provenance-audit
          path: build/csng_source_provenance
          if-no-files-found: error
