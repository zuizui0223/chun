name: Camellia GBIF CHELSA macro niche

on:
  pull_request:
    paths:
      - 'data/camellia_macro_niche_taxa_v0_1.csv'
      - 'scripts/run_camellia_gbif_worldclim_niche.py'
      - 'scripts/run_camellia_gbif_chelsa_niche.py'
      - '.github/workflows/camellia-gbif-chelsa-niche.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  niche:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy requests rasterio
      - name: Run GBIF + CHELSA COG analysis
        run: |
          mkdir -p build/camellia_macro_niche_chelsa
          python scripts/run_camellia_gbif_chelsa_niche.py \
            --taxa data/camellia_macro_niche_taxa_v0_1.csv \
            --out-dir build/camellia_macro_niche_chelsa \
            --min-points 5
      - name: Report
        if: always()
        run: |
          echo '### Camellia GBIF + CHELSA macro niche' >> "$GITHUB_STEP_SUMMARY"
          for f in analysis_summary.json species_climatic_niches.csv colour_niche_group_tests.csv japonica_rusticana_climate_pair.csv occurrence_filter_audit.csv; do
            if [ -f "build/camellia_macro_niche_chelsa/$f" ]; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "build/camellia_macro_niche_chelsa/$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-gbif-chelsa-macro-niche
          path: build/camellia_macro_niche_chelsa
          if-no-files-found: error
