name: Paper 1 AJB upload bundle v0.8 science v0.2.1 framing v0.3.1

on:
  pull_request:
    paths:
      - 'manuscript/PAPER1_AJB_MANUSCRIPT_V0_2.md'
      - 'data/micro_accessibility_edge_registry_v0_2.csv'
      - 'data/paper1_authoritative_results_v0_2_1.csv'
      - 'data/paper1_main_figure_manifest_v0_2_1.csv'
      - 'data/paper1_fig1_observation_contract_v0_2_1.csv'
      - 'data/paper1_reference_registry_v0_2_1.csv'
      - 'data/paper1_reference_registry_v0_4.csv'
      - 'data/paper1_ajb_appendix_mapping_v0_4.csv'
      - 'data/paper1_bibliographic_db_queries_v0_1.csv'
      - 'data/paper1_bibliographic_priority_screen_v0_1.csv'
      - 'scripts/build_paper1_science_v0_2_1.py'
      - 'scripts/build_paper1_novelty_framed_v0_3_1.py'
      - 'scripts/build_paper1_submission_v0_8.py'
      - 'scripts/build_paper1_ajb_docx_v0_8.py'
      - 'scripts/build_paper1_ajb_bundle_v0_8.py'
      - 'scripts/audit_paper1_ajb_bundle_v0_8.py'
      - 'scripts/build_paper1_fig1_framework_v0_2_1.py'
      - 'scripts/build_paper1_fig2_molecular_v0_2.py'
      - 'scripts/build_paper1_fig3_fig4_audits_v0_2.py'
      - 'scripts/build_paper1_fig5_macro_v0_2.py'
      - 'scripts/build_paper1_fig6_identifiability_v0_2.py'
      - 'scripts/build_paper1_supp_figures_v0_2.py'
      - 'scripts/validate_paper1_result_registry.py'
      - 'scripts/validate_paper1_reference_registry_v0_2_1.py'
      - 'scripts/validate_paper1_reference_registry_v0_4.py'
      - 'docs/PAPER1_AJB_UPLOAD_BUNDLE_V0_8_README.md'
      - 'docs/MICRO_ACCESSIBILITY_V0_2_RESULT.md'
      - '.github/workflows/paper1-ajb-upload-bundle-v0-8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_upload_bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manuscript and plotting dependencies
        run: python -m pip install --disable-pip-version-check matplotlib python-docx
      - name: Build and audit AJB v0.8 bundle
        run: |
          python scripts/build_paper1_ajb_bundle_v0_8.py \
            --out-dir build/ajb_upload_bundle_v0_8
          cat build/ajb_upload_bundle_v0_8/BUNDLE_MANIFEST.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-ajb-upload-bundle-v0-8
          path: build/ajb_upload_bundle_v0_8/
          if-no-files-found: error
