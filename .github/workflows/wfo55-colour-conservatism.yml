name: WFO55 wild-colour phylogenetic conservatism

on:
  pull_request:
    paths:
      - 'scripts/test_wfo55_colour_conservatism.py'
      - '.github/workflows/wfo55-colour-conservatism.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  WFO55_TREE_RUN: '32440138207'
  WILD_AUDIT_RUN: '32552102861'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy biopython
      - name: Download frozen WFO55 tree and audited seeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/tree build/audit
          gh run download "$WFO55_TREE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name wfo55-accepted-species-rooted-astral4 --dir build/tree
          gh run download "$WILD_AUDIT_RUN" --repo "$GITHUB_REPOSITORY" \
            --name wfo55-wild-colour-audit --dir build/audit
          tree=$(find build/tree -name 'wfo55_rooted_astral4.nwk' | head -n 1)
          strict=$(find build/audit -name 'wfo55_wild_colour_strict_seed.csv' | head -n 1)
          dominant=$(find build/audit -name 'wfo55_wild_colour_dominant_seed.csv' | head -n 1)
          test -n "$tree"; test -s "$tree"
          test -n "$strict"; test -s "$strict"
          test -n "$dominant"; test -s "$dominant"
          cp "$tree" build/tree.nwk
          cp "$strict" build/strict.csv
          cp "$dominant" build/dominant.csv
      - name: Test strict wild-colour conservatism
        run: |
          python scripts/test_wfo55_colour_conservatism.py \
            --tree build/tree.nwk --colour build/strict.csv \
            --scenario strict_wild --out-dir build/strict \
            --permutations 100000 --seed 20260822
      - name: Test dominant-colour conservatism
        run: |
          python scripts/test_wfo55_colour_conservatism.py \
            --tree build/tree.nwk --colour build/dominant.csv \
            --scenario dominant_wild --out-dir build/dominant \
            --permutations 100000 --seed 20260823
      - name: Gate and report
        run: |
          python - <<'PY'
          import json
          s=json.load(open('build/strict/summary.json'))
          d=json.load(open('build/dominant/summary.json'))
          assert s['tree_tips_total']==56,s
          assert s['colour_overlap']==24,s
          assert s['state_counts']=={'A':1,'W':19,'Y':4},s
          assert d['tree_tips_total']==56,d
          assert d['colour_overlap']==30,d
          assert d['state_counts']=={'A':4,'W':22,'Y':4},d
          print('STRICT'); print(json.dumps(s,indent=2))
          print('DOMINANT'); print(json.dumps(d,indent=2))
          PY
          echo '### WFO55 wild-colour phylogenetic conservatism' >> "$GITHUB_STEP_SUMMARY"
          echo '#### Strict' >> "$GITHUB_STEP_SUMMARY"
          cat build/strict/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '#### Dominant' >> "$GITHUB_STEP_SUMMARY"
          cat build/dominant/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wfo55-wild-colour-conservatism
          path: build/
          if-no-files-found: error
