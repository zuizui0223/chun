name: Paper 1 AJB title and abstract gate

on:
  pull_request:
    paths:
      - 'docs/PAPER1_TITLE_ABSTRACT_AJB.md'
      - 'scripts/validate_paper1_ajb_title_abstract.py'
      - '.github/workflows/paper1-ajb-title-abstract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate AJB title and structured abstract
        run: |
          mkdir -p build/paper1_ajb_title_abstract
          python scripts/validate_paper1_ajb_title_abstract.py \
            --file docs/PAPER1_TITLE_ABSTRACT_AJB.md \
            --out build/paper1_ajb_title_abstract/summary.json
      - name: Report
        run: cat build/paper1_ajb_title_abstract/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-ajb-title-abstract-v0-2
          path: build/paper1_ajb_title_abstract/
          if-no-files-found: error
