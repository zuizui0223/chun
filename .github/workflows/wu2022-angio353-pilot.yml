name: Wu 2022 Angiosperms353 held-out nuclear pilot

on:
  pull_request:
    paths:
      - 'data/wu2022_angio353_pilot_panel_v0_1.csv'
      - 'data/wu2022_public_backbone_manifest_v0_2.csv'
      - 'scripts/download_tpia_panel_assemblies.py'
      - 'scripts/extract_angio353_pilot_hits.py'
      - 'scripts/concat_angio353_pilot_alignments.py'
      - 'scripts/analyze_pilot_tree_fitch.py'
      - '.github/workflows/wu2022-angio353-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pilot against authoritative v0.2 resource manifest
        run: |
          python - <<'PY'
          import csv
          panel=list(csv.DictReader(open('data/wu2022_angio353_pilot_panel_v0_1.csv',encoding='utf-8-sig')))
          manifest=list(csv.DictReader(open('data/wu2022_public_backbone_manifest_v0_2.csv',encoding='utf-8-sig')))
          missing=[]; wrong=[]; resolved=[]
          for r in panel:
              if r.get('admission_status','admit').lower()!='admit':
                  continue
              tax=r['taxon']
              candidates=[m for m in manifest if tax in {m['source_taxon'],m['resource_taxon']}]
              if not candidates:
                  missing.append(tax); continue
              exact_url=[m for m in candidates if m['assembly_url']==r['assembly_url']]
              if len(exact_url)!=1:
                  wrong.append((tax,'authoritative_resource_crosswalk_or_url_not_unique',[(m['source_taxon'],m['resource_taxon'],m['assembly_url']) for m in candidates])); continue
              m=exact_url[0]
              if m['assembly_source']!='tpia_id_bound_allassemblies':
                  wrong.append((tax,m['assembly_source']))
              resolved.append((tax,m['source_taxon'],m['resource_taxon']))
          assert not missing, missing
          assert not wrong, wrong
          print('authoritative_manifest_gate_pass',len(resolved))
          for x in resolved: print('RESOLVED',*x,sep='\t')
          PY

      - name: Install minimal pilot phylogenomics tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq diamond-aligner mafft fasttree
          python -m pip install --disable-pip-version-check requests biopython
          diamond version
          mafft --version 2>&1 | head -n 1 || true
          command -v FastTree || command -v fasttree

      - name: Fetch public Angiosperms353 protein targets
        run: |
          mkdir -p build/wu_angio353/targets
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/mossmatters/Angiosperms353/master/Angiosperms353.FAA' \
            -o build/wu_angio353/targets/Angiosperms353.FAA
          grep -c '^>' build/wu_angio353/targets/Angiosperms353.FAA
          diamond makedb --in build/wu_angio353/targets/Angiosperms353.FAA --db build/wu_angio353/targets/Angiosperms353

      - name: Download and provenance-audit admitted ID-bound TPIA assemblies
        run: |
          python scripts/download_tpia_panel_assemblies.py \
            --panel data/wu2022_angio353_pilot_panel_v0_1.csv \
            --out-dir build/wu_angio353/assemblies \
            --workers 8

      - name: Recover Angiosperms353 translated marker HSPs
        run: |
          mkdir -p build/wu_angio353/hits
          find build/wu_angio353/assemblies/fastas -name '*.fna' -print0 | \
            xargs -0 -n1 -P4 bash -c '
              fa="$0"; base=$(basename "$fa" .fna); echo "blastx $base"
              diamond blastx --db build/wu_angio353/targets/Angiosperms353 \
                --query "$fa" --out "build/wu_angio353/hits/${base}.tsv" \
                --outfmt 6 qseqid sseqid pident length qlen slen evalue bitscore qstart qend sstart send qseq_translated \
                --evalue 1e-5 --max-target-seqs 5 --max-hsps 1 --mid-sensitive --threads 2
            '

      - name: Admit high-occupancy markers
        run: |
          python scripts/extract_angio353_pilot_hits.py \
            --panel data/wu2022_angio353_pilot_panel_v0_1.csv \
            --hits-dir build/wu_angio353/hits \
            --out-dir build/wu_angio353/markers \
            --min-subject-coverage 0.45 --min-aa 80 --min-occupancy 0.80
          test $(find build/wu_angio353/markers -name 'locus_*.faa' | wc -l) -ge 20

      - name: Align admitted markers
        run: |
          mkdir -p build/wu_angio353/align
          find build/wu_angio353/markers -name 'locus_*.faa' -print0 | \
            xargs -0 -n1 -P4 bash -c 'f="$0"; b=$(basename "$f" .faa); mafft --auto --quiet "$f" > "build/wu_angio353/align/${b}.aln.faa"'

      - name: Concatenate trimmed AA markers
        run: |
          python scripts/concat_angio353_pilot_alignments.py \
            --panel data/wu2022_angio353_pilot_panel_v0_1.csv \
            --align-dir build/wu_angio353/align \
            --output build/wu_angio353/concat.faa \
            --partition build/wu_angio353/partitions.txt \
            --summary build/wu_angio353/concat_summary.json \
            --min-nongap 0.60

      - name: Infer unrooted FastTree-LG pilot tree
        run: |
          mkdir -p build/wu_angio353/tree
          FT=$(command -v FastTree || command -v fasttree)
          "$FT" -lg build/wu_angio353/concat.faa > build/wu_angio353/tree/pilot_tree.nwk 2> build/wu_angio353/tree/fasttree.log
          printf 'FastTree-LG pilot; final backbone requires IQ-TREE/coalescent gate\n' > build/wu_angio353/tree/engine.txt

      - name: Test minimum A and Y state changes
        run: |
          python scripts/analyze_pilot_tree_fitch.py \
            --tree build/wu_angio353/tree/pilot_tree.nwk \
            --panel data/wu2022_angio353_pilot_panel_v0_1.csv \
            --output build/wu_angio353/fitch_min_changes.csv \
            --pairs-output build/wu_angio353/nearest_nonstate_pairs.csv

      - name: Report
        if: always()
        run: |
          echo '### Wu/TPIA Angiosperms353 held-out pilot' >> "$GITHUB_STEP_SUMMARY"
          for f in build/wu_angio353/assemblies/download_summary.json build/wu_angio353/assemblies/quarantined_taxa.csv build/wu_angio353/markers/summary.json build/wu_angio353/concat_summary.json build/wu_angio353/tree/engine.txt build/wu_angio353/tree/pilot_tree.nwk build/wu_angio353/fitch_min_changes.csv build/wu_angio353/nearest_nonstate_pairs.csv; do
            if [ -f "$f" ]; then echo "#### $f" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; head -c 30000 "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Stage compact result artifact
        if: always()
        run: |
          mkdir -p build/wu_angio353/result_artifact
          cp -f build/wu_angio353/assemblies/archive_provenance.csv build/wu_angio353/result_artifact/ 2>/dev/null || true
          cp -f build/wu_angio353/assemblies/download_summary.json build/wu_angio353/result_artifact/ 2>/dev/null || true
          cp -f build/wu_angio353/assemblies/quarantined_taxa.csv build/wu_angio353/result_artifact/ 2>/dev/null || true
          cp -f build/wu_angio353/markers/best_hits.csv build/wu_angio353/result_artifact/ 2>/dev/null || true
          cp -f build/wu_angio353/markers/locus_occupancy.csv build/wu_angio353/result_artifact/ 2>/dev/null || true
          cp -f build/wu_angio353/markers/summary.json build/wu_angio353/result_artifact/ 2>/dev/null || true
          cp -f build/wu_angio353/concat_summary.json build/wu_angio353/result_artifact/ 2>/dev/null || true
          cp -f build/wu_angio353/partitions.txt build/wu_angio353/result_artifact/ 2>/dev/null || true
          cp -f build/wu_angio353/tree/pilot_tree.nwk build/wu_angio353/result_artifact/ 2>/dev/null || true
          cp -f build/wu_angio353/tree/engine.txt build/wu_angio353/result_artifact/ 2>/dev/null || true
          cp -f build/wu_angio353/tree/fasttree.log build/wu_angio353/result_artifact/ 2>/dev/null || true
          cp -f build/wu_angio353/fitch_min_changes.csv build/wu_angio353/result_artifact/ 2>/dev/null || true
          cp -f build/wu_angio353/nearest_nonstate_pairs.csv build/wu_angio353/result_artifact/ 2>/dev/null || true
          printf 'artifact staged\n' > build/wu_angio353/result_artifact/status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wu2022-angio353-nuclear-pilot
          path: build/wu_angio353/result_artifact
          if-no-files-found: error
