name: CnFLS2 synteny source audit

on:
  pull_request:
    paths:
      - 'scripts/audit_cnfls2_synteny_sources.py'
      - '.github/workflows/cnfls2-synteny-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Resolve official GWH annotation routes
        run: |
          python scripts/audit_cnfls2_synteny_sources.py \
            --out-dir build/cnfls2_synteny_sources
      - name: Report
        if: always()
        run: |
          echo '### CnFLS2 synteny source audit' >> "$GITHUB_STEP_SUMMARY"
          for f in summary.json assembly_sources.csv request_attempts.json; do
            if [ -f "build/cnfls2_synteny_sources/$f" ]; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "build/cnfls2_synteny_sources/$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cnfls2-synteny-source-audit
          path: build/cnfls2_synteny_sources
          if-no-files-found: error
