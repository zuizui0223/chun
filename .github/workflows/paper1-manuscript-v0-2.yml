name: Paper 1 manuscript v0.2 build and claim gate

on:
  pull_request:
    paths:
      - 'manuscript/PAPER1_AJB_MANUSCRIPT_V0_1.md'
      - 'docs/PAPER1_TITLE_ABSTRACT_AJB.md'
      - 'docs/PAPER1_ECOLOGICAL_INTEGRATION_V1.md'
      - 'data/paper1_manuscript_v0_2_corrections.csv'
      - 'scripts/build_paper1_ecological_integration_v1.py'
      - 'scripts/build_paper1_manuscript_v0_2.py'
      - 'scripts/validate_paper1_manuscript_v0_1.py'
      - '.github/workflows/paper1-manuscript-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build ecological-integrated manuscript base
        run: |
          mkdir -p build/paper1_manuscript_v0_2
          python scripts/build_paper1_ecological_integration_v1.py \
            --input manuscript/PAPER1_AJB_MANUSCRIPT_V0_1.md \
            --output build/paper1_manuscript_v0_2/PAPER1_AJB_MANUSCRIPT_ECO_BASE.md
      - name: Build AJB submission-candidate manuscript v0.2
        run: |
          python scripts/build_paper1_manuscript_v0_2.py \
            --v01 build/paper1_manuscript_v0_2/PAPER1_AJB_MANUSCRIPT_ECO_BASE.md \
            --abstract-source docs/PAPER1_TITLE_ABSTRACT_AJB.md \
            --corrections data/paper1_manuscript_v0_2_corrections.csv \
            --out build/paper1_manuscript_v0_2/PAPER1_AJB_MANUSCRIPT_V0_2.md \
            --summary build/paper1_manuscript_v0_2/build_summary.json
      - name: Re-run current manuscript claim gate on v0.2
        run: |
          python scripts/validate_paper1_manuscript_v0_1.py \
            --manuscript build/paper1_manuscript_v0_2/PAPER1_AJB_MANUSCRIPT_V0_2.md \
            --out build/paper1_manuscript_v0_2/claim_gate_summary.json \
            --max-abstract-words 250 \
            --version-label submission_candidate_v0_2_ecological_v2 \
            --require-ecology-v2
      - name: Report
        run: |
          echo '### Paper 1 manuscript v0.2 build' >> "$GITHUB_STEP_SUMMARY"
          cat build/paper1_manuscript_v0_2/build_summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '### Claim drift gate' >> "$GITHUB_STEP_SUMMARY"
          cat build/paper1_manuscript_v0_2/claim_gate_summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-ajb-manuscript-v0-2
          path: build/paper1_manuscript_v0_2/
          if-no-files-found: error
