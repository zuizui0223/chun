name: Flower-color persistence axis v0.1

on:
  pull_request:
    paths:
      - 'tests/test_flowercolor_persistence_axis_v0_1.py'
      - 'scripts/flowercolor_persistence_axis_v0_1.py'
      - 'data/flowercolor_persistence_axis_prereg_v0_1.json'
      - '.github/workflows/flowercolor-persistence-axis-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install numpy biopython
      - name: Unit tests
        run: python -m unittest tests/test_flowercolor_persistence_axis_v0_1.py
      - name: Trait-blind Dryad tree-axis diagnostic
        run: |
          python - <<'PY'
          import json
          from scripts.run_flowerclades51_source_preflight_v0_1 import (
              API, DATASET_PATH, LANDING_URL, browser_opener, browser_request,
              download_public_file, get_json, list_files, sha256_bytes, version_href,
          )
          from scripts.flowercolor_persistence_axis_v0_1 import summarize_tree_archive

          dataset=get_json(API+DATASET_PATH)
          files=list_files(version_href(dataset))
          by={x.get('path'):x for x in files}
          opener=browser_opener()
          browser_request(opener, LANDING_URL, timeout=90)
          payload=download_public_file(by['trees.zip'], opener)
          assert sha256_bytes(payload)=='ae5c82945e5bf9c29bcabc52d6029acd8d4f5be1fe9141fad95918eacb4f674d'
          out=summarize_tree_archive(payload)
          assert out['tree_count']==51
          vals=sorted(
              ((name,d['max_relative_root_to_tip_deviation'],d['root_to_tip_cv'],d['axis_class'])
               for name,d in out['members'].items()),
              key=lambda x:x[1], reverse=True
          )
          print('TREE_AXIS_COUNTS', json.dumps({
              'tree_count':out['tree_count'],
              'relative_time_tree_count':out['relative_time_tree_count'],
              'normalized_patristic_tree_count':out['normalized_patristic_tree_count'],
          }, sort_keys=True))
          print('TREE_AXIS_MAX_DEVIATIONS', json.dumps(vals[:15]))
          print('TREE_AXIS_ALL', json.dumps(out, sort_keys=True))
          PY
      - name: Confirm manuscript firewalls
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- manuscript data/paper1_authoritative_results_v0_2_2.csv data/cross_radiation_evolution_letters_claim_registry_v0_1.json
