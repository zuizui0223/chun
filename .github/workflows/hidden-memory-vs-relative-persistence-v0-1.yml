name: Hidden memory vs relative persistence v0.1

on:
  pull_request:
    paths:
      - 'requirements/requirements-hidden-memory.txt'
      - 'data/flowerclades51_relative_time_persistence_clade_metrics_historical_v0_1.csv'
      - 'data/flowerclades51_relative_time_persistence_clade_metrics_recovery_v0_1.json'
      - 'data/hidden_memory_vs_relative_persistence_design_v0_1.json'
      - 'scripts/analyze_hidden_memory_vs_relative_persistence_v0_1.py'
      - 'results/hidden_memory_vs_relative_persistence_v0_1/**'
      - 'docs/HIDDEN_MEMORY_VS_RELATIVE_PERSISTENCE_V0_1.md'
      - '.github/workflows/hidden-memory-vs-relative-persistence-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r requirements/requirements-hidden-memory.txt
      - name: Validate historical artifact identity
        run: |
          test "$(git hash-object data/flowerclades51_relative_time_persistence_clade_metrics_historical_v0_1.csv)" = "c34c24c82dcca10e2630686c828071fd6f278f40"
          python - <<'PY'
          import json
          r=json.load(open('data/flowerclades51_relative_time_persistence_clade_metrics_recovery_v0_1.json'))
          assert r['source_branch_head']=='973bd46b81a51b0fe8ddcfc58aad4dd70379fe5a'
          assert r['source_git_blob_sha']=='c34c24c82dcca10e2630686c828071fd6f278f40'
          assert r['underlying_exact_source_sha256']['final_dataset.csv']=='a253308785e4cbd0e361b3ca04cdfdae29c523eefa843375cebf8030ee0874af'
          assert r['underlying_exact_source_sha256']['trees.zip']=='ae5c82945e5bf9c29bcabc52d6029acd8d4f5be1fe9141fad95918eacb4f674d'
          assert r['outcome_fit_during_recovery'] is False
          PY
      - name: Validate frozen design
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/hidden_memory_vs_relative_persistence_design_v0_1.json'))
          assert x['status']=='POST_OUTCOME_EXPLORATORY_RELATIVE_PERSISTENCE_RELATION_FIXED_BEFORE_NEW_CALCULATION'
          assert x['primary_hypothesis']['predictor']=='fine_area'
          assert x['primary_hypothesis']['expected_direction']=='positive'
          assert x['primary_hypothesis']['permutations']==99999
          assert x['el_v0_3_science_changed'] is False
          PY
      - name: Run frozen relation
        run: python scripts/analyze_hidden_memory_vs_relative_persistence_v0_1.py --out build/hidden_memory_vs_relative_persistence_v0_1.json
      - name: Validate frozen result and boundary
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open('build/hidden_memory_vs_relative_persistence_v0_1.json'))
          f=json.load(open('results/hidden_memory_vs_relative_persistence_v0_1/summary_v0_1.json'))
          assert x['n_clades']==f['n_clades']==21
          assert x['primary']['predictor']==f['primary']['predictor']=='fine_area'
          assert x['primary']['supported'] is False and f['primary']['supported'] is False
          for k in ('rho','permutation_p_two_sided'):
              assert math.isclose(x['primary'][k],f['primary'][k],rel_tol=0,abs_tol=1e-15)
          for k in ('q025','median','q975','positive_fraction'):
              assert math.isclose(x['primary']['bootstrap'][k],f['primary']['bootstrap'][k],rel_tol=0,abs_tol=1e-15)
          for k in ('min_rho','max_rho'):
              assert math.isclose(x['primary']['leave_one_clade_out'][k],f['primary']['leave_one_clade_out'][k],rel_tol=0,abs_tol=1e-15)
          assert x['primary']['leave_one_clade_out']['positive_count']==f['primary']['leave_one_clade_out']['positive_count']==21
          assert x['primary']['leave_one_clade_out']['negative_count']==f['primary']['leave_one_clade_out']['negative_count']==0
          for name in f['secondary_descriptive']:
              for k in ('rho','p_two_sided_asymptotic'):
                  assert math.isclose(x['secondary_descriptive'][name][k],f['secondary_descriptive'][name][k],rel_tol=0,abs_tol=1e-15)
          assert f['primary']['permutation_p_two_sided'] > 0.05
          assert f['paper1_science_changed'] is False
          assert f['el_v0_3_science_changed'] is False
          print(json.dumps({
            'primary':f['primary'],
            'secondary':f['secondary_descriptive'],
            'interpretation':f['interpretation']
          },indent=2))
          PY
      - name: Validate frozen EL v0.3 science
        run: python scripts/validate_cross_radiation_el_v0_3_science_freeze_v0_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hidden-memory-vs-relative-persistence-v0-1
          path: build/
