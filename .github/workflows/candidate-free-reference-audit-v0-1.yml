name: Candidate-free reference audit v0.1

on:
  pull_request:
    paths:
      - 'data/candidate_free_pigment_module_schema_v0_1.csv'
      - 'scripts/build_candidate_free_family_map_from_gff_v0_1.py'
      - 'scripts/prepare_candidate_free_reference_v0_1.sh'
      - '.github/workflows/candidate-free-reference-audit-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-free-reference-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REF_ACCESSION: GCF_004153795.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reference tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip ca-certificates

      - name: Prepare fixed annotation-informative reference
        run: |
          bash scripts/prepare_candidate_free_reference_v0_1.sh build/candidate_free_reference_audit_v0_1
          cat build/candidate_free_reference_audit_v0_1/reference_route_diagnostic.txt

      - name: Map preregistered families from annotation only
        run: |
          python scripts/build_candidate_free_family_map_from_gff_v0_1.py \
            --gff "$GFF" \
            --rna-fasta "$RNA_FASTA" \
            --out-dir build/candidate_free_reference_audit_v0_1/family_map

      - name: Evaluate primary module identifiability
        run: |
          python - <<'PY'
          import csv,json,os
          s=json.load(open('build/candidate_free_reference_audit_v0_1/family_map/family_mapping_summary.json'))
          schema=list(csv.DictReader(open('data/candidate_free_pigment_module_schema_v0_1.csv')))
          primary=[r for r in schema if r['in_primary_score'].strip().lower()=='yes']
          expected={}
          for r in primary:
              expected.setdefault(r['axis'],[]).append(r['gene_family'])
          present={f for f,n in s['mapped_transcripts_per_family'].items() if n>0}
          modules={}
          for axis,fams in expected.items():
              resolved=[f for f in fams if f in present]
              modules[axis]={
                'expected_families':fams,
                'resolved_families':resolved,
                'completeness':len(resolved)/len(fams),
                'scorable_under_50pct_gate':len(resolved)/len(fams)>=0.5
              }
          unscorable=sorted(axis for axis,x in modules.items() if not x['scorable_under_50pct_gate'])
          out={
            'status':'reference_identifiability_audit',
            'reference':os.environ['REF_ACCESSION'],
            'reference_route':os.environ.get('REFERENCE_ROUTE','unknown'),
            'n_mapped_transcripts':s['n_mapped_transcripts'],
            'n_families_with_at_least_one_transcript':s['n_families_with_at_least_one_transcript'],
            'modules':modules,
            'unscorable_primary_axes':unscorable,
            'interpretation':'Reference/annotation coverage only; no expression or flower-colour outcome is used.'
          }
          open('build/candidate_free_reference_audit_v0_1/reference_audit.json','w').write(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          if out['n_mapped_transcripts']==0:
              raise SystemExit('Reference annotation resolves none of the preregistered pigment families')
          if unscorable:
              raise SystemExit(f'Primary module axes below frozen 50% family-completeness gate: {unscorable}')
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-free-reference-audit-v0-1
          path: |
            build/candidate_free_reference_audit_v0_1/reference_contract.txt
            build/candidate_free_reference_audit_v0_1/reference_route_diagnostic.txt
            build/candidate_free_reference_audit_v0_1/family_map/
            build/candidate_free_reference_audit_v0_1/reference_audit.json
          if-no-files-found: warn
