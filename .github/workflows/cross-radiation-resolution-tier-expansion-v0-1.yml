name: Cross-radiation resolution tier expansion v0.1

on:
  pull_request:
    paths:
      - 'data/cross_radiation_resolution_tier_expansion_v0_1.csv'
      - 'data/cross_radiation_resolution_tier_expansion_summary_v0_1.json'
      - 'data/cross_clade_mechanistic_recurrence_benchmark_v0_1.csv'
      - 'data/petunieae_prospective_cross_level_v0_1.json'
      - 'scripts/summarize_cross_radiation_resolution_tier_expansion_v0_1.py'
      - 'docs/CROSS_RADIATION_RESOLUTION_TIER_EXPANSION_V0_1.md'
      - '.github/workflows/cross-radiation-resolution-tier-expansion-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild tier-expansion synthesis
        run: |
          python scripts/summarize_cross_radiation_resolution_tier_expansion_v0_1.py \
            --out build/cross_radiation_resolution_tier_expansion_summary_v0_1.json
      - name: Verify frozen result exactly
        run: |
          python - <<'PY'
          import json
          observed=json.load(open('build/cross_radiation_resolution_tier_expansion_summary_v0_1.json'))
          expected=json.load(open('data/cross_radiation_resolution_tier_expansion_summary_v0_1.json'))
          assert observed==expected, (observed, expected)
          assert observed['primary_paired_M1']['hue_branch_specific_or_finer']=='3/3'
          assert observed['primary_paired_M1']['amount_or_depletion_branch_specific_or_finer']=='0/3'
          assert observed['external_stress']['M2_hue_branching']['system']=='IPOMOEA'
          assert observed['external_stress']['M3_depletion_or_loss']['systems']==['AQUILEGIA','EPIMEDIUM']
          assert observed['superseded_binary_wording']=='HUE_STABLE_WHILE_DEPLETION_UNSTABLE'
          assert observed['paper1_science_changed'] is False
          print(json.dumps(observed, indent=2))
          PY
      - name: Confirm Paper 1 science firewall
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- \
            manuscript \
            data/paper1_authoritative_results_v0_2_2.csv \
            data/paper1_main_figure_manifest_v0_2_2.csv || {
              echo 'Paper 1 science/manuscript changed unexpectedly' >&2
              exit 1
            }
