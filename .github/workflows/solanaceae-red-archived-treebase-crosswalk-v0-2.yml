name: Solanaceae red archived TreeBASE crosswalk v0.2

on:
  push:
    branches:
      - analysis/solanaceae-red-archived-treebase-crosswalk-v0-2
  pull_request:
    paths:
      - 'scripts/verify_solanaceae_red_archived_treebase_crosswalk_v0_2.py'
      - 'tests/test_solanaceae_red_archived_treebase_crosswalk_v0_2.py'
      - 'data/solanaceae_red_archived_treebase_crosswalk_v0_2.json'
      - 'docs/SOLANACEAE_RED_ARCHIVED_TREEBASE_CROSSWALK_V0_2.md'
      - '.github/workflows/solanaceae-red-archived-treebase-crosswalk-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check biopython==1.85
      - name: Unit tests
        run: python -m unittest tests/test_solanaceae_red_archived_treebase_crosswalk_v0_2.py
      - name: Source-only archived TreeBASE verification
        if: ${{ hashFiles('scripts/verify_solanaceae_red_archived_treebase_crosswalk_v0_2.py') != '' }}
        run: |
          mkdir -p build/solanaceae_red_archived_treebase_crosswalk_v0_2
          python scripts/verify_solanaceae_red_archived_treebase_crosswalk_v0_2.py \
            --receipt build/solanaceae_red_archived_treebase_crosswalk_v0_2/receipt.json
      - name: Verify frozen receipt if present
        if: ${{ hashFiles('data/solanaceae_red_archived_treebase_crosswalk_v0_2.json') != '' }}
        run: |
          cmp build/solanaceae_red_archived_treebase_crosswalk_v0_2/receipt.json \
              data/solanaceae_red_archived_treebase_crosswalk_v0_2.json
      - name: Outcome firewall
        run: |
          test ! -e data/solanaceae_red_biochemical_resolution_profile_v0_1.json
          test ! -e results/solanaceae_red_biochemical_resolution_profile_v0_1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solanaceae-red-archived-treebase-crosswalk-v0-2
          path: build/solanaceae_red_archived_treebase_crosswalk_v0_2
          retention-days: 90
