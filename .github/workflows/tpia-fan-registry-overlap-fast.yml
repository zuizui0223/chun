name: TPIA Fan registry overlap fast

on:
  pull_request:
    paths:
      - 'scripts/fetch_pmc_cloud_media_v0_1.py'
      - 'scripts/build_fan2026_species_colour_seed.py'
      - 'scripts/audit_tpia_fan_registry_overlap_fast.py'
      - '.github/workflows/tpia-fan-registry-overlap-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl requests
      - name: Acquire Fan Data S1 and species seed
        run: |
          mkdir -p build/tpia_fast/package build/tpia_fast/result
          python scripts/fetch_pmc_cloud_media_v0_1.py \
            --pmcid PMC12946509 \
            --out-dir build/tpia_fast/package \
            --require-glob '*s002*.xlsx'
          xlsx=$(find build/tpia_fast/package -type f -iname '*s002*.xlsx' | head -n1);test -n "$xlsx";cp "$xlsx" build/tpia_fast/DataS1.xlsx
          python scripts/build_fan2026_species_colour_seed.py build/tpia_fast/DataS1.xlsx --output build/tpia_fast/fan_seed.csv --audit build/tpia_fast/fan_seed_audit.json
      - name: Query TPIA registry only
        run: |
          python scripts/audit_tpia_fan_registry_overlap_fast.py \
            --fan-seed build/tpia_fast/fan_seed.csv \
            --out-dir build/tpia_fast/result
      - name: Report
        run: |
          echo '### TPIA × Fan registry overlap' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY";cat build/tpia_fast/result/summary.json >> "$GITHUB_STEP_SUMMARY";echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tpia-fan-registry-overlap-fast
          path: build/tpia_fast
          if-no-files-found: error
