name: Rhododendron30 Wiley supplement recovery v0.5

on:
  pull_request:
    paths:
      - 'requirements-rhododendron-test.txt'
      - 'scripts/recover_rhododendron30_wiley_supplements_v0_5.py'
      - 'tests/test_recover_rhododendron30_wiley_supplements_v0_5.py'
      - '.github/workflows/rhododendron30-wiley-supplement-recovery-v0-5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: python -m pip install --disable-pip-version-check -r requirements-rhododendron-test.txt
      - name: Unit tests
        run: pytest -q tests/test_recover_rhododendron30_wiley_supplements_v0_5.py
      - name: Recover exact-named publisher supplements without opening contents
        run: python scripts/recover_rhododendron30_wiley_supplements_v0_5.py --out build/rhododendron30_wiley_recovery_v0_5.json
      - name: Assert outcome firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/rhododendron30_wiley_recovery_v0_5.json'))
          f=x['outcome_firewall']
          assert f['species_rows_opened'] is False
          assert f['chemistry_workbook_opened'] is False
          assert f['row_level_anthocyanin_values_opened'] is False
          assert f['compound_states_computed'] is False
          assert f['state_frequencies_computed'] is False
          assert f['profile_auc_computed'] is False
          assert f['hidden_memory_auc_computed'] is False
          print(x['status'])
          print('chemistry=',x['files']['chemistry']['recovered'],x['files']['chemistry']['bytes'],x['files']['chemistry']['sha256'])
          print('species=',x['files']['species']['recovered'],x['files']['species']['bytes'],x['files']['species']['sha256'])
          print('next_gate=',x['next_gate'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhododendron30-wiley-recovery-v0-5
          path: build/
