name: Cross-radiation resolution synthesis v0.1

on:
  pull_request:
    paths:
      - 'data/cross_radiation_resolution_evidence_v0_1.csv'
      - 'data/cross_clade_mechanistic_recurrence_levels_v0_1.csv'
      - 'data/cross_radiation_resolution_synthesis_v0_1.json'
      - 'data/cross_radiation_state_granularity_v0_3.json'
      - 'data/iochrominae_cross_level_bridge_summary_v0_1.json'
      - 'data/erica_phenotype_axis_molecular_bridge_summary_v0_1.json'
      - 'data/petunieae_prospective_cross_level_v0_1.json'
      - 'data/epimedium_cross_level_endpoint_bridge_summary_v0_1.json'
      - 'data/white_baseline_cross_clade_atlas_v0_1.csv'
      - 'scripts/summarize_cross_radiation_resolution_v0_1.py'
      - 'docs/CROSS_RADIATION_RESOLUTION_SYNTHESIS_V0_1.md'
      - '.github/workflows/cross-radiation-resolution-synthesis-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild cross-radiation resolution synthesis
        run: |
          python scripts/summarize_cross_radiation_resolution_v0_1.py --out build/cross_radiation_resolution_synthesis_v0_1.json
      - name: Verify frozen synthesis exactly
        run: |
          python - <<'PY'
          import json
          observed=json.load(open('build/cross_radiation_resolution_synthesis_v0_1.json'))
          expected=json.load(open('data/cross_radiation_resolution_synthesis_v0_1.json'))
          assert observed==expected, (observed,expected)
          assert observed['macro_level']['fine_state_organization_support'].startswith('3/3')
          assert observed['molecular_level']['hue_branching_localization_support']=='3/3 systems'
          assert observed['molecular_level']['amount_or_depletion_fixed_output_localization']=='1/3 systems'
          assert observed['hierarchical_mechanistic_benchmark']['systems_whose_strongest_supported_recurrence_level_is_complete_programme']=='0/7'
          assert observed['prospective_status']=='PARTIALLY_PROSPECTIVE_NOT_FULLY_PROSPECTIVELY_REPLICATED'
          assert observed['paper1_science_changed'] is False
          print(json.dumps(observed,indent=2))
          PY
      - name: Confirm Paper 1 science firewall
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- manuscript data/paper1_authoritative_results_v0_2_2.csv data/paper1_main_figure_manifest_v0_2_2.csv || {
            echo 'Paper 1 science/manuscript changed unexpectedly' >&2
            exit 1
          }
