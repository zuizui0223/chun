name: Hydrangea source reanalysis v0.2
on:
  pull_request:
    paths:
      - 'scripts/*hydrangea*v0_2.py'
      - 'tests/*hydrangea*v0_2.py'
      - 'data/hydrangea_source_reanalysis_v0_2/**'
      - '.github/workflows/hydrangea-source-reanalysis-v0-2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source readers
        run: python -m pip install 'PyMuPDF==1.26.4' 'biopython==1.85' 'scipy==1.16.1'
      - name: Retrieve actual source files
        run: python scripts/ingest_hydrangea_sources_v0_2.py --out-dir build/hydrangea_source_reanalysis_v0_2
      - name: Preserve source files and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydrangea-source-reanalysis-v0-2
          path: build/hydrangea_source_reanalysis_v0_2/
          if-no-files-found: error
          retention-days: 90
