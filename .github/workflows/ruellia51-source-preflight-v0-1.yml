name: Ruellia51 source preflight v0.1

on:
  pull_request:
    paths:
      - 'scripts/diagnose_ruellia51_figshare_metadata_v0_1.py'
      - 'data/ruellia51_source_preflight_receipt_v0_1.json'
      - 'docs/RUELLIA51_SOURCE_PREFLIGHT_V0_1.md'
      - '.github/workflows/ruellia51-source-preflight-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert outcome result remains absent
        run: test ! -e results/ruellia51_hplc_resolution_profile_v0_1
      - name: Query Figshare metadata only
        run: python scripts/diagnose_ruellia51_figshare_metadata_v0_1.py
      - name: Validate outcome firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/ruellia51_figshare_metadata_v0_1.json'))
          assert x['status']=='FIGSHARE_METADATA_ONLY_OUTCOMES_UNOPENED'
          assert x['article_id']==30282448
          assert x['row_level_HPLC_values_read'] is False
          assert x['AUC_computed'] is False
          assert x['winner_computed'] is False
          print({'doi':x['doi'],'version':x['version'],'files':[(f['id'],f['name'],f['size']) for f in x['files']]})
          PY
      - name: Confirm Paper 1 science firewall
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- manuscript data/paper1_authoritative_results_v0_2_2.csv data/paper1_main_figure_manifest_v0_2_2.csv
      - uses: actions/upload-artifact@v4
        with:
          name: ruellia51-figshare-metadata-v0-1
          path: build/ruellia51_figshare_metadata_v0_1.json
          retention-days: 90
