name: Linoideae source reanalysis v0.2
on:
  pull_request:
    paths:
      - 'scripts/*linoideae*v0_2.py'
      - 'data/linoideae_source_reanalysis_v0_2/**'
      - 'tests/*linoideae*v0_2.py'
      - '.github/workflows/linoideae-source-reanalysis-v0-2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf==1.26.4
      - name: Acquire original source files
        run: |
          python scripts/ingest_linoideae_sources_v0_2.py --out-dir build/linoideae_source_v0_2
          mkdir -p build/linoideae_source_v0_2/repro_scripts
          cp scripts/ingest_linoideae_sources_v0_2.py build/linoideae_source_v0_2/repro_scripts/
          git rev-parse HEAD > build/linoideae_source_v0_2/ci_checkout_sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linoideae-source-v0-2
          path: build/linoideae_source_v0_2
          if-no-files-found: error
