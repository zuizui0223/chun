name: Solanaceae red biochemical resolution profile outcome v0.1

on:
  push:
    branches:
      - analysis/solanaceae-red-biochemical-profile-outcome-v0-1
  pull_request:
    paths:
      - 'scripts/run_solanaceae_red_biochemical_resolution_profile_v0_1.py'
      - 'tests/test_solanaceae_red_biochemical_resolution_profile_v0_1.py'
      - 'data/solanaceae_red_biochemical_resolution_profile_result_v0_1.json'
      - 'docs/SOLANACEAE_RED_BIOCHEMICAL_RESOLUTION_PROFILE_RESULT_V0_1.md'
      - '.github/workflows/solanaceae-red-biochemical-resolution-profile-outcome-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcome:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check biopython==1.85 numpy==2.5.3 scipy==1.16.1
      - name: Unit tests
        run: python -m unittest tests/test_solanaceae_red_biochemical_resolution_profile_v0_1.py
      - name: Diagnose frozen Table S1 table structure
        run: |
          python - <<'PY'
          import collections
          import importlib.util
          import json
          import tempfile
          from pathlib import Path

          path = Path('scripts/run_solanaceae_red_biochemical_resolution_profile_v0_1.py')
          spec = importlib.util.spec_from_file_location('sol_outcome', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          prereg = json.load(open(mod.PREREG))
          preflight = mod.load_preflight_module()
          with tempfile.TemporaryDirectory() as td:
              payload, _ = preflight.v2.acquire_pmc_supplement(
                  prereg['source']['primary_pigment_pmcid'],
                  prereg['source']['supplement_file'],
                  Path(td),
              )
          identifiers = preflight.inspect_docx_identifiers(payload, prereg['source']['supplement_file'])
          print('species_identifier_table_indices=', identifiers['species_identifier_table_indices'])
          print('table_structure=', identifiers['table_structure'])
          for ti in identifiers['species_identifier_table_indices']:
              rows = mod.docx_table_rows(payload, ti)
              headers = mod.header_rows_before_species_data(rows, identifiers['selected_species_column_index'])
              data = rows[len(headers):]
              print('candidate_table=', ti, 'header_rows=', headers)
              print('candidate_table=', ti, 'data_row_width_counts=', dict(sorted(collections.Counter(len(r) for r in data).items())))
              if ti == 0:
                  for ci in range(1, 7):
                      tokens = [r[ci].strip() if ci < len(r) else '' for r in data]
                      parsed = [mod.parse_numeric_proportion(x) for x in tokens]
                      print('anthocyanidin_col=', ci, 'numeric=', sum(x is not None for x in parsed), 'missing=', sum(x is None for x in parsed), 'non_numeric_tokens=', sorted(set(t for t, p in zip(tokens, parsed) if p is None)))
              if ti == 1:
                  tokens = [r[1].strip() if len(r) > 1 else '' for r in data]
                  print('carotenoid_tokens=', dict(sorted(collections.Counter(tokens).items())))
                  print('carotenoid_parsed=', {repr(k): mod.parse_carotenoid_presence(k) for k in sorted(set(tokens))})
          PY
      - name: Run frozen outcome analysis
        if: ${{ hashFiles('scripts/run_solanaceae_red_biochemical_resolution_profile_v0_1.py') != '' }}
        run: |
          mkdir -p build/solanaceae_red_biochemical_resolution_profile_v0_1
          python scripts/run_solanaceae_red_biochemical_resolution_profile_v0_1.py \
            --out build/solanaceae_red_biochemical_resolution_profile_v0_1/result.json
      - name: Verify frozen result if present
        if: ${{ hashFiles('data/solanaceae_red_biochemical_resolution_profile_result_v0_1.json') != '' }}
        run: |
          cmp build/solanaceae_red_biochemical_resolution_profile_v0_1/result.json \
              data/solanaceae_red_biochemical_resolution_profile_result_v0_1.json
      - name: Frozen-input and Paper 1 guard
        run: |
          git diff --exit-code 77ebf3f9d36a13cdcc21f9356a26b42e910f0e11...HEAD -- \
            data/solanaceae_red_biochemical_resolution_profile_prereg_v0_1.json \
            data/solanaceae_red_archived_treebase_crosswalk_v0_2.json \
            manuscript \
            data/paper1_authoritative_results_v0_2_2.csv \
            data/paper1_main_figure_manifest_v0_2_2.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solanaceae-red-biochemical-resolution-profile-outcome-v0-1
          path: build/solanaceae_red_biochemical_resolution_profile_v0_1
          retention-days: 90
