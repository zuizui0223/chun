name: Paper 1 v0.2 authoritative result registry

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate v0.2 result and figure dependency registry
        run: |
          mkdir -p build/paper1_registry_v0_2
          python scripts/validate_paper1_result_registry.py \
            --registry data/paper1_authoritative_results_v0_2.csv \
            --figures data/paper1_main_figure_manifest_v0_2.csv \
            --out-dir build/paper1_registry_v0_2
      - name: Report authoritative contract
        run: |
          echo '### Paper 1 v0.2 authoritative result registry' >> "$GITHUB_STEP_SUMMARY"
          cat build/paper1_registry_v0_2/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-authoritative-result-registry-v0-2
          path: build/paper1_registry_v0_2/
          if-no-files-found: error
