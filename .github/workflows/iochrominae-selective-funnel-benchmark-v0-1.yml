name: Iochrominae selective-funnel benchmark v0.1

on:
  pull_request:
    paths:
      - 'data/iochrominae_polymorphic_species_seed_v0_1.csv'
      - 'data/iochrominae_source_bundle_contract_v0_1.csv'
      - 'docs/IOCHROMINAE_SELECTIVE_FUNNEL_BENCHMARK_V0_1.md'
      - 'scripts/validate_iochrominae_benchmark_seed_v0_1.py'
      - '.github/workflows/iochrominae-selective-funnel-benchmark-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate published seed and source identity
        run: |
          mkdir -p build/iochrominae_benchmark_v0_1
          python scripts/validate_iochrominae_benchmark_seed_v0_1.py \
            --seed data/iochrominae_polymorphic_species_seed_v0_1.csv \
            --bundle data/iochrominae_source_bundle_contract_v0_1.csv \
            --out build/iochrominae_benchmark_v0_1/summary.json
      - name: Report
        run: cat build/iochrominae_benchmark_v0_1/summary.json >> "$GITHUB_STEP_SUMMARY"
