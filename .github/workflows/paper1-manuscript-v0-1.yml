name: Paper 1 manuscript v0.1 claim-drift gate

on:
  pull_request:
    paths:
      - 'manuscript/PAPER1_AJB_MANUSCRIPT_V0_1.md'
      - 'scripts/validate_paper1_manuscript_v0_1.py'
      - '.github/workflows/paper1-manuscript-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate editable manuscript template structure and claim freeze
        run: |
          mkdir -p build/paper1_manuscript_v0_1
          python scripts/validate_paper1_manuscript_v0_1.py \
            --manuscript manuscript/PAPER1_AJB_MANUSCRIPT_V0_1.md \
            --out build/paper1_manuscript_v0_1/summary.json \
            --max-abstract-words 300 \
            --version-label editable_v0_1_template
      - name: Report
        run: cat build/paper1_manuscript_v0_1/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-manuscript-v0-1-audit
          path: build/paper1_manuscript_v0_1/
          if-no-files-found: error
