name: Epimedium supplementary API discovery v0.1

on:
  pull_request:
    paths:
      - 'scripts/discover_epimedium_supplement_api_v0_1.py'
      - '.github/workflows/epimedium-supplement-api-discovery-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query NCBI supplementary-material API
        id: discover
        continue-on-error: true
        run: |
          python scripts/discover_epimedium_supplement_api_v0_1.py \
            --out-dir build/epimedium_supplement_api_v0_1
      - name: Report discovery
        if: always()
        run: |
          if [ -f build/epimedium_supplement_api_v0_1/summary.json ]; then
            cat build/epimedium_supplement_api_v0_1/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epimedium-supplement-api-v0-1
          path: build/epimedium_supplement_api_v0_1/
          if-no-files-found: error
      - name: Enforce discovery success
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/epimedium_supplement_api_v0_1/summary.json')
          if not p.exists():
              raise SystemExit('missing discovery summary')
          d = json.loads(p.read_text())
          if d.get('discovery_status') != 'PASS':
              raise SystemExit(f"discovery failed: {d.get('discovery_status')}")
          PY
