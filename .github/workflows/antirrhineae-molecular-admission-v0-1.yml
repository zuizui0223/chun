name: Antirrhineae molecular admission v0.1

on:
  pull_request:
    paths:
      - 'data/antirrhineae_molecular_admission_screen_v0_1.csv'
      - 'docs/ANTIRRHINEAE_MOLECULAR_ADMISSION_SCREEN_V0_1.md'
      - 'scripts/validate_antirrhineae_molecular_admission_v0_1.py'
      - '.github/workflows/antirrhineae-molecular-admission-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate strict molecular bridge gate
        run: |
          mkdir -p build/antirrhineae_molecular_admission_v0_1
          python scripts/validate_antirrhineae_molecular_admission_v0_1.py \
            --screen data/antirrhineae_molecular_admission_screen_v0_1.csv \
            --out build/antirrhineae_molecular_admission_v0_1/summary.json
      - name: Report
        run: cat build/antirrhineae_molecular_admission_v0_1/summary.json >> "$GITHUB_STEP_SUMMARY"
