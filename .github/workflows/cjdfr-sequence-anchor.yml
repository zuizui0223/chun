name: CjDFR public sequence anchor

on:
  pull_request:
    paths:
      - 'data/cjdfr_public_sequence_targets_v0_1.csv'
      - 'data/cjdfr_public_assays_v0_1.csv'
      - 'data/cjdfr_sequence_manifest_v0_1.csv'
      - 'data/cjdfr_pairwise_dfr_family_v0_1.csv'
      - 'data/cjdfr_assay_linkage_v0_1.csv'
      - 'data/cjdfr_sequence_anchor_summary_v0_1.json'
      - 'scripts/analyze_cjdfr_sequence_anchor.py'
      - 'docs/CJDFR_SEQUENCE_ANCHOR_RESULT.md'
      - '.github/workflows/cjdfr-sequence-anchor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check biopython
          sudo apt-get update -qq
          sudo apt-get install -y -qq ncbi-blast+

      - name: Fetch frozen accessions and resolve CjDFR lineage
        env:
          NCBI_EMAIL: chun-ci@users.noreply.github.com
        run: |
          python scripts/analyze_cjdfr_sequence_anchor.py \
            --targets data/cjdfr_public_sequence_targets_v0_1.csv \
            --assays data/cjdfr_public_assays_v0_1.csv \
            --out-dir build/cjdfr_sequence_anchor

      - name: Validate analysis contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/cjdfr_sequence_anchor")
          summary = json.loads((root / "summary.json").read_text())
          assert summary["query"]["accession"] == "AB524885.1"
          assert summary["candidate_count"] == 6
          assert len(summary["best_reference"]["accession"]) > 0
          assert (root / "sequence_manifest.csv").stat().st_size > 100
          assert (root / "pairwise_summary.csv").stat().st_size > 100
          assert (root / "assay_linkage.csv").stat().st_size > 100
          PY

      - name: Verify frozen result when present
        run: |
          set -eu
          for pair in \
            "data/cjdfr_sequence_manifest_v0_1.csv build/cjdfr_sequence_anchor/sequence_manifest.csv" \
            "data/cjdfr_pairwise_dfr_family_v0_1.csv build/cjdfr_sequence_anchor/pairwise_summary.csv" \
            "data/cjdfr_assay_linkage_v0_1.csv build/cjdfr_sequence_anchor/assay_linkage.csv" \
            "data/cjdfr_sequence_anchor_summary_v0_1.json build/cjdfr_sequence_anchor/summary.json"; do
            set -- $pair
            if [ -f "$1" ]; then
              diff --strip-trailing-cr -u "$1" "$2"
            fi
          done

      - name: Report
        if: always()
        run: |
          echo '### CjDFR public sequence anchor' >> "$GITHUB_STEP_SUMMARY"
          for f in sequence_manifest.csv pairwise_summary.csv assay_linkage.csv summary.json; do
            if [ -f "build/cjdfr_sequence_anchor/$f" ]; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "build/cjdfr_sequence_anchor/$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cjdfr-sequence-anchor
          path: build/cjdfr_sequence_anchor
          if-no-files-found: error
