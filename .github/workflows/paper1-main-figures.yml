name: Paper 1 main figure build

on:
  pull_request:
    paths:
      - 'data/paper1_authoritative_results_v0_1.csv'
      - 'data/paper1_figure_numeric_inputs_v0_1.csv'
      - 'scripts/build_paper1_main_figures.py'
      - '.github/workflows/paper1-main-figures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependency
        run: python -m pip install --disable-pip-version-check matplotlib
      - name: Build Main Fig 1–6
        run: |
          mkdir -p build/paper1_main_figures
          python scripts/build_paper1_main_figures.py \
            --registry data/paper1_authoritative_results_v0_1.csv \
            --inputs data/paper1_figure_numeric_inputs_v0_1.csv \
            --out-dir build/paper1_main_figures
      - name: Audit figure set
        run: |
          test "$(find build/paper1_main_figures -maxdepth 1 -name 'Fig*.svg' | wc -l)" -eq 6
          test "$(find build/paper1_main_figures -maxdepth 1 -name 'Fig*.png' | wc -l)" -eq 6
          cat build/paper1_main_figures/figure_build_summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-main-figures-v0-1
          path: build/paper1_main_figures/
          if-no-files-found: error
