name: nicotiana-falsification-hold-v1

on:
  push:
    branches:
      - analysis/falsification-audit-v1
    paths:
      - 'analysis/nicotiana_fine_state_falsification_result_v1.json'
      - 'scripts/validate_nicotiana_falsification_v1.py'
      - 'analysis/falsification_candidates_v1.tsv'
      - 'analysis/falsification_audit_v1.md'
      - 'analysis/validate_falsification_audit_v1.py'
      - '.github/workflows/nicotiana-falsification-hold-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-hold:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install light admission dependencies
        run: python -m pip install --disable-pip-version-check requests biopython
      - name: Recover frozen source/trait audit artifact
        run: |
          mkdir -p analysis/_generated
          gh run download 34185987604 --repo zuizui0223/chun --name nicotiana-source-admission-v1 --dir analysis/_generated
          test -f analysis/_generated/nicotiana_source_v1/trait_audit.json
      - name: Regenerate exact TNRS diagnostics and require HOLD gate
        run: |
          set +e
          python scripts/inspect_nicotiana_opentree_v1.py
          code=$?
          set -e
          test "$code" -eq 1
          python - <<'PY'
          import json
          p='analysis/_generated/nicotiana_opentree_v1/summary.json'
          x=json.load(open(p, encoding='utf-8'))
          assert x['endpoint_allowed'] is False
          assert x['frozen_coverage_gate_80pct'] is True
          assert x['frozen_minimum_n_20_gate'] is False
          assert x['n_tree_overlap'] == 17
          print('regenerated expected Nicotiana HOLD gate')
          PY
      - name: Validate frozen Nicotiana HOLD
        run: python scripts/validate_nicotiana_falsification_v1.py
      - name: Validate cross-radiation audit
        run: python analysis/validate_falsification_audit_v1.py
      - name: Prove biological endpoint remains unopened
        run: test ! -e analysis/_generated/nicotiana_falsification_v1/result.json
      - name: Upload regenerated admission diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nicotiana-falsification-hold-v1
          path: analysis/_generated/nicotiana_opentree_v1/
          if-no-files-found: warn
