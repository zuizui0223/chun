name: Cheng 2022 nuclear tree package audit

on:
  pull_request:
    paths:
      - '.github/workflows/cheng2022-tree-package-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download PMC OA package
        run: |
          mkdir -p build/cheng2022/package
          curl --fail --location --retry 3 \
            'https://www.ncbi.nlm.nih.gov/pmc/utils/oa/oa.fcgi?id=PMC9311850' \
            -o build/cheng2022/oa.xml
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=ET.fromstring(Path('build/cheng2022/oa.xml').read_bytes())
          links=[x.attrib.get('href','') for x in root.findall('.//link') if x.attrib.get('format')=='tgz']
          if len(links)!=1: raise SystemExit(f'unexpected tgz links {links}')
          u=links[0]
          if u.startswith('ftp://ftp.ncbi.nlm.nih.gov/'):
              u='https://ftp.ncbi.nlm.nih.gov/'+u.split('ftp://ftp.ncbi.nlm.nih.gov/',1)[1]
          Path('build/cheng2022/url').write_text(u+'\n')
          print(u)
          PY
          u=$(cat build/cheng2022/url)
          if ! curl --fail --location --retry 3 --retry-all-errors "$u" -o build/cheng2022/a.tgz; then
            u2=$(python - <<'PY'
          from pathlib import Path
          u=Path('build/cheng2022/url').read_text().strip(); m='https://ftp.ncbi.nlm.nih.gov/pub/pmc/'
          print(u.replace(m,m+'deprecated/',1) if u.startswith(m) and '/deprecated/' not in u else u)
          PY
          )
            curl --fail --location --retry 3 --retry-all-errors "$u2" -o build/cheng2022/a.tgz
          fi
          tar -xzf build/cheng2022/a.tgz -C build/cheng2022/package
      - name: Inventory tree-like resources
        run: |
          find build/cheng2022/package -type f -printf '%P\t%s\n' | sort > build/cheng2022/all_files.tsv
          find build/cheng2022/package -type f \( \
            -iname '*.nwk' -o -iname '*.newick' -o -iname '*.tre' -o -iname '*.tree' \
            -o -iname '*.treefile' -o -iname '*.trees' -o -iname '*.nex' -o -iname '*.nexus' \
            -o -iname '*.txt' -o -iname '*.csv' -o -iname '*.tsv' \
          \) -printf '%P\t%s\n' | sort > build/cheng2022/tree_like_files.tsv
          python - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('build/cheng2022/package')
          candidates=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.stat().st_size>20_000_000: continue
              if p.suffix.lower() in {'.xml','.html','.htm','.txt','.csv','.tsv','.nex','.nexus','.tre','.tree','.nwk','.newick','.treefile','.trees'}:
                  txt=p.read_text(encoding='utf-8',errors='ignore')
                  # Newick-like signal: repeated parentheses, commas and terminal semicolon.
                  score=(txt.count('('),txt.count(')'),txt.count(','),txt.count(';'))
                  if score[0]>=3 and score[1]>=3 and score[2]>=3:
                      candidates.append({'file':str(p.relative_to(root)),'bytes':p.stat().st_size,'newick_like_counts':score})
          Path('build/cheng2022/newick_candidates.json').write_text(json.dumps(candidates,indent=2)+'\n')
          print(json.dumps(candidates,indent=2))
          PY
      - name: Report
        if: always()
        run: |
          echo '### Cheng 2022 OA package tree audit' >> "$GITHUB_STEP_SUMMARY"
          echo '#### Tree-like files' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build/cheng2022/tree_like_files.tsv >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '#### Newick-like candidates' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat build/cheng2022/newick_candidates.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheng2022-tree-package-audit
          path: build/cheng2022
          if-no-files-found: error
