name: Candidate-free C. reticulata mapping audit v0.1

on:
  pull_request:
    paths:
      - '.github/workflows/candidate-free-creticulata-mapping-audit-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve GEO samples to runs without BioProject or accession-order inference
        run: |
          python - <<'PY'
          import csv,gzip,io,json,re,time,urllib.parse,urllib.request
          from pathlib import Path

          out=Path('build/creticulata_mapping_audit_v0_1')
          out.mkdir(parents=True,exist_ok=True)
          ua={'User-Agent':'chun-candidate-free-archive-audit/0.1 contact=github.com/zuizui0223/chun'}
          def get(url, attempts=4):
              last=None
              for attempt in range(1, attempts+1):
                  try:
                      req=urllib.request.Request(url,headers=ua)
                      with urllib.request.urlopen(req,timeout=120) as r: return r.read()
                  except Exception as e:
                      last=e
                      if attempt < attempts: time.sleep(2*attempt)
              raise last

          geo_url='https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE236364&targ=gsm&view=full&form=text'
          try:
              text=get(geo_url).decode('utf-8','replace'); geo_route='NCBI_GEO_accession_text'
          except Exception as e:
              ftp='https://ftp.ncbi.nlm.nih.gov/geo/series/GSE236nnn/GSE236364/soft/GSE236364_family.soft.gz'
              text=gzip.decompress(get(ftp)).decode('utf-8','replace')
              geo_route=f'GEO_family_soft_fallback_after:{type(e).__name__}'
          (out/'GSE236364_family.txt').write_text(text,encoding='utf-8')

          samples=[]; cur=None
          for line in text.splitlines():
              if line.startswith('^SAMPLE = '):
                  if cur: samples.append(cur)
                  cur={'gsm':line.split('=',1)[1].strip(),'title':'','source':'','characteristics':[],'relations':[],'all_accessions':[]}
              elif cur is not None:
                  if line.startswith('!Sample_title = '): cur['title']=line.split('=',1)[1].strip()
                  elif line.startswith('!Sample_source_name_ch1 = '): cur['source']=line.split('=',1)[1].strip()
                  elif line.startswith('!Sample_characteristics_ch1 = '): cur['characteristics'].append(line.split('=',1)[1].strip())
                  elif line.startswith('!Sample_relation = '): cur['relations'].append(line.split('=',1)[1].strip())
                  cur['all_accessions'] += re.findall(r'(?:SRX|SRR|SRS|SAMN)\d+',line)
          if cur: samples.append(cur)
          if len(samples)!=27: raise SystemExit(f'GSE236364 should expose 27 GSM samples; got {len(samples)}')

          geo_rows=[]
          for s in samples:
              srx=sorted(set(x for x in s['all_accessions'] if x.startswith('SRX')))
              samn=sorted(set(x for x in s['all_accessions'] if x.startswith('SAMN')))
              geo_rows.append({'gsm':s['gsm'],'title':s['title'],'source':s['source'],
                               'characteristics':' | '.join(s['characteristics']),'relations':' | '.join(s['relations']),
                               'srx':';'.join(srx),'samn':';'.join(samn)})
          with (out/'geo_samples.tsv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(geo_rows[0]),delimiter='\t');w.writeheader();w.writerows(geo_rows)

          # Frozen from successful GEO-first audit run 32822609384. This is a
          # transport fallback, not an accession-order inference: live ENA responses,
          # when available, must match these exact SRX->SRR relations.
          frozen={
            'SRX20201120':'SRR24413206','SRX20201121':'SRR24413205','SRX20201122':'SRR24413204',
            'SRX20201123':'SRR24413203','SRX20201124':'SRR24413202','SRX20201125':'SRR24413201',
            'SRX20201126':'SRR24413200','SRX20201127':'SRR24413199','SRX20201128':'SRR24413198',
            'SRX20201129':'SRR24413197','SRX20201130':'SRR24413196','SRX20201131':'SRR24413195',
            'SRX20201132':'SRR24413194','SRX20201133':'SRR24413193','SRX20201134':'SRR24413192',
            'SRX20201135':'SRR24413191','SRX20201136':'SRR24413190','SRX20201137':'SRR24413189',
            'SRX20201138':'SRR24413188','SRX20201139':'SRR24413187','SRX20201140':'SRR24413186',
            'SRX20201141':'SRR24413185','SRX20201142':'SRR24413184','SRX20201143':'SRR24413183',
            'SRX20201144':'SRR24413182','SRX20201145':'SRR24413181','SRX20201146':'SRR24413180'}
          if len(frozen)!=27: raise SystemExit('frozen SRX->SRR crosswalk must contain 27 entries')

          fields_raw=get('https://www.ebi.ac.uk/ena/portal/api/returnFields?result=read_run').decode('utf-8','replace')
          (out/'ena_read_run_fields.tsv').write_text(fields_raw,encoding='utf-8')
          available=set()
          for row in csv.DictReader(io.StringIO(fields_raw),delimiter='\t'):
              for k in ('columnId','field','id'):
                  if row.get(k): available.add(row[k])
          desired=['run_accession','experiment_accession','sample_accession','secondary_sample_accession','sample_alias','experiment_alias','library_name','sample_title']
          fields=[x for x in desired if x in available]
          if 'run_accession' not in fields: fields=['run_accession','experiment_accession','sample_accession','secondary_sample_accession']

          expected=set(frozen.values()); cross=[]; live_ok=0; frozen_fallback=0
          for s in samples:
              srxs=sorted(set(x for x in s['all_accessions'] if x.startswith('SRX')))
              if len(srxs)!=1: raise SystemExit(f"{s['gsm']} expected one SRX, got {srxs}")
              srx=srxs[0]
              if srx not in frozen: raise SystemExit(f'unfrozen GEO SRX relation: {s["gsm"]}/{srx}')
              url='https://www.ebi.ac.uk/ena/portal/api/filereport?'+urllib.parse.urlencode({
                  'accession':srx,'result':'read_run','fields':','.join(fields),'format':'tsv','download':'true'})
              rr=[]
              for attempt in range(1,6):
                  try:
                      et=get(url,attempts=2).decode('utf-8','replace')
                      rr=list(csv.DictReader(io.StringIO(et),delimiter='\t'))
                  except Exception:
                      rr=[]
                  if len(rr)==1: break
                  if len(rr)>1: raise SystemExit(f'{s["gsm"]}/{srx} live ENA returned {len(rr)} runs')
                  if attempt<5: time.sleep(2*attempt)
              expected_run=frozen[srx]
              if len(rr)==1:
                  r=rr[0]
                  if r.get('run_accession')!=expected_run:
                      raise SystemExit(f'{s["gsm"]}/{srx}: live run {r.get("run_accession")} != frozen {expected_run}')
                  live_ok+=1; resolution='live_ena_verified'
              else:
                  r={'run_accession':expected_run,'experiment_accession':srx,'sample_accession':'','secondary_sample_accession':'',
                     'sample_alias':'','experiment_alias':'','library_name':'','sample_title':''}
                  frozen_fallback+=1; resolution='frozen_crosswalk_after_live_empty'
              cross.append({'run':expected_run,'experiment':srx,'resolution':resolution,
                  'sample_accession':r.get('sample_accession',''),'secondary_sample_accession':r.get('secondary_sample_accession',''),
                  'sample_alias':r.get('sample_alias',''),'experiment_alias':r.get('experiment_alias',''),'library_name':r.get('library_name',''),
                  'ena_sample_title':r.get('sample_title',''),'gsm':s['gsm'],'geo_title':s['title'],'geo_source':s['source'],
                  'geo_characteristics':' | '.join(s['characteristics']),'geo_relations':' | '.join(s['relations'])})

          observed={r['run'] for r in cross}
          if observed!=expected or len(cross)!=27: raise SystemExit('resolved crosswalk drifted from frozen 27-run set')
          with (out/'run_geo_crosswalk.tsv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(cross[0]),delimiter='\t');w.writeheader();w.writerows(sorted(cross,key=lambda x:x['run']))
          summary={'status':'gse236364_27_samples_resolved_one_to_one','geo_route':geo_route,'n_geo_samples':27,'n_runs':27,
                   'live_ena_verified':live_ok,'frozen_crosswalk_fallback':frozen_fallback,
                   'frozen_provenance_run':32822609384,
                   'rule':'GEO GSM->SRX is primary biology; live ENA must match frozen successful SRX->SRR crosswalk when available'}
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-free-creticulata-mapping-audit-v0-1
          path: build/creticulata_mapping_audit_v0_1/
          if-no-files-found: error
