name: Cross-angiosperm UV source audit v0.1

on:
  pull_request:
    paths:
      - 'data/cross_angiosperm_uv_source_audit_v0_1.csv'
      - 'docs/CROSS_ANGIOSPERM_UV_LAYER_SCREEN_V0_1.md'
      - 'scripts/validate_cross_angiosperm_uv_source_audit_v0_1.py'
      - '.github/workflows/cross-angiosperm-uv-source-audit-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate UV source audit
        run: |
          mkdir -p build/cross_angiosperm_uv_source_audit_v0_1
          python scripts/validate_cross_angiosperm_uv_source_audit_v0_1.py \
            --audit data/cross_angiosperm_uv_source_audit_v0_1.csv \
            --out build/cross_angiosperm_uv_source_audit_v0_1/summary.json
      - name: Report
        run: cat build/cross_angiosperm_uv_source_audit_v0_1/summary.json >> "$GITHUB_STEP_SUMMARY"
