name: Iris intermediate-resolution source preflight v0.1

on:
  pull_request:
    paths:
      - 'scripts/acquire_iris_intermediate_resolution_preflight_v0_1.py'
      - '.github/workflows/iris-intermediate-resolution-preflight-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install table reader
        run: python -m pip install --disable-pip-version-check pandas openpyxl
      - name: Confirm preregistration is already on base main
        run: |
          test -f data/intermediate_resolution_rule_prereg_v0_1.json
          python scripts/validate_intermediate_resolution_rule_prereg_v0_1.py \
            --input data/intermediate_resolution_rule_prereg_v0_1.json || true
          python - <<'PY'
          import json
          x=json.load(open('data/intermediate_resolution_rule_prereg_v0_1.json'))
          assert x['status']=='FROZEN_BEFORE_CHUN_IRIS_ROW_LEVEL_OUTCOME_INGESTION'
          assert x['fourth_radiation']['id']=='IRIS'
          print('freeze present')
          PY
      - name: Download source files and emit headers only
        run: |
          python scripts/acquire_iris_intermediate_resolution_preflight_v0_1.py \
            --out build/iris_intermediate_resolution_preflight_v0_1.json
      - name: Assert no outcome statistic was computed
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/iris_intermediate_resolution_preflight_v0_1.json'))
          assert x['status']=='POST_FREEZE_SOURCE_HEADER_PREFLIGHT_ONLY'
          assert x['row_level_values_emitted'] is False
          assert x['auc_computed'] is False
          assert len(x['files'])==2
          print(json.dumps(x,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iris-intermediate-resolution-preflight-v0-1
          path: build/iris_intermediate_resolution_preflight_v0_1.json
          retention-days: 90
