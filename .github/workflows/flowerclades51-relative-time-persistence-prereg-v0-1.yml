name: Flowerclades51 relative-time persistence prereg v0.1

on:
  push:
    branches:
      - analysis/flowerclades51-relative-time-persistence-prereg-v0-1
  pull_request:
    paths:
      - 'data/flowerclades51_relative_time_persistence_prereg_v0_1.json'
      - 'docs/FLOWERCLADES51_RELATIVE_TIME_PERSISTENCE_PREREG_V0_1.md'
      - 'tests/test_flowerclades51_relative_time_persistence_prereg_v0_1.py'
      - '.github/workflows/flowerclades51-relative-time-persistence-prereg-v0-1.yml'

jobs:
  validate-prereg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_flowerclades51_relative_time_persistence_prereg_v0_1.py
