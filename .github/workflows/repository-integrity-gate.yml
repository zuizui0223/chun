name: Repository integrity gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  SOURCE_DATE_EPOCH: "946684800"

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned integrity dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-repository-integrity.txt

      - name: Validate all workflow YAML
        run: python scripts/check_workflow_yaml_integrity_v0_1.py

      - name: Audit dependency pinning and reject new debt
        run: |
          python scripts/audit_ci_dependency_pinning_v0_1.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --require-zero \
            --report-out build/ci_dependency_inventory.json

      - name: Run full regression suite
        run: pytest -q tests

      - name: Validate frozen Evolution Letters science
        run: python scripts/validate_cross_radiation_el_v0_3_science_freeze_v0_1.py

      - name: Rebuild Paper 1 submission bundle twice
        run: |
          python scripts/build_paper1_ajb_bundle_v1_0.py --out-dir build/integrity-paper1-a
          python scripts/build_paper1_ajb_bundle_v1_0.py --out-dir build/integrity-paper1-b

      - name: Require byte-identical Paper 1 bundles
        run: |
          python scripts/check_paper1_ajb_bundle_determinism_v1_0.py \
            --first build/integrity-paper1-a \
            --second build/integrity-paper1-b
