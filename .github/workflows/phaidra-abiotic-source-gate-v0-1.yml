name: PHAIDRA abiotic moderator source gate v0.1

on:
  pull_request:
    paths:
      - 'data/flower_memory_abiotic_moderator_prereg_v0_1.json'
      - 'docs/FLOWER_MEMORY_ABIOTIC_MODERATOR_PREREG_V0_1.md'
      - 'scripts/probe_phaidra_abiotic_source_v0_1.py'
      - 'tests/test_probe_phaidra_abiotic_source_v0_1.py'
      - '.github/workflows/phaidra-abiotic-source-gate-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: pip install pytest
      - name: Unit tests
        run: pytest -q tests/test_probe_phaidra_abiotic_source_v0_1.py
      - name: Validate prereg
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/flower_memory_abiotic_moderator_prereg_v0_1.json'))
          assert x['status']=='FROZEN_BEFORE_PHAIDRA_ABIOTIC_DATA_INGESTION'
          assert x['primary_test']['expected_direction']=='negative'
          assert x['source_firewall']['no_new_gbif_redownload_if_phaidra_source_is_unavailable'] is True
          PY
      - name: Inventory PHAIDRA source without opening data rows
        run: python scripts/probe_phaidra_abiotic_source_v0_1.py --out build/phaidra_abiotic_inventory_v0_1.json
      - uses: actions/upload-artifact@v4
        with:
          name: phaidra-abiotic-inventory-v0-1
          path: build/phaidra_abiotic_inventory_v0_1.json
