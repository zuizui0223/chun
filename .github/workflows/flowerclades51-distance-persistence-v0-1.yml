name: Flower-clades-51 distance persistence v0.1

on:
  pull_request:
    paths:
      - 'scripts/run_flowerclades51_distance_persistence_v0_1.py'
      - 'tests/test_flowerclades51_distance_persistence_v0_1.py'
      - '.github/workflows/flowerclades51-distance-persistence-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install numpy scipy biopython pytest
      - name: Unit tests
        run: pytest -q tests/test_flowerclades51_distance_persistence_v0_1.py
      - name: Run exact-source persistence spike
        run: |
          python scripts/run_flowerclades51_distance_persistence_v0_1.py             --download             --outdir build/flowerclades51_distance_persistence_v0_1
      - name: Show headline result
        run: |
          python - <<'PY'
          import json
          p='build/flowerclades51_distance_persistence_v0_1/summary.json'
          x=json.load(open(p))
          print(json.dumps(x['headline'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flowerclades51-distance-persistence-v0-1
          path: build/flowerclades51_distance_persistence_v0_1/
