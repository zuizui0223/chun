name: Iris source taxon crosswalk v0.1

on:
  pull_request:
    paths:
      - 'scripts/inspect_iris_source_taxon_labels_v0_1.py'
      - '.github/workflows/iris-source-taxon-label-inspection-v0-1.yml'
      - 'data/iris_source_taxon_crosswalk_v0_1.csv'
      - 'scripts/validate_iris_source_taxon_crosswalk_v0_1.py'
      - 'docs/IRIS_SOURCE_TAXON_CROSSWALK_V0_1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas openpyxl
      - name: Inspect source taxon labels only
        run: python scripts/inspect_iris_source_taxon_labels_v0_1.py
      - name: Validate frozen one-to-one source crosswalk
        run: |
          python scripts/validate_iris_source_taxon_crosswalk_v0_1.py \
            --out build/iris_source_taxon_crosswalk_v0_1.json
      - name: Assert source-only closure and no outcome statistic
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/iris_source_taxon_crosswalk_v0_1.json'))
          assert x['status']=='IRIS_SOURCE_TAXON_CROSSWALK_VALID'
          assert x['mapped_trait_rows']==226
          assert x['mapped_distinct_accession_rows']==226
          assert x['unmatched_accession_rows']==['Iris_cedretii','Iris_darwasica']
          assert x['trait_values_inspected'] is False
          assert x['auc_computed'] is False
          assert x['decision_computed'] is False
          print(json.dumps(x,indent=2))
          PY
      - name: Confirm no frozen statistic implementation in source-label scripts
        run: |
          ! grep -E 'roc_auc|9999|patristic' scripts/inspect_iris_source_taxon_labels_v0_1.py scripts/validate_iris_source_taxon_crosswalk_v0_1.py
      - name: Confirm Paper 1 firewall
        run: git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- manuscript data/paper1_authoritative_results_v0_2_2.csv data/paper1_main_figure_manifest_v0_2_2.csv
      - uses: actions/upload-artifact@v4
        with:
          name: iris-source-taxon-crosswalk-v0-1
          path: build/iris_source_taxon_crosswalk_v0_1.json
          retention-days: 90
