name: polemoniaceae-access-v1
on:
  push:
    branches: [analysis/falsification-audit-v1]
    paths:
      - 'scripts/probe_polemoniaceae_source_access_v1.py'
      - '.github/workflows/polemoniaceae-access-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe metadata and ZIP prefixes only
        run: python scripts/probe_polemoniaceae_source_access_v1.py
      - name: Assert no source parsing or signal computation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('analysis/_generated/polemoniaceae_access_v1/result.json').read_text())
          assert x['source_content_parsed'] is False
          assert x['signal_computed'] is False
          print('access-only probe preserved; gate=',x['candidate_access_gate'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polemoniaceae-access-v1
          path: analysis/_generated/polemoniaceae_access_v1/
          if-no-files-found: warn
