name: C nitidissima FLS source sequence audit

on:
  pull_request:
    paths:
      - 'scripts/fetch_pmc_oa_supplement_manifest.py'
      - 'scripts/scan_public_supplements_for_terms.py'
      - '.github/workflows/cnitidissima-fls-source-sequence-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl pypdf
      - name: Fetch Feng 2024 PMC OA package
        run: |
          python scripts/fetch_pmc_oa_supplement_manifest.py \
            --pmcid PMC11382509 \
            --out-dir build/cnitidissima_fls_source
      - name: Scan package for CnFLS source identifiers
        run: |
          python scripts/scan_public_supplements_for_terms.py \
            --root build/cnitidissima_fls_source \
            --terms CnFLS1 CnFLS2 CnFLS3 CnFLS4 FLS2 FLS1 FLS3 FLS4 \
            --output build/cnitidissima_fls_source/fls_term_context.json
      - name: Report
        if: always()
        run: |
          for f in summary.json supplement_manifest.csv fls_term_context.json; do
            if [ -f build/cnitidissima_fls_source/$f ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -c 150000 build/cnitidissima_fls_source/$f >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cnitidissima-fls-source-sequence-audit
          path: build/cnitidissima_fls_source
          if-no-files-found: error
