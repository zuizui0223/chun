name: Candidate-free C. japonica Joy Kendrick pilot v0.1

on:
  pull_request:
    paths:
      - 'data/candidate_free_cj_joy_run_manifest_v0_1.csv'
      - 'data/candidate_free_pigment_module_schema_v0_1.csv'
      - 'data/candidate_free_contrast_registry_v0_1.csv'
      - 'scripts/build_candidate_free_family_map_from_gff_v0_1.py'
      - 'scripts/prepare_candidate_free_reference_v0_1.sh'
      - 'scripts/aggregate_salmon_family_expression_v0_1.py'
      - 'scripts/score_candidate_free_modules_v0_1.py'
      - '.github/workflows/candidate-free-cj-joy-pilot-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-free-cj-joy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REF_ACCESSION: GCA_013676235.1
      MAX_SPOTS_PER_RUN: '1000000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RNA-seq and fallback reference tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sra-toolkit salmon gffread unzip ca-certificates
          salmon --version
          fasterq-dump --version
          gffread --version

      - name: Prepare fixed reference through direct-RNA route with fallback
        run: |
          bash scripts/prepare_candidate_free_reference_v0_1.sh build/cj_joy_pilot_v0_1
          cat build/cj_joy_pilot_v0_1/reference_route_diagnostic.txt

      - name: Build outcome-independent transcript family map
        run: |
          python scripts/build_candidate_free_family_map_from_gff_v0_1.py \
            --gff "$GFF" \
            --rna-fasta "$RNA_FASTA" \
            --out-dir build/cj_joy_pilot_v0_1/family_map
          python - <<'PY'
          import json
          s=json.load(open('build/cj_joy_pilot_v0_1/family_map/family_mapping_summary.json'))
          if s['n_mapped_transcripts'] == 0:
              raise SystemExit('No preregistered family is identifiable from the fixed reference annotation')
          print(json.dumps(s,indent=2,ensure_ascii=False))
          PY

      - name: Build Salmon transcript index
        run: |
          salmon index -t "$RNA_FASTA" -i build/cj_joy_pilot_v0_1/salmon_index -p 2

      - name: Subsample and quantify six resolved Joy Kendrick runs
        run: |
          mkdir -p build/cj_joy_pilot_v0_1/quant build/cj_joy_pilot_v0_1/reads
          tail -n +2 data/candidate_free_cj_joy_run_manifest_v0_1.csv | cut -d, -f1 | while read -r RUN; do
            echo "Quantifying $RUN from first ${MAX_SPOTS_PER_RUN} SRA spots"
            rm -f build/cj_joy_pilot_v0_1/reads/${RUN}_1.fastq build/cj_joy_pilot_v0_1/reads/${RUN}_2.fastq
            rm -rf build/cj_joy_pilot_v0_1/reads/tmp_${RUN}
            mkdir -p build/cj_joy_pilot_v0_1/reads/tmp_${RUN}
            fasterq-dump "$RUN" \
              --split-files -e 2 -m 1GB \
              -t build/cj_joy_pilot_v0_1/reads/tmp_${RUN} \
              -O build/cj_joy_pilot_v0_1/reads \
              -X "$MAX_SPOTS_PER_RUN"
            test -s build/cj_joy_pilot_v0_1/reads/${RUN}_1.fastq
            test -s build/cj_joy_pilot_v0_1/reads/${RUN}_2.fastq
            salmon quant \
              -i build/cj_joy_pilot_v0_1/salmon_index -l A \
              -1 build/cj_joy_pilot_v0_1/reads/${RUN}_1.fastq \
              -2 build/cj_joy_pilot_v0_1/reads/${RUN}_2.fastq \
              --validateMappings -p 2 \
              -o build/cj_joy_pilot_v0_1/quant/${RUN}
            rm -f build/cj_joy_pilot_v0_1/reads/${RUN}_1.fastq build/cj_joy_pilot_v0_1/reads/${RUN}_2.fastq
            rm -rf build/cj_joy_pilot_v0_1/reads/tmp_${RUN}
          done

      - name: Aggregate preregistered gene-family expression
        run: |
          python scripts/aggregate_salmon_family_expression_v0_1.py \
            --quant-root build/cj_joy_pilot_v0_1/quant \
            --manifest data/candidate_free_cj_joy_run_manifest_v0_1.csv \
            --family-map build/cj_joy_pilot_v0_1/family_map/transcript_family_map.csv \
            --dataset-id CF_CJ_02 \
            --min-percent-mapped 15 \
            --out build/cj_joy_pilot_v0_1/family_expression.csv

      - name: Score frozen A/F/C/P modules and contrasts
        run: |
          python scripts/score_candidate_free_modules_v0_1.py \
            --expression build/cj_joy_pilot_v0_1/family_expression.csv \
            --modules data/candidate_free_pigment_module_schema_v0_1.csv \
            --contrasts data/candidate_free_contrast_registry_v0_1.csv \
            --out-dir build/cj_joy_pilot_v0_1/scored

      - name: Freeze pilot result summary without expected-direction assertions
        run: |
          python - <<'PY'
          import csv,json,os
          effects=list(csv.DictReader(open('build/cj_joy_pilot_v0_1/scored/contrast_effects.csv')))
          joy=[e for e in effects if e['contrast_id']=='CF_CJ_JOY_RED_PINK']
          if len(joy)!=4:
              raise SystemExit(f'expected four A/F/C/P contrast rows, got {len(joy)}')
          summary={
            'status':'computed_no_direction_forced',
            'contrast':'CF_CJ_JOY_RED_PINK',
            'source':'pink petal region','target':'red petal region',
            'run_count':6,'max_spots_per_run':1000000,
            'reference':'GCA_013676235.1','reference_route':os.environ.get('REFERENCE_ROUTE','unknown'),
            'effects':{e['axis']:{'effect_status':e['effect_status'],
              'hedges_g':None if not e['hedges_g'] else float(e['hedges_g']),
              'direction':e['direction_target_minus_source'],
              'n_source':int(e['n_source']),'n_target':int(e['n_target'])} for e in joy},
            'interpretation_rule':'biological directions are read from output; no expected A/F/C/P direction is a CI pass condition'
          }
          open('build/cj_joy_pilot_v0_1/pilot_result.json','w').write(json.dumps(summary,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY

      - name: Preserve lightweight diagnostics
        if: always()
        run: |
          mkdir -p build/cj_joy_pilot_v0_1/diagnostics
          cp build/cj_joy_pilot_v0_1/reference_contract.txt build/cj_joy_pilot_v0_1/diagnostics/ 2>/dev/null || true
          cp build/cj_joy_pilot_v0_1/reference_route_diagnostic.txt build/cj_joy_pilot_v0_1/diagnostics/ 2>/dev/null || true
          printf 'reference=%s\nmax_spots_per_run=%s\n' "$REF_ACCESSION" "$MAX_SPOTS_PER_RUN" > build/cj_joy_pilot_v0_1/diagnostics/run_contract.txt
          find build/cj_joy_pilot_v0_1 -maxdepth 3 -type f -printf '%p\t%s bytes\n' 2>/dev/null | sort > build/cj_joy_pilot_v0_1/diagnostics/files.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-free-cj-joy-pilot-v0-1
          path: |
            build/cj_joy_pilot_v0_1/family_map/
            build/cj_joy_pilot_v0_1/family_expression.csv
            build/cj_joy_pilot_v0_1/family_expression.summary.json
            build/cj_joy_pilot_v0_1/scored/
            build/cj_joy_pilot_v0_1/pilot_result.json
            build/cj_joy_pilot_v0_1/diagnostics/
          if-no-files-found: warn
