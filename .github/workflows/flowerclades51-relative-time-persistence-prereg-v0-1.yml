name: Flowerclades51 relative-time persistence prereg v0.1

on:
  push:
    branches:
      - analysis/flowerclades51-relative-time-persistence-prereg-v0-1
  pull_request:
    paths:
      - 'requirements-flowerclades51.txt'
      - 'data/flowerclades51_relative_time_persistence_prereg_v0_1.json'
      - 'docs/FLOWERCLADES51_RELATIVE_TIME_PERSISTENCE_PREREG_V0_1.md'
      - 'tests/test_flowerclades51_relative_time_persistence_prereg_v0_1.py'
      - 'tests/test_flowerclades51_relative_time_halfdepth_v0_1.py'
      - 'scripts/run_flowerclades51_relative_time_halfdepth_v0_1.py'
      - 'results/flowerclades51_relative_time_halfdepth_v0_1/**'
      - '.github/workflows/flowerclades51-relative-time-persistence-prereg-v0-1.yml'

jobs:
  validate-prereg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-flowerclades51.txt
      - run: python -m pytest -q tests/test_flowerclades51_relative_time_persistence_prereg_v0_1.py tests/test_flowerclades51_relative_time_halfdepth_v0_1.py
      - name: Validate frozen result if present
        run: |
          if [ -f results/flowerclades51_relative_time_halfdepth_v0_1/result_v0_1.json ]; then
            python - <<'PY'
          import json
          x=json.load(open('results/flowerclades51_relative_time_halfdepth_v0_1/result_v0_1.json'))
          assert x['status']=='FLOWERCLADES51_RELATIVE_TIME_HALFDEPTH_RESULT'
          assert x['completed_clades']==28
          assert x['absolute_time_claim_allowed'] is False
          assert x['paper1_science_changed'] is False
          assert x['el_v0_2_science_changed'] is False
          print(x['cross_resolution'])
          PY
          fi
