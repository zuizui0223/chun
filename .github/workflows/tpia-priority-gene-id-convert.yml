name: TPIA2 priority pigment gene ID convert

on:
  pull_request:
    paths:
      - 'data/tpia_priority_legacy_gene_ids_v0_1.txt'
      - 'scripts/query_tpia_gene_id_convert.py'
      - '.github/workflows/tpia-priority-gene-id-convert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Query all TPIA2 source namespaces
        run: |
          python scripts/query_tpia_gene_id_convert.py \
            --ids data/tpia_priority_legacy_gene_ids_v0_1.txt \
            --out-dir build/tpia_priority_id_convert
      - name: Report
        if: always()
        run: |
          for f in summary.json attempts.json normalized_rows.csv; do
            if [ -f build/tpia_priority_id_convert/$f ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -c 120000 build/tpia_priority_id_convert/$f >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tpia-priority-pigment-gene-id-convert
          path: build/tpia_priority_id_convert
          if-no-files-found: error
