name: Complete ANR handoff and enable auto-merge

on:
  push:
    branches:
      - agent/anr-reference-copy-resolution
    paths:
      - 'data/anr_conservative_summary_v0_1.json'
      - 'data/orthology_resolution_by_feature_v0_3.csv'
      - 'data/micro_accessibility_node_score_harmonized_v0_3.csv'
      - 'data/pigment_node_source_id_crosswalk_v0_3.csv'
      - '.github/workflows/anr-complete-and-auto-merge.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check conservative completion gate
        id: gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('data/anr_conservative_summary_v0_1.json')
          ready = False
          if path.exists():
              s = json.loads(path.read_text(encoding='utf-8'))
              ready = (
                  s.get('sequence_screen_complete') is True
                  and s.get('effect_screen_complete') is True
                  and s.get('reference_lineage_anchored_clusters') == 2
                  and s.get('species_native_strict_node_clusters') == 0
                  and s.get('strict_crossspecies_exact_recurrence_clusters') == 0
              )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'ready={str(ready).lower()}\n')
          print('completion gate:', ready)
          PY

      - name: Build issue update
        if: steps.gate.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.load(open('data/anr_conservative_summary_v0_1.json'))
          marker = '<!-- anr-reference-copy-resolution -->'
          text = f"""{marker}
## ANR copy/paralog resolution

The recurrent ANR family has now been tested at full-length reference-copy resolution.

- exact tea source anchor protein: `{s['source_anchor_protein_accession']}`;
- source-anchor resolution: `{s['source_anchor_resolution']}`;
- closest tea-reference target: `{s['best_reference_target']}`;
- best non-gap protein identity: `{s['best_reference_identity']}`;
- margin over the runner-up: `{s['identity_margin_over_runner_up']}`;
- reference-copy direction heterogeneity: `{s['reference_copy_direction_heterogeneity']}`.

Authoritative ANR state:

- family recurrence clusters = `2`;
- reference-lineage-anchored clusters = `2`;
- species-native strict-node clusters = `0`;
- strict cross-species exact recurrence = `0`;
- family/module predictor = `2`;
- strict-node predictor = `0`.

Interpretation: ANR recurrence is real at family/module level, but the *C. reticulata* evidence is still based on tea-reference targets. The analysis can resolve which reference copies are closest to the exact tea source anchor and whether copies move in different directions; it cannot promote them to species-native exact-node recurrence.

FLS, DFR, ANS/LDOX, and ANR recurrent-family audits are now complete. The next stage is the held-out macro test using family/module predictors, while strict-node predictors remain zero where species-native recurrence is absent.
"""
          Path('build').mkdir(exist_ok=True)
          Path('build/anr_issue_comment.md').write_text(text, encoding='utf-8')
          PY

      - name: Create or update the ANR result comment on issue 19
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- anr-reference-copy-resolution -->'
          comment_id=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/19/comments \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            body=$(cat build/anr_issue_comment.md)
            gh api --method PATCH repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id} -f body="$body" >/dev/null
          else
            gh issue comment 19 --body-file build/anr_issue_comment.md
          fi

      - name: Mark the pull request ready and enable normal auto-merge
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number')
          test -n "$pr"
          gh pr ready "$pr" || true
          gh pr merge "$pr" --auto --squash --delete-branch
