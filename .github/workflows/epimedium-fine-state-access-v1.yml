name: epimedium-fine-state-access-v1
on:
  push:
    branches: [analysis/falsification-audit-v1]
    paths:
      - 'scripts/probe_epimedium_fine_state_access_v1.py'
      - '.github/workflows/epimedium-fine-state-access-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests biopython
      - name: Rebuild source and audit exact OpenTree admission only
        run: python scripts/probe_epimedium_fine_state_access_v1.py
      - name: Assert endpoint remains unopened
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('analysis/_generated/epimedium_fine_state_access_v1/result.json').read_text())
          assert x['endpoint_prefrozen'] is False
          assert x['sankoff_computed'] is False
          assert x['permutation_test_computed'] is False
          print('Epimedium access gate=',x['access_gate'],'n=',x['induced_tree_overlap_n'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epimedium-fine-state-access-v1
          path: analysis/_generated/epimedium_fine_state_access_v1/
          if-no-files-found: warn
