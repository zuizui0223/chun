name: Flower-clades-51 memory architecture v0.1

on:
  pull_request:
    paths:
      - 'data/flowerclades51_memory_architecture_design_v0_1.json'
      - 'scripts/analyze_flowerclades51_memory_architecture_v0_1.py'
      - 'tests/test_flowerclades51_memory_architecture_v0_1.py'
      - 'results/flowerclades51_memory_architecture_v0_1/**'
      - 'docs/FLOWERCLADES51_MEMORY_ARCHITECTURE_RESULT_V0_1.md'
      - '.github/workflows/flowerclades51-memory-architecture-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install numpy pandas scipy pytest
      - name: Unit tests
        run: pytest -q tests/test_flowerclades51_memory_architecture_v0_1.py
      - name: Run memory-architecture analysis
        run: |
          python scripts/analyze_flowerclades51_memory_architecture_v0_1.py \
            --profiles results/flowerclades51_resolution_profile_v0_1/flowerclades51_resolution_profile_summary_v0_1.csv \
            --persistence data/flowerclades51_fine_time_persistence_clades_v0_1.csv \
            --out results/flowerclades51_memory_architecture_v0_1/result_v0_1.json
      - name: Validate frozen exploratory summary
        run: |
          python - <<'PY'
          import json, math
          full=json.load(open('results/flowerclades51_memory_architecture_v0_1/result_v0_1.json'))
          frozen=json.load(open('results/flowerclades51_memory_architecture_v0_1/summary_v0_1.json'))
          assert full['status']==frozen['status']
          assert full['profile_architecture']['n_clades']==frozen['n_clades']==28
          for k,v in frozen['variance_share'].items():
              assert math.isclose(full['profile_architecture']['variance_share'][k],v,rel_tol=0,abs_tol=1e-12)
          assert math.isclose(full['temporal_bridge']['amplitude_vs_slope']['rho'],frozen['temporal_bridge']['amplitude_vs_slope']['rho'],abs_tol=1e-12)
          assert math.isclose(full['temporal_bridge']['amplitude_vs_area']['rho'],frozen['temporal_bridge']['amplitude_vs_area']['rho'],abs_tol=1e-12)
          assert frozen['el_v0_3_science_changed'] is False
          assert frozen['paper1_science_changed'] is False
          print(json.dumps(full['headline'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flowerclades51-memory-architecture-v0-1
          path: results/flowerclades51_memory_architecture_v0_1/
