name: Camellia reticulata reported effect pilot

on:
  pull_request:
    paths:
      - 'scripts/fetch_pmc_oa_supplement_manifest.py'
      - 'scripts/inspect_tabular_supplements.py'
      - 'scripts/extract_creticulata_reported_pathway_effects.py'
      - '.github/workflows/camellia-reticulata-reported-effect-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Fetch PMC9725097 OA package
        run: |
          python scripts/fetch_pmc_oa_supplement_manifest.py \
            --pmcid PMC9725097 \
            --out-dir build/creticulata_reported_effect
      - name: Inspect tabular supplements
        run: |
          python scripts/inspect_tabular_supplements.py \
            --root build/creticulata_reported_effect \
            --output build/creticulata_reported_effect/table_inspection.csv
      - name: Extract expression and metabolite state-vector effects
        run: |
          python scripts/extract_creticulata_reported_pathway_effects.py \
            --table1 build/creticulata_reported_effect/package/PMC9725097/Table1.xlsx \
            --table4 build/creticulata_reported_effect/package/PMC9725097/Table4.xlsx \
            --out-dir build/creticulata_reported_effect/effects
      - name: Report
        if: always()
        run: |
          echo '### C. reticulata red/pink/white quantitative supplement audit' >> "$GITHUB_STEP_SUMMARY"
          for f in summary.json supplement_manifest.csv table_inspection.csv inspection_failures.json effects/summary.json effects/key_ufgt_gene_effects.csv effects/key_ufgt_module_effects.csv effects/broad_homolog_summary.csv effects/metabolite_class_effects.csv effects/metabolite_state_vector_contrasts.csv; do
            if [ -f "build/creticulata_reported_effect/$f" ]; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -c 50000 "build/creticulata_reported_effect/$f" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camellia-reticulata-reported-effect-pilot
          path: |
            build/creticulata_reported_effect/summary.json
            build/creticulata_reported_effect/supplement_manifest.csv
            build/creticulata_reported_effect/table_inspection.csv
            build/creticulata_reported_effect/inspection_failures.json
            build/creticulata_reported_effect/effects
            build/creticulata_reported_effect/package/PMC9725097/Table1.xlsx
            build/creticulata_reported_effect/package/PMC9725097/Table4.xlsx
          if-no-files-found: error
