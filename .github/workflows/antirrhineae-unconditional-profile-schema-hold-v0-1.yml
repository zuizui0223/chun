name: Antirrhineae unconditional profile schema hold v0.1

on:
  pull_request:
    paths:
      - 'data/antirrhineae_unconditional_profile_schema_hold_v0_1.json'
      - 'docs/ANTIRRHINEAE_UNCONDITIONAL_PROFILE_SCHEMA_HOLD_V0_1.md'
      - 'scripts/validate_antirrhineae_unconditional_profile_schema_hold_v0_1.py'
      - '.github/workflows/antirrhineae-unconditional-profile-schema-hold-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate schema hold against frozen Antirrhineae source result
        run: python scripts/validate_antirrhineae_unconditional_profile_schema_hold_v0_1.py
      - name: Confirm Paper 1 science firewall
        if: github.event_name == 'pull_request'
        run: git diff --exit-code ${{ github.event.pull_request.base.sha }}...HEAD -- manuscript data/paper1_authoritative_results_v0_2_2.csv data/paper1_main_figure_manifest_v0_2_2.csv
