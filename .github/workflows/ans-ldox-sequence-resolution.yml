name: ANS LDOX sequence resolution

on:
  pull_request:
    paths:
      - 'data/ans_ldox_source_features_v0_1.csv'
      - 'data/ans_ldox_reference_accessions_v0_1.csv'
      - 'data/ans_ldox_sequence_manifest_v0_1.csv'
      - 'data/ans_ldox_source_feature_resolution_v0_1.csv'
      - 'data/ans_ldox_primer_linkage_v0_1.csv'
      - 'data/ans_ldox_protein_reference_similarity_v0_1.csv'
      - 'data/ans_ldox_sequence_resolution_summary_v0_1.json'
      - 'scripts/analyze_ans_ldox_sequence_resolution.py'
      - 'docs/ANS_LDOX_SEQUENCE_RESOLUTION_RESULT.md'
      - '.github/workflows/ans-ldox-sequence-resolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis tools
        run: |
          python -m pip install --disable-pip-version-check biopython
          sudo apt-get update -qq
          sudo apt-get install -y -qq ncbi-blast+ unzip
          curl --fail --location --retry 4 \
            -o "$RUNNER_TEMP/datasets" \
            'https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets'
          chmod +x "$RUNNER_TEMP/datasets"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/datasets" version

      - name: Download the three reference-mapped tea features
        run: |
          set -u
          mkdir -p build/ans_ldox/raw/tea
          for gene_id in 114274940 114288034 114295638; do
            symbol="LOC${gene_id}"
            zip="build/ans_ldox/raw/${symbol}.zip"
            dest="build/ans_ldox/raw/tea/${symbol}"
            mkdir -p "$dest"
            if datasets download gene gene-id "$gene_id" \
              --include rna,cds,protein,product-report \
              --no-progressbar \
              --filename "$zip"; then
              unzip -q "$zip" -d "$dest"
            else
              echo "NCBI Gene package unavailable for ${symbol}" | tee "$dest/DOWNLOAD_FAILED.txt"
            fi
          done

      - name: Download the oil-Camellia reference annotation used by the sasanqua study
        run: |
          mkdir -p build/ans_ldox/raw/oleifera
          datasets download genome accession GCA_022316695.1 \
            --include rna,cds,protein,gff3 \
            --no-progressbar \
            --filename build/ans_ldox/raw/oleifera.zip
          unzip -q build/ans_ldox/raw/oleifera.zip \
            -d build/ans_ldox/raw/oleifera

      - name: Resolve source features, primer links, and ANS reference similarity
        env:
          NCBI_EMAIL: chun-ci@users.noreply.github.com
        run: |
          python scripts/analyze_ans_ldox_sequence_resolution.py \
            --source-features data/ans_ldox_source_features_v0_1.csv \
            --references data/ans_ldox_reference_accessions_v0_1.csv \
            --tea-root build/ans_ldox/raw/tea \
            --oleifera-root build/ans_ldox/raw/oleifera \
            --out-dir build/ans_ldox/result \
            --email "$NCBI_EMAIL"

      - name: Validate analysis contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('build/ans_ldox/result')
          summary = json.loads((root / 'summary.json').read_text())
          assert summary['source_feature_count'] == 7
          assert summary['reticulata_reference_loc_features_total'] == 3
          with (root / 'sequence_manifest.csv').open(newline='') as handle:
              manifest = list(csv.DictReader(handle))
          assert sum(row['record_class'] == 'reference_protein' for row in manifest) == 3
          for name in [
              'source_feature_resolution.csv',
              'primer_linkage.csv',
              'protein_reference_similarity.csv',
          ]:
              assert (root / name).exists(), name
          PY

      - name: Verify frozen outputs when present
        run: |
          set -eu
          for pair in \
            "data/ans_ldox_sequence_manifest_v0_1.csv build/ans_ldox/result/sequence_manifest.csv" \
            "data/ans_ldox_source_feature_resolution_v0_1.csv build/ans_ldox/result/source_feature_resolution.csv" \
            "data/ans_ldox_primer_linkage_v0_1.csv build/ans_ldox/result/primer_linkage.csv" \
            "data/ans_ldox_protein_reference_similarity_v0_1.csv build/ans_ldox/result/protein_reference_similarity.csv" \
            "data/ans_ldox_sequence_resolution_summary_v0_1.json build/ans_ldox/result/summary.json"; do
            set -- $pair
            if [ -f "$1" ]; then
              diff --strip-trailing-cr -u "$1" "$2"
            fi
          done

      - name: Report
        if: always()
        run: |
          echo '### ANS/LDOX source sequence resolution' >> "$GITHUB_STEP_SUMMARY"
          for f in source_feature_resolution.csv primer_linkage.csv protein_reference_similarity.csv sequence_manifest.csv summary.json; do
            if [ -f "build/ans_ldox/result/$f" ]; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -c 60000 "build/ans_ldox/result/$f" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ans-ldox-sequence-resolution
          path: |
            build/ans_ldox/result
            build/ans_ldox/raw/tea/*/DOWNLOAD_FAILED.txt
          if-no-files-found: error
