name: ANR reference-copy diagnostic

on:
  push:
    branches:
      - agent/anr-reference-copy-resolution
    paths:
      - 'data/anr_reference_copy_targets_v0_1.csv'
      - 'scripts/diagnose_anr_reference_copy_resolution.py'
      - '.github/workflows/anr-reference-copy-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mafft fasttree unzip
          python -m pip install --disable-pip-version-check biopython requests

      - name: Recover Longjing43 public GFF and protein sources
        env:
          SOURCE_REGISTRY: data/cnfls2_synteny_sources_v0_1.csv
        run: |
          mkdir -p build/anr/sources/longjing43
          python - <<'PY'
          import csv
          import pathlib
          import re
          import time
          import urllib.parse
          import urllib.request

          registry = pathlib.Path('data/cnfls2_synteny_sources_v0_1.csv')
          if not registry.exists():
              raise SystemExit(f'missing {registry}')
          rows = list(csv.DictReader(registry.open(encoding='utf-8-sig')))
          selected = []
          for row in rows:
              joined = ' '.join(str(v) for v in row.values()).lower()
              if not any(x in joined for x in ('longjing43', 'longjing 43', 'camellia sinensis', 'tea_')):
                  continue
              for key, value in row.items():
                  value = (value or '').strip()
                  if not re.match(r'^https?://', value):
                      continue
                  context = (key + ' ' + value + ' ' + joined).lower()
                  if any(x in context for x in ('gff', 'annotation')):
                      kind = 'gff'
                  elif any(x in context for x in ('protein', 'proteome', 'faa', 'pep')):
                      kind = 'protein'
                  else:
                      continue
                  selected.append((kind, value))
          dedup = []
          seen = set()
          for item in selected:
              if item not in seen:
                  seen.add(item)
                  dedup.append(item)
          for kind, url in dedup:
              suffix = pathlib.Path(urllib.parse.urlparse(url).path).suffixes
              ext = ''.join(suffix[-2:]) if suffix else ''
              if kind == 'gff':
                  target = pathlib.Path('build/anr/sources/longjing43/longjing43.gff' + ('.gz' if url.endswith('.gz') else ''))
              else:
                  target = pathlib.Path('build/anr/sources/longjing43/longjing43.protein.faa' + ('.gz' if url.endswith('.gz') else ''))
              if target.exists() and target.stat().st_size > 1000:
                  continue
              error = None
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'chun-anr-resolution/0.1'})
                      with urllib.request.urlopen(req, timeout=180) as response:
                          body = response.read()
                      if len(body) < 1000:
                          raise RuntimeError(f'source too small: {len(body)} bytes')
                      target.write_bytes(body)
                      print(kind, url, target, len(body))
                      break
                  except Exception as exc:
                      error = exc
                      time.sleep(2 ** attempt)
              else:
                  raise RuntimeError(f'failed to download {kind} source {url}: {error}')
          gffs = list(pathlib.Path('build/anr/sources/longjing43').glob('*.gff*'))
          prots = list(pathlib.Path('build/anr/sources/longjing43').glob('*.faa*'))
          if not gffs or not prots:
              raise RuntimeError(f'Longjing43 registry recovery incomplete: gff={gffs}, proteins={prots}')
          PY

      - name: Download NCBI tea reference annotation
        run: |
          mkdir -p build/anr/sources/refseq
          base=https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/004/153/795/GCF_004153795.1_AHAU_CSS_1
          curl --fail --location --retry 5 --retry-delay 3 \
            "$base/GCF_004153795.1_AHAU_CSS_1_genomic.gff.gz" \
            -o build/anr/sources/refseq/tea_refseq.gff.gz
          curl --fail --location --retry 5 --retry-delay 3 \
            "$base/GCF_004153795.1_AHAU_CSS_1_protein.faa.gz" \
            -o build/anr/sources/refseq/tea_refseq.protein.faa.gz

      - name: Recover frozen C. reticulata effect artifact
        id: effects
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/anr/effect_artifact
          gh api repos/zuizui0223/chun/actions/artifacts/9287119758/zip \
            > build/anr/effect_artifact.zip
          unzip -q build/anr/effect_artifact.zip -d build/anr/effect_artifact
          test -f build/anr/effect_artifact/effects/broad_homolog_audit.csv

      - name: Run ANR diagnostic
        run: |
          long_gff=$(find build/anr/sources/longjing43 -type f -name '*.gff*' | head -n 1)
          long_prot=$(find build/anr/sources/longjing43 -type f -name '*.faa*' | head -n 1)
          effect_arg=()
          if [ -f build/anr/effect_artifact/effects/broad_homolog_audit.csv ]; then
            effect_arg=(--effects build/anr/effect_artifact/effects/broad_homolog_audit.csv)
          fi
          python scripts/diagnose_anr_reference_copy_resolution.py \
            --targets data/anr_reference_copy_targets_v0_1.csv \
            --longjing43-gff "$long_gff" \
            --longjing43-proteins "$long_prot" \
            --refseq-gff build/anr/sources/refseq/tea_refseq.gff.gz \
            --refseq-proteins build/anr/sources/refseq/tea_refseq.protein.faa.gz \
            "${effect_arg[@]}" \
            --out-dir build/anr/result

      - name: Build exploratory alignment and tree
        run: |
          mafft --auto build/anr/result/anr_candidates.faa \
            > build/anr/result/anr_candidates.aligned.faa
          FastTree build/anr/result/anr_candidates.aligned.faa \
            > build/anr/result/anr_candidates.fasttree.nwk

      - name: Freeze generated diagnostic on the analysis branch
        run: |
          rm -rf data/anr_reference_copy_diagnostic_v0_1
          mkdir -p data/anr_reference_copy_diagnostic_v0_1
          cp build/anr/result/*.csv data/anr_reference_copy_diagnostic_v0_1/
          cp build/anr/result/*.json data/anr_reference_copy_diagnostic_v0_1/
          cp build/anr/result/*.faa data/anr_reference_copy_diagnostic_v0_1/
          cp build/anr/result/*.nwk data/anr_reference_copy_diagnostic_v0_1/
          cp build/anr/result/ANR_REFERENCE_COPY_DIAGNOSTIC.md docs/ANR_REFERENCE_COPY_DIAGNOSTIC.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/anr_reference_copy_diagnostic_v0_1 docs/ANR_REFERENCE_COPY_DIAGNOSTIC.md
          if git diff --cached --quiet; then
            echo 'No generated diagnostic change.'
          else
            git commit -m 'Freeze ANR reference-copy diagnostic result'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Report
        if: always()
        run: |
          echo '### ANR reference-copy diagnostic' >> "$GITHUB_STEP_SUMMARY"
          for f in \
            build/anr/result/summary.json \
            build/anr/result/source_protein_mapping.csv \
            build/anr/result/anchor_to_reference_identity.csv \
            build/anr/result/reference_copy_effects.csv \
            build/anr/result/anr_candidates.fasttree.nwk; do
            if [ -f "$f" ]; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anr-reference-copy-diagnostic
          path: build/anr
          if-no-files-found: error
