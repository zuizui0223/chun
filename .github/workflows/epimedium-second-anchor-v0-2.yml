name: Epimedium second mechanistic anchor v0.2

on:
  pull_request:
    paths:
      - 'data/epimedium_second_anchor_evidence_v0_2.csv'
      - 'data/epimedium_second_anchor_module_contract_v0_2.csv'
      - 'data/epimedium_second_anchor_gate_v0_2.csv'
      - 'docs/EPIMEDIUM_SECOND_ANCHOR_V0_2.md'
      - 'scripts/validate_epimedium_second_anchor_v0_2.py'
      - '.github/workflows/epimedium-second-anchor-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Epimedium anchor contract
        run: |
          mkdir -p build/epimedium_second_anchor_v0_2
          python scripts/validate_epimedium_second_anchor_v0_2.py \
            --evidence data/epimedium_second_anchor_evidence_v0_2.csv \
            --modules data/epimedium_second_anchor_module_contract_v0_2.csv \
            --gates data/epimedium_second_anchor_gate_v0_2.csv \
            --out build/epimedium_second_anchor_v0_2/summary.json
      - name: Report
        run: cat build/epimedium_second_anchor_v0_2/summary.json >> "$GITHUB_STEP_SUMMARY"
