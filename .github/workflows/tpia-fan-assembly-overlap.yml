name: TPIA Fan assembly overlap

on:
  pull_request:
    paths:
      - 'scripts/fetch_pmc_cloud_media_v0_1.py'
      - 'scripts/build_fan2026_species_colour_seed.py'
      - 'scripts/audit_tpia_fan_assembly_overlap.py'
      - '.github/workflows/tpia-fan-assembly-overlap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl requests
      - name: Acquire Fan Data S1 and deterministic species seed
        run: |
          mkdir -p build/tpia_overlap/package build/tpia_overlap/result
          python scripts/fetch_pmc_cloud_media_v0_1.py \
            --pmcid PMC12946509 \
            --out-dir build/tpia_overlap/package \
            --require-glob '*s002*.xlsx'
          xlsx=$(find build/tpia_overlap/package -type f -iname '*s002*.xlsx' | head -n1);test -n "$xlsx";cp "$xlsx" build/tpia_overlap/DataS1.xlsx
          python scripts/build_fan2026_species_colour_seed.py build/tpia_overlap/DataS1.xlsx --output build/tpia_overlap/fan_seed.csv --audit build/tpia_overlap/fan_seed_audit.json
      - name: Query TPIA public assembly registry
        run: |
          python scripts/audit_tpia_fan_assembly_overlap.py \
            --fan-seed build/tpia_overlap/fan_seed.csv \
            --out-dir build/tpia_overlap/result
      - name: Report
        run: |
          echo '### TPIA × Fan assembly overlap' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY";cat build/tpia_overlap/result/summary.json >> "$GITHUB_STEP_SUMMARY";echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '#### Overlap assemblies' >> "$GITHUB_STEP_SUMMARY";echo '```csv' >> "$GITHUB_STEP_SUMMARY";cat build/tpia_overlap/result/fan_overlap_assemblies.csv >> "$GITHUB_STEP_SUMMARY";echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tpia-fan-assembly-overlap
          path: build/tpia_overlap
          if-no-files-found: error
