name: Cross-radiation EL v0.8 hierarchical-memory figures

on:
  pull_request:
    paths:
      - 'scripts/build_cross_radiation_el_v0_8_hierarchical_memory_figures.py'
      - 'tests/test_cross_radiation_el_v0_8_hierarchical_memory_figures.py'
      - 'data/cross_radiation_el_v0_8_figure_manifest_v0_1.csv'
      - '.github/workflows/cross-radiation-el-v0-8-hierarchical-memory-figures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install matplotlib numpy pandas pytest
      - name: Figure-builder tests
        run: pytest -q tests/test_cross_radiation_el_v0_8_hierarchical_memory_figures.py
      - name: Build candidate figures
        run: |
          python scripts/build_cross_radiation_el_v0_8_hierarchical_memory_figures.py \
            --outdir build/cross_radiation_el_v0_8_figures
      - name: Assert five figure files
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('build/cross_radiation_el_v0_8_figures')
          x=json.load(open(p/'figure_build_manifest_v0_1.json'))
          assert x['status']=='EL_V0_8_HIERARCHICAL_MEMORY_FIGURES_BUILT'
          assert x['candidate']=='Evolution Letters v0.8 hierarchical memory with Schistanthe'
          assert x['current_submission_unchanged']=='Evolution Letters v0.3'
          assert len(x['figures'])==5
          assert all((p/r['filename']).stat().st_size>1000 for r in x['figures'])
          f5=[r for r in x['figures'] if r['figure']==5][0]
          assert 'results/schistanthe_hidden_memory_v0_1/result_v0_1.json' in f5['sources']
          print([(r['figure'],r['filename'],r['bytes']) for r in x['figures']])
          PY
      - name: Validate v0.8 candidate remains non-current
        run: python scripts/validate_cross_radiation_el_v0_8_hierarchical_memory.py
      - name: Confirm v0.7 Ruellia promotion rule unchanged
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/cross_radiation_el_v0_7_ruellia_promotion_rule_v0_1.json'))
          assert x['promotion_allowed_before_ruellia'] is False
          PY
      - name: Confirm frozen EL v0.3 science
        run: python scripts/validate_cross_radiation_el_v0_3_science_freeze_v0_1.py
      - uses: actions/upload-artifact@v4
        with:
          name: cross-radiation-el-v0-8-hierarchical-memory-figures
          path: build/cross_radiation_el_v0_8_figures/
