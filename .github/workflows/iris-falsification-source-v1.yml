name: iris-falsification-source-v1

on:
  push:
    branches:
      - analysis/falsification-audit-v1
    paths:
      - 'analysis/iris_fine_state_falsification_prefreeze_v1.md'
      - 'scripts/inspect_iris_falsification_sources_v1.py'
      - '.github/workflows/iris-falsification-source-v1.yml'
  pull_request:
    paths:
      - 'analysis/iris_fine_state_falsification_prefreeze_v1.md'
      - 'scripts/inspect_iris_falsification_sources_v1.py'
      - '.github/workflows/iris-falsification-source-v1.yml'

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-inspection dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 openpyxl
      - name: Inspect frozen Iris source schema
        run: python scripts/inspect_iris_falsification_sources_v1.py
      - name: Upload source inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-source-inventory-v1
          path: analysis/_generated/iris_source_inventory_v1.json
          if-no-files-found: warn
