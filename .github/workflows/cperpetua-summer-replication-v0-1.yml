name: C. perpetua summer replication audit v0.1

on:
  pull_request:
    paths:
      - 'data/cperpetua_summer_replication_audit_v0_1.csv'
      - 'scripts/validate_cperpetua_summer_replication_v0_1.py'
      - 'docs/CPERPETUA_SUMMER_REPLICATION_AUDIT_V0_1.md'
      - '.github/workflows/cperpetua-summer-replication-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate partial independent summer replication
        run: |
          mkdir -p build/cperpetua_summer_replication_v0_1
          python scripts/validate_cperpetua_summer_replication_v0_1.py \
            --audit data/cperpetua_summer_replication_audit_v0_1.csv \
            --out-dir build/cperpetua_summer_replication_v0_1
      - name: Report
        if: always()
        run: |
          echo '### C. perpetua summer replication audit v0.1' >> "$GITHUB_STEP_SUMMARY"
          cat build/cperpetua_summer_replication_v0_1/summary.json >> "$GITHUB_STEP_SUMMARY" || true
